<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emigro Mailing Admin</title>
<style>
body{margin:0;background:#eef1f3;font-family:Arial,sans-serif;color:#111}.wrap{max-width:1080px;margin:24px auto;padding:0 16px}.box{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.07)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:11px;font-weight:850;color:#666;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9dde1;border-radius:9px}.field textarea{min-height:70px}.product{background:#f7f8f9;border-radius:14px;padding:14px;margin-top:12px}.images{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.note{font-size:12px;color:#74797e;line-height:1.45}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.save{background:#111;color:#fff}.open{background:#ffd400;color:#111;text-decoration:none}.heroHelp{background:#fff7cc;border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px}@media(max-width:700px){.grid,.images{grid-template-columns:1fr}}</style></head>
<body><div class="wrap">
<div class="box"><h1>Emigro Mailing Admin</h1><div class="note">Hero görselleri büyük alan oranına özel. Popup/ürün görselleri ayrı tutulur.</div></div>
<div class="box"><h2>Branding & campagne</h2><div class="grid"><div class="field"><label>Logo URL</label><input id="logo"></div><div class="field"><label>Primaire kleur</label><input id="primary" type="color"></div><div class="field"><label>Donkere kleur</label><input id="dark" type="color"></div><div class="field"><label>Van datum</label><input id="from"></div><div class="field"><label>Tot datum</label><input id="to"></div></div></div>
<div class="box"><h2>Week Hero</h2><div class="heroHelp">Bu alandaki <b>Hero görseli</b> geniş banner oranına göre hazırlanır. Popup açıldığında aşağıdaki normal ürün görselleri kullanılır.</div><div class="grid">
<div class="field"><label>Naam</label><input id="hName"></div><div class="field"><label>Product link</label><input id="hLink"></div><div class="field"><label>Oude prijs</label><input id="hOld"></div><div class="field"><label>Nieuwe prijs</label><input id="hNew"></div><div class="field" style="grid-column:1/-1"><label>Beschrijving</label><textarea id="hDesc"></textarea></div><div class="field"><label>Hero görsel URL</label><input id="hHeroImg"></div><div class="field"><label>Popup görsel sayısı</label><select id="hCount"></select></div><div class="images" id="hImages" style="grid-column:1/-1"></div></div></div>
<div id="groups"></div>
<div class="box"><div class="actions"><button id="save" class="btn save">Opslaan</button><a class="btn open" href="./mailing.html" target="_blank">Mailing openen</a></div></div>
</div>
<script>
const fallback={"colors":{"primary":"#ffd400","dark":"#111315"},"logo":"https://mfatihdumluu-eng.github.io/emigro-catalog/logo.svg","dates":{"from":"5 oktober 2026","to":"11 oktober 2026"},"hero":{"name":"Coca-Cola Original Taste 24 x 330 ml","desc":"Een sterke blikvanger voor retail, horeca en convenience.","oldPrice":"€ 21,95","newPrice":"€ 18,95","link":"https://mfatihdumluu-eng.github.io/emigro-catalog/","heroImage":"","images":[""]},"groups":[{"key":"dranken","label":"Dranken","feature":"4","items":[{"name":"Coca-Cola Zero 24-pack","desc":"Sterke hardloper voor elk koelschap.","oldPrice":"€ 20,49","newPrice":"€ 18,49","link":"#","heroImage":"","images":[""]},{"name":"Fanta Orange 24-pack","desc":"Fris en herkenbaar, ideaal voor retail.","oldPrice":"€ 18,95","newPrice":"€ 16,95","link":"#","heroImage":"","images":[""]}]},{"key":"slagerij","label":"Slagerij","feature":"2","items":[{"name":"Ribeye Premium","desc":"Mals rundvlees voor grill en horeca.","oldPrice":"€ 16,90 / kg","newPrice":"€ 14,90 / kg","link":"#","heroImage":"","images":[""]},{"name":"Kipdijfilet","desc":"Sappig en veelzijdig.","oldPrice":"€ 8,95 / kg","newPrice":"€ 7,95 / kg","link":"#","heroImage":"","images":[""]}]}]};
let data=JSON.parse(localStorage.getItem("emigroMailingConfig")||"null")||fallback;
function countOpts(sel,n){sel.innerHTML="";for(let i=1;i<=4;i++){const o=document.createElement("option");o.value=i;o.textContent=i+" afbeelding(en)";sel.appendChild(o)}sel.value=n}
logo.value=data.logo;primary.value=data.colors.primary;dark.value=data.colors.dark;from.value=data.dates.from;to.value=data.dates.to;hName.value=data.hero.name;hLink.value=data.hero.link;hOld.value=data.hero.oldPrice||"";hNew.value=data.hero.newPrice;hDesc.value=data.hero.desc;hHeroImg.value=data.hero.heroImage||"";countOpts(hCount,(data.hero.images||[""]).length);
function drawHero(){hImages.innerHTML="";for(let i=0;i<+hCount.value;i++){const d=document.createElement("div");d.className="field";d.innerHTML='<label>Popup görsel '+(i+1)+'</label><input value="'+((data.hero.images||[])[i]||"")+'">';hImages.appendChild(d)}}hCount.onchange=drawHero;drawHero();
const ge=document.getElementById("groups");
function render(){ge.innerHTML="";data.groups.forEach((g,gi)=>{const b=document.createElement("div");b.className="box";b.innerHTML='<h2>'+g.label+'</h2><div class="field"><label>İlk ürün layout</label><select data-feature><option value="none">Normal kare</option><option value="2">2 kare yatay</option><option value="3">3 kare yatay</option><option value="4">2x2 büyük Hero</option></select></div><div data-items></div>';ge.appendChild(b);b.querySelector("[data-feature]").value=g.feature||"none";const items=b.querySelector("[data-items]");g.items.forEach((it,ii)=>{const p=document.createElement("div");p.className="product";p.innerHTML='<div class="heroHelp">Hero seçilirse bu ürünün <b>Hero görseli</b> büyük alanda kullanılır. Popup her zaman normal görselleri kullanır.</div><div class="grid"><div class="field"><label>Productnaam</label><input data-k="name" value="'+it.name+'"></div><div class="field"><label>Product link</label><input data-k="link" value="'+(it.link||"")+'"></div><div class="field"><label>Oude prijs</label><input data-k="oldPrice" value="'+(it.oldPrice||"")+'"></div><div class="field"><label>Nieuwe prijs</label><input data-k="newPrice" value="'+it.newPrice+'"></div><div class="field" style="grid-column:1/-1"><label>Beschrijving</label><textarea data-k="desc">'+it.desc+'</textarea></div><div class="field"><label>Hero görsel URL</label><input data-k="heroImage" value="'+(it.heroImage||"")+'"></div><div class="field"><label>Popup görsel sayısı</label><select data-count></select></div><div class="images" data-images style="grid-column:1/-1"></div></div>';items.appendChild(p);const s=p.querySelector("[data-count]");countOpts(s,(it.images||[""]).length);function di(){const w=p.querySelector("[data-images]");w.innerHTML="";for(let x=0;x<+s.value;x++){const d=document.createElement("div");d.className="field";d.innerHTML='<label>Popup görsel '+(x+1)+'</label><input value="'+((it.images||[])[x]||"")+'">';w.appendChild(d)}}s.onchange=di;di()})})}
render();
save.onclick=()=>{data.logo=logo.value;data.colors={primary:primary.value,dark:dark.value};data.dates={from:from.value,to:to.value};data.hero={name:hName.value,link:hLink.value,oldPrice:hOld.value,newPrice:hNew.value,desc:hDesc.value,heroImage:hHeroImg.value,images:[...hImages.querySelectorAll("input")].map(x=>x.value)};[...ge.children].forEach((box,gi)=>{data.groups[gi].feature=box.querySelector("[data-feature]").value;[...box.querySelectorAll(".product")].forEach((p,ii)=>{const it=data.groups[gi].items[ii];p.querySelectorAll("[data-k]").forEach(el=>it[el.dataset.k]=el.value);it.images=[...p.querySelector("[data-images]").querySelectorAll("input")].map(x=>x.value)})});localStorage.setItem("emigroMailingConfig",JSON.stringify(data));alert("Opgeslagen. Mailing is bijgewerkt in deze browser.")};
</script></body></html>
