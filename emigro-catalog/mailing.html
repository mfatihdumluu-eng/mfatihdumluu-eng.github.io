</style></head><body id="top"><div class="shell"><div class="mail"><header><img id="logo" class="logo"><div class="dates"><b>WEEKLY DEALS</b><span id="headerDates"></span></div></header><div class="ribbon">DEZE WEEK • HERO • NIEUW • ACTIE • OP = OP</div><section id="hero" class="hero"></section><nav id="nav" class="nav"></nav><main id="content" class="content"></main><div class="footer">Emigro Weekly Deals • prijzen en beschikbaarheid kunnen wijzigen • OP = OP</div></div></div>

<script>
const sb=supabase.createClient("https://hroarfuwpfsqilsijwpp.supabase.co","sb_publishable_tAn6zZNaqMQW-BLXwXI30g_lmBUWENo");
const fallback={colors:{primary:"#ffd400",dark:"#111315"},logo:"https://mfatihdumluu-eng.github.io/emigro-catalog/logo.svg",dates:{from:"5 oktober 2026",to:"11 oktober 2026"},hero:{name:"Hero product",desc:"",oldPrice:"",newPrice:"",link:"#",heroImage:"",images:[]},groups:[]};
const media=(u)=>u?'<img src="'+u+'" alt="">':'<div class="ph">🛒</div>';let data=fallback,imgs=[],ix=0;
async function init(){const {data:r}=await sb.from("emigro_mailing_state").select("data").eq("id","main").single();if(r?.data&&Object.keys(r.data).length)data=r.data;document.documentElement.style.setProperty("--p",data.colors?.primary||"#ffd400");document.documentElement.style.setProperty("--d",data.colors?.dark||"#111315");logo.src=data.logo||fallback.logo;const dt=(data.dates?.from||"")+" t/m "+(data.dates?.to||"");headerDates.textContent=dt;modalDates.textContent="Geldig: "+dt;render()}
function render(){hero.innerHTML='<div class="heroCopy"><div class="eyebrow">Hero van de week</div><h1>'+data.hero.name+'</h1><p>'+data.hero.desc+'</p><div class="old">'+(data.hero.oldPrice||"")+'</div><div class="new">'+(data.hero.newPrice||"")+'</div><a class="heroBtn" href="'+(data.hero.link||"#")+'" target="_blank">Bekijk product →</a></div><div class="heroVisual">'+media(data.hero.heroImage)+'</div>';nav.innerHTML="";content.innerHTML="";(data.groups||[]).forEach(g=>{const a=document.createElement("a");a.href="#sec-"+g.key;a.textContent=g.label;nav.appendChild(a);const s=document.createElement("section");s.className="section";s.id="sec-"+g.key;s.innerHTML='<div class="sectionHead"><div><div class="eyebrow" style="color:#2563eb">'+g.label+'</div><h2>'+g.label+'</h2></div><span>Klik voor details</span></div><div class="grid"></div><div class="topback"><a href="#top">↑ Terug naar boven</a></div>';const grid=s.querySelector(".grid");(g.items||[]).forEach((p,i)=>{const c=document.createElement("article");let cls="card";if(i===0&&g.feature==="2")cls+=" span2";if(i===0&&g.feature==="3")cls+=" span3";if(i===0&&g.feature==="4")cls+=" span4";c.className=cls;const u=(i===0&&g.feature!=="none"&&p.heroImage)?p.heroImage:(p.images||[])[0];c.innerHTML='<div class="visual">'+media(u)+'</div><div class="cardBody"><div class="name">'+p.name+'</div><div class="desc">'+p.desc+'</div><div class="prices"><div class="old">'+(p.oldPrice||"")+'</div><div class="new">'+(p.newPrice||"")+'</div></div></div>';c.onclick=()=>openModal(g.label,p);grid.appendChild(c)});content.appendChild(s)})}
function openModal(label,p){modalDept.textContent=label;modalTitle.textContent=p.name;modalText.textContent=p.desc;modalOld.textContent=p.oldPrice||"";modalNew.textContent=p.newPrice||"";productLink.href=p.link||"#";imgs=(p.images||[]).filter(Boolean);if(!imgs.length)imgs=[""];ix=0;showImg();modal.classList.add("open")}
function showImg(){modalVisual.innerHTML=media(imgs[ix]);dots.innerHTML="";imgs.forEach((_,i)=>{const b=document.createElement("button");if(i===ix)b.className="active";b.onclick=()=>{ix=i;showImg()};dots.appendChild(b)})}
function shut(){modal.classList.remove("open")}closeBtn.onclick=shut;close2.onclick=shut;modal.onclick=e=>{if(e.target===modal)shut()};init();
</script></body></html>
