<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emigro Weekly Deals</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--page:#edf0f2;--header:#111315;--ribbon:#ffd400;--hero:#15191d;--hero-text:#fff;--button:#ffd400;--nav:#171a1d;--card:#fff;--accent:#2563eb;--muted:#70757b;--line:#e6e8ea;--logo-w:136px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);font-family:Arial,sans-serif}.shell{padding:24px 12px 50px}.mail{max-width:780px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.13)}header{background:var(--header);color:#fff;padding:21px 26px;display:flex;justify-content:space-between;align-items:center}.logo{width:var(--logo-w);max-height:90px;object-fit:contain}.dates{font-size:11px;color:#aeb4ba;text-align:right}.dates b{display:block;color:#fff}.ribbon{background:var(--ribbon);padding:10px 26px;font-size:11px;font-weight:950}
.heroWrap{position:relative;background:var(--hero);color:var(--hero-text);overflow:hidden}.heroSlide{display:none;grid-template-columns:1.05fr .95fr;min-height:390px}.heroSlide.active{display:grid}.heroCopy{padding:42px 34px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:950;color:var(--button)}.heroSlide h1{font-size:45px;line-height:.98;margin:10px 0 13px}.heroSlide p{color:color-mix(in srgb,var(--hero-text) 72%,transparent);line-height:1.55;font-size:15px}.old{font-size:12px;color:#9ca3af;text-decoration:line-through}.new{font-size:22px;font-weight:950}.heroSlide .new{font-size:43px}.heroVisual{padding:28px}.heroVisual img,.heroVisual .ph{width:100%;height:100%;min-height:300px;object-fit:cover;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:90px}.heroBtn{display:inline-block;background:var(--button);color:#111;padding:13px 18px;border-radius:10px;font-weight:950;font-size:13px;margin-top:18px;width:max-content;text-decoration:none}
.heroArrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:24px;cursor:pointer}.heroPrev{left:10px}.heroNext{right:10px}.heroDots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;z-index:4}.heroDots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.45);padding:0}.heroDots button.active{background:var(--button)}
.nav{background:var(--nav);padding:12px 20px;display:flex;gap:8px;overflow:auto}.nav a{color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850;white-space:nowrap;text-decoration:none}.content{padding:32px 22px 42px}.section{margin-top:34px}.section:first-child{margin-top:0}.sectionHead{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}.sectionHead h2{margin:4px 0 0;font-size:23px}.sectionHead span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;gap:10px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--cat-card,var(--card));cursor:pointer}.card.span2{grid-column:span 2}.card.span3{grid-column:span 3}.card.span4{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:1.05fr .95fr}.visual{aspect-ratio:1/1;background:#f0f2f4;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.ph{font-size:44px}.span2 .visual{aspect-ratio:2/1}.span3 .visual{aspect-ratio:3/1}.span4 .visual{aspect-ratio:auto;height:100%;min-height:290px}.cardBody{padding:12px}.name{font-size:13px;font-weight:950}.desc{font-size:10px;color:var(--muted);margin-top:5px}.prices{margin-top:9px}.prices .new{font-size:20px}.span4 .cardBody{padding:18px;display:flex;flex-direction:column;justify-content:center}.span4 .name{font-size:22px}.span4 .prices .new{font-size:30px}.topback{text-align:right;margin-top:10px}.topback a{font-size:10px;font-weight:900;color:#555}.footer{background:#111;color:#999;padding:24px;text-align:center;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}.modal.open{display:flex}.dialog{width:min(680px,100%);background:#fff;border-radius:22px;overflow:hidden;position:relative}.datebar{background:var(--button);padding:12px 20px;font-size:12px;font-weight:950}.close{position:absolute;right:12px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#fff;font-size:20px}.modalGrid{display:grid;grid-template-columns:250px 1fr}.modalVisual{min-height:300px;background:#eef1f3;display:flex;align-items:center;justify-content:center;overflow:hidden}.modalVisual img{width:100%;height:100%;object-fit:cover}.modalBody{padding:28px}.modalDept{font-size:10px;color:var(--accent);font-weight:950}.modalTitle{font-size:28px;font-weight:950;margin:8px 0}.modalText{font-size:13px;color:var(--muted)}.modalNew{font-size:36px;font-weight:950}.dots{display:flex;gap:6px;margin:12px 0}.dots button{width:8px;height:8px;border:0;border-radius:50%;background:#c5c9cd}.dots button.active{background:#111}.actions{display:flex;gap:8px}.btn{padding:12px 14px;border-radius:9px;border:0;font-weight:900;font-size:12px;text-decoration:none}.dark{background:#111;color:#fff}.yellow{background:var(--button);color:#111}
@media(max-width:700px){.shell{padding:0}.mail{border-radius:0}.heroSlide{grid-template-columns:1fr}.heroCopy{padding:32px 18px 18px}.heroSlide h1{font-size:36px}.heroVisual{padding:0 18px 30px}.heroVisual img,.heroVisual .ph{min-height:210px}.grid{grid-template-columns:repeat(2,1fr)}.card.span3{grid-column:span 2}.card.span4{grid-column:span 2;grid-row:span 1;display:grid;grid-template-columns:1fr 1fr}.content{padding:26px 14px}.modalGrid{grid-template-columns:1fr}.modalVisual{min-height:190px}}
</style></head>
<body id="top"><div class="shell"><div class="mail"><header><img id="logo" class="logo"><div class="dates"><b>WEEKLY DEALS</b><span id="headerDates"></span></div></header><div class="ribbon">DEZE WEEK • HERO • NIEUW • ACTIE • OP = OP</div><section id="heroWrap" class="heroWrap"></section><nav id="nav" class="nav"></nav><main id="content" class="content"></main><div class="footer">Emigro Weekly Deals • prijzen en beschikbaarheid kunnen wijzigen • OP = OP</div></div></div>
<div id="modal" class="modal"><div class="dialog"><div id="modalDates" class="datebar"></div><button id="closeBtn" class="close">×</button><div class="modalGrid"><div id="modalVisual" class="modalVisual"></div><div class="modalBody"><div id="modalDept" class="modalDept"></div><div id="modalTitle" class="modalTitle"></div><div id="modalText" class="modalText"></div><div id="modalOld" class="old"></div><div id="modalNew" class="modalNew"></div><div id="dots" class="dots"></div><div class="actions"><button id="close2" class="btn dark">Sluiten</button><a id="productLink" class="btn yellow" target="_blank">Naar productpagina →</a></div></div></div></div></div>
<script>
const sb=supabase.createClient("https://hroarfuwpfsqilsijwpp.supabase.co","sb_publishable_tAn6zZNaqMQW-BLXwXI30g_lmBUWENo");
const baseDesign={logoWidth:136,pageBg:"#edf0f2",headerColor:"#111315",ribbonColor:"#ffd400",heroBg:"#15191d",heroText:"#ffffff",buttonColor:"#ffd400",navBg:"#171a1d",cardBg:"#ffffff",accentColor:"#2563eb"};
const fallback={design:baseDesign,logo:"https://mfatihdumluu-eng.github.io/emigro-catalog/logo.svg",dates:{from:"",to:""},heroSlides:[],groups:[]};
const media=u=>u?'<img src="'+u+'" alt="">':'<div class="ph">🛒</div>';let data=fallback,imgs=[],ix=0,heroIx=0,heroTimer=null;
async function init(){const {data:r}=await sb.from("emigro_mailing_state").select("data").eq("id","main").single();if(r?.data&&Object.keys(r.data).length)data=r.data;normalize();applyDesign();const dt=(data.dates?.from||"")+" t/m "+(data.dates?.to||"");headerDates.textContent=dt;modalDates.textContent="Geldig: "+dt;logo.src=data.logo||fallback.logo;render()}
function normalize(){data.design={...baseDesign,...(data.design||{})};if(!data.heroSlides&&data.hero)data.heroSlides=[{name:data.hero.name||"",desc:data.hero.desc||"",oldPrice:data.hero.oldPrice||"",newPrice:data.hero.newPrice||"",heroImage:data.hero.heroImage||"",targetType:"external",categoryKey:"",externalLink:data.hero.link||""}];data.heroSlides||=[];data.groups||=[];data.groups.forEach(g=>{g.items||=[];g.feature||="none";g.cardColor=g.cardColor||""})}
function applyDesign(){const d=data.design;document.documentElement.style.setProperty("--page",d.pageBg);document.documentElement.style.setProperty("--header",d.headerColor);document.documentElement.style.setProperty("--ribbon",d.ribbonColor);document.documentElement.style.setProperty("--hero",d.heroBg);document.documentElement.style.setProperty("--hero-text",d.heroText);document.documentElement.style.setProperty("--button",d.buttonColor);document.documentElement.style.setProperty("--nav",d.navBg);document.documentElement.style.setProperty("--card",d.cardBg);document.documentElement.style.setProperty("--accent",d.accentColor);document.documentElement.style.setProperty("--logo-w",(d.logoWidth||136)+"px")}
function heroHref(h){if(h.targetType==="external"&&h.externalLink)return h.externalLink;if(h.categoryKey)return "#sec-"+h.categoryKey;return"#"}
function renderHeroes(){heroWrap.innerHTML="";if(!data.heroSlides.length)return;data.heroSlides.forEach((h,i)=>{const s=document.createElement("div");s.className="heroSlide"+(i===heroIx?" active":"");s.innerHTML='<div class="heroCopy"><div class="eyebrow">Hero van de week</div><h1>'+h.name+'</h1><p>'+h.desc+'</p><div class="old">'+(h.oldPrice||"")+'</div><div class="new">'+(h.newPrice||"")+'</div><a class="heroBtn" href="'+heroHref(h)+'" '+(h.targetType==="external"?'target="_blank"':'')+'>Bekijk →</a></div><div class="heroVisual"><a href="'+heroHref(h)+'" '+(h.targetType==="external"?'target="_blank"':'')+'>'+media(h.heroImage)+'</a></div>';heroWrap.appendChild(s)});if(data.heroSlides.length>1){heroWrap.insertAdjacentHTML("beforeend",'<button class="heroArrow heroPrev">‹</button><button class="heroArrow heroNext">›</button><div class="heroDots"></div>');heroWrap.querySelector(".heroPrev").onclick=()=>setHero(heroIx-1);heroWrap.querySelector(".heroNext").onclick=()=>setHero(heroIx+1);drawHeroDots();startHeroTimer()}}
function drawHeroDots(){const d=heroWrap.querySelector(".heroDots");if(!d)return;d.innerHTML="";data.heroSlides.forEach((_,i)=>{const b=document.createElement("button");if(i===heroIx)b.className="active";b.onclick=()=>setHero(i);d.appendChild(b)})}
function setHero(i){heroIx=(i+data.heroSlides.length)%data.heroSlides.length;heroWrap.querySelectorAll(".heroSlide").forEach((s,x)=>s.classList.toggle("active",x===heroIx));drawHeroDots();startHeroTimer()}
function startHeroTimer(){clearInterval(heroTimer);if(data.heroSlides.length>1)heroTimer=setInterval(()=>setHero(heroIx+1),5500)}
function render(){renderHeroes();nav.innerHTML="";content.innerHTML="";data.groups.forEach(g=>{const a=document.createElement("a");a.href="#sec-"+g.key;a.textContent=g.label;nav.appendChild(a);const s=document.createElement("section");s.className="section";s.id="sec-"+g.key;s.style.setProperty("--cat-card",g.cardColor||data.design.cardBg);s.innerHTML='<div class="sectionHead"><div><div class="eyebrow" style="color:var(--accent)">'+g.label+'</div><h2>'+g.label+'</h2></div><span>Klik voor details</span></div><div class="grid"></div><div class="topback"><a href="#top">↑ Terug naar boven</a></div>';const grid=s.querySelector(".grid");g.items.forEach((p,i)=>{const c=document.createElement("article");let cls="card";if(i===0&&g.feature==="2")cls+=" span2";if(i===0&&g.feature==="3")cls+=" span3";if(i===0&&g.feature==="4")cls+=" span4";c.className=cls;const u=(i===0&&g.feature!=="none"&&p.heroImage)?p.heroImage:(p.images||[])[0];c.innerHTML='<div class="visual">'+media(u)+'</div><div class="cardBody"><div class="name">'+p.name+'</div><div class="desc">'+p.desc+'</div><div class="prices"><div class="old">'+(p.oldPrice||"")+'</div><div class="new">'+(p.newPrice||"")+'</div></div></div>';c.onclick=()=>openModal(g.label,p);grid.appendChild(c)});content.appendChild(s)})}
function openModal(label,p){modalDept.textContent=label;modalTitle.textContent=p.name;modalText.textContent=p.desc;modalOld.textContent=p.oldPrice||"";modalNew.textContent=p.newPrice||"";productLink.href=p.link||"#";imgs=(p.images||[]).filter(Boolean);if(!imgs.length)imgs=[""];ix=0;showImg();modal.classList.add("open")}
function showImg(){modalVisual.innerHTML=media(imgs[ix]);dots.innerHTML="";imgs.forEach((_,i)=>{const b=document.createElement("button");if(i===ix)b.className="active";b.onclick=()=>{ix=i;showImg()};dots.appendChild(b)})}
function shut(){modal.classList.remove("open")}closeBtn.onclick=shut;close2.onclick=shut;modal.onclick=e=>{if(e.target===modal)shut()};init();
</script></body></html>
