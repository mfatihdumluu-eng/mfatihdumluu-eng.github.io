<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emigro Weekly Deals</title>
<style>
:root{--primary:#ffd400;--dark:#111315;--muted:#70757b;--line:#e6e8ea}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#edf0f2;font-family:Arial,Helvetica,sans-serif;color:#111}
a{text-decoration:none;color:inherit}.shell{padding:24px 12px 50px}.mail{max-width:780px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.13)}
header{background:var(--dark);color:#fff;padding:21px 26px;display:flex;justify-content:space-between;align-items:center}.logo{width:136px;max-height:44px;object-fit:contain}.dates{font-size:11px;color:#aeb4ba;text-align:right}.dates b{display:block;color:#fff;font-size:12px;letter-spacing:1px}
.ribbon{background:var(--primary);padding:10px 26px;font-size:11px;font-weight:950;letter-spacing:1.1px}
.hero{background:linear-gradient(130deg,#101214,#2c3034);color:#fff;display:grid;grid-template-columns:1.05fr .95fr;min-height:390px}.heroCopy{padding:42px 34px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:950;color:var(--primary)}.hero h1{font-size:45px;line-height:.98;margin:10px 0 13px}.hero p{color:#c8cdd2;line-height:1.55;font-size:15px;margin:0 0 18px}.old{font-size:13px;color:#aeb4ba;text-decoration:line-through}.hero .new{font-size:43px;font-weight:950;line-height:1.05}.heroVisual{padding:28px;display:flex;align-items:center;justify-content:center}.heroVisual img,.heroVisual .ph{width:100%;height:100%;min-height:300px;object-fit:cover;border-radius:24px;background:#2d3236;display:flex;align-items:center;justify-content:center;font-size:90px}
.heroBtn{display:inline-block;background:var(--primary);color:#111;padding:13px 18px;border-radius:10px;font-weight:950;font-size:13px;margin-top:18px;width:max-content}
.nav{background:#171a1d;padding:12px 20px;display:flex;gap:8px;overflow:auto}.nav a{color:#fff;border:1px solid #363a3e;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850;white-space:nowrap}
.content{padding:32px 22px 42px}.section{margin-top:34px}.section:first-child{margin-top:0}.sectionHead{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}.sectionHead h2{margin:4px 0 0;font-size:23px}.sectionHead span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;gap:10px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;cursor:pointer;min-width:0}.card.span2{grid-column:span 2}.card.span3{grid-column:span 3}.card.span4{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:1.05fr .95fr}
.visual{aspect-ratio:1/1;background:#f0f2f4;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.visual img{width:100%;height:100%;object-fit:cover}.visual .ph{font-size:44px}.span2 .visual{aspect-ratio:2/1}.span3 .visual{aspect-ratio:3/1}.span4 .visual{aspect-ratio:auto;height:100%;min-height:290px}
.badge{position:absolute;left:9px;top:9px;background:#fff;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950}.cardBody{padding:12px}.name{font-size:13px;font-weight:950;line-height:1.2}.desc{font-size:10px;color:var(--muted);line-height:1.35;margin-top:5px}.prices{margin-top:9px}.prices .old{font-size:10px;color:#8e9499}.prices .new{font-size:20px;font-weight:950}.span2 .cardBody,.span3 .cardBody{display:flex;justify-content:space-between;align-items:end;gap:14px}.span2 .prices .new,.span3 .prices .new{font-size:24px}.span4 .cardBody{padding:18px;display:flex;flex-direction:column;justify-content:center}.span4 .name{font-size:22px}.span4 .desc{font-size:12px}.span4 .prices .new{font-size:30px}
.topback{text-align:right;margin-top:10px}.topback a{font-size:10px;font-weight:900;color:#555}.footer{background:#111;color:#999;padding:24px;text-align:center;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}.modal.open{display:flex}.dialog{width:min(680px,100%);background:#fff;border-radius:22px;overflow:hidden;position:relative}.datebar{background:var(--primary);padding:12px 20px;font-size:12px;font-weight:950}.close{position:absolute;right:12px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#fff;font-size:20px}.modalGrid{display:grid;grid-template-columns:250px 1fr}.modalVisual{min-height:300px;background:#eef1f3;display:flex;align-items:center;justify-content:center;overflow:hidden}.modalVisual img{width:100%;height:100%;object-fit:cover}.modalVisual .ph{font-size:86px}.modalBody{padding:28px}.modalDept{font-size:10px;color:#2563eb;font-weight:950;letter-spacing:1px}.modalTitle{font-size:28px;font-weight:950;line-height:1.05;margin:8px 0}.modalText{font-size:13px;color:var(--muted);line-height:1.5}.modalOld{font-size:13px;color:#92979c;text-decoration:line-through;margin-top:15px}.modalNew{font-size:36px;font-weight:950;margin:3px 0 16px}.dots{display:flex;gap:6px;margin-bottom:14px}.dots button{width:8px;height:8px;border:0;border-radius:50%;background:#c5c9cd;padding:0}.dots button.active{background:#111}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:12px 14px;border-radius:9px;border:0;font-weight:900;font-size:12px}.dark{background:#111;color:#fff}.yellow{background:var(--primary);color:#111}
@media(max-width:700px){.shell{padding:0}.mail{border-radius:0}.hero{grid-template-columns:1fr}.heroCopy{padding:32px 18px 18px}.hero h1{font-size:36px}.heroVisual{padding:0 18px 22px}.heroVisual img,.heroVisual .ph{min-height:210px}.grid{grid-template-columns:repeat(2,1fr)}.card.span3{grid-column:span 2}.card.span4{grid-column:span 2;grid-row:span 1;display:grid;grid-template-columns:1fr 1fr}.span4 .visual{min-height:180px}.content{padding:26px 14px}.modalGrid{grid-template-columns:1fr}.modalVisual{min-height:190px}}
</style></head>
<body id="top"><div class="shell"><div class="mail">
<header><img id="logo" class="logo"><div class="dates"><b>WEEKLY DEALS</b><span id="headerDates"></span></div></header>
<div class="ribbon">DEZE WEEK • HERO • NIEUW • ACTIE • OP = OP</div>
<section id="hero" class="hero"></section><nav id="nav" class="nav"></nav><main id="content" class="content"></main>
<div class="footer">Emigro Weekly Deals • prijzen en beschikbaarheid kunnen wijzigen • OP = OP</div>
</div></div>
<div id="modal" class="modal"><div class="dialog"><div id="modalDates" class="datebar"></div><button id="closeBtn" class="close">×</button><div class="modalGrid"><div id="modalVisual" class="modalVisual"></div><div class="modalBody"><div id="modalDept" class="modalDept"></div><div id="modalTitle" class="modalTitle"></div><div id="modalText" class="modalText"></div><div id="modalOld" class="modalOld"></div><div id="modalNew" class="modalNew"></div><div id="dots" class="dots"></div><div class="actions"><button id="close2" class="btn dark">Sluiten</button><a id="productLink" class="btn yellow" target="_blank" rel="noopener">Naar productpagina →</a></div></div></div></div></div>
<script>
const fallback={
colors:{primary:"#ffd400",dark:"#111315"},logo:"https://mfatihdumluu-eng.github.io/emigro-catalog/logo.svg",
dates:{from:"5 oktober 2026",to:"11 oktober 2026"},
hero:{name:"Coca-Cola Original Taste 24 x 330 ml",desc:"Een sterke blikvanger voor retail, horeca en convenience.",oldPrice:"€ 21,95",newPrice:"€ 18,95",link:"https://mfatihdumluu-eng.github.io/emigro-catalog/",heroImage:"",images:[""]},
groups:[
{key:"dranken",label:"Dranken",feature:"4",items:[
{name:"Coca-Cola Zero 24-pack",desc:"Sterke hardloper voor elk koelschap.",oldPrice:"€ 20,49",newPrice:"€ 18,49",link:"#",heroImage:"",images:[""]},
{name:"Fanta Orange 24-pack",desc:"Fris en herkenbaar, ideaal voor retail.",oldPrice:"€ 18,95",newPrice:"€ 16,95",link:"#",heroImage:"",images:[""]},
{name:"Sprite 24-pack",desc:"Licht en verfrissend.",oldPrice:"€ 18,49",newPrice:"€ 16,49",link:"#",heroImage:"",images:[""]}]},
{key:"slagerij",label:"Slagerij",feature:"2",items:[
{name:"Ribeye Premium",desc:"Mals rundvlees voor grill en horeca.",oldPrice:"€ 16,90 / kg",newPrice:"€ 14,90 / kg",link:"#",heroImage:"",images:[""]},
{name:"Kipdijfilet",desc:"Sappig en veelzijdig.",oldPrice:"€ 8,95 / kg",newPrice:"€ 7,95 / kg",link:"#",heroImage:"",images:[""]},
{name:"Rundergehakt",desc:"Dagverse basis voor vele gerechten.",oldPrice:"€ 7,99 / kg",newPrice:"€ 6,99 / kg",link:"#",heroImage:"",images:[""]}]}
]};
const data=JSON.parse(localStorage.getItem("emigroMailingConfig")||"null")||fallback;
document.documentElement.style.setProperty("--primary",data.colors?.primary||"#ffd400");document.documentElement.style.setProperty("--dark",data.colors?.dark||"#111315");logo.src=data.logo||fallback.logo;
const dateText=data.dates.from+" t/m "+data.dates.to;headerDates.textContent=dateText;modalDates.textContent="Geldig: "+dateText;
function media(url,emoji="🛒"){return url?'<img src="'+url+'" alt="">':'<div class="ph">'+emoji+'</div>'}
hero.innerHTML='<div class="heroCopy"><div class="eyebrow">Hero van de week</div><h1>'+data.hero.name+'</h1><p>'+data.hero.desc+'</p><div class="old">'+(data.hero.oldPrice||"")+'</div><div class="new">'+data.hero.newPrice+'</div><a class="heroBtn" href="'+(data.hero.link||"#")+'" target="_blank">Bekijk product →</a></div><div class="heroVisual">'+media(data.hero.heroImage,"🥤")+'</div>';
const nav=document.getElementById("nav"),content=document.getElementById("content");
data.groups.forEach(g=>{const a=document.createElement("a");a.href="#sec-"+g.key;a.textContent=g.label;nav.appendChild(a);const sec=document.createElement("section");sec.className="section";sec.id="sec-"+g.key;sec.innerHTML='<div class="sectionHead"><div><div class="eyebrow" style="color:#2563eb">'+g.label+'</div><h2>'+g.label+'</h2></div><span>Klik voor details</span></div><div class="grid"></div><div class="topback"><a href="#top">↑ Terug naar boven</a></div>';const grid=sec.querySelector(".grid");g.items.forEach((p,i)=>{const c=document.createElement("article");let cls="card";if(i===0&&g.feature==="2")cls+=" span2";if(i===0&&g.feature==="3")cls+=" span3";if(i===0&&g.feature==="4")cls+=" span4";c.className=cls;const cardImg=(i===0&&g.feature!=="none"&&p.heroImage)?p.heroImage:(p.images||[])[0];c.innerHTML='<div class="visual"><span class="badge">'+(i===0&&g.feature!=="none"?"HERO":"PRODUCT")+'</span>'+media(cardImg)+'</div><div class="cardBody"><div><div class="name">'+p.name+'</div><div class="desc">'+p.desc+'</div></div><div class="prices"><div class="old">'+(p.oldPrice||"")+'</div><div class="new">'+p.newPrice+'</div></div></div>';c.onclick=()=>openModal(g.label,p);grid.appendChild(c)});content.appendChild(sec)});
let imgs=[],idx=0;function showImg(){modalVisual.innerHTML=media(imgs[idx]);dots.innerHTML="";imgs.forEach((_,i)=>{const b=document.createElement("button");if(i===idx)b.className="active";b.onclick=()=>{idx=i;showImg()};dots.appendChild(b)})}
function openModal(label,p){modalDept.textContent=label;modalTitle.textContent=p.name;modalText.textContent=p.desc;modalOld.textContent=p.oldPrice||"";modalNew.textContent=p.newPrice;productLink.href=p.link||"#";imgs=(p.images||[]).filter(Boolean);if(!imgs.length)imgs=[""];idx=0;showImg();modal.classList.add("open")}
function shut(){modal.classList.remove("open")}closeBtn.onclick=shut;close2.onclick=shut;modal.onclick=e=>{if(e.target===modal)shut()};document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
</script></body></html>
