<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emigro Weekly Deals</title>
<style>
:root{--ink:#111315;--muted:#6f757b;--line:#e5e7eb;--soft:#f5f6f7;--yellow:#ffd400;--red:#e64a2e;--blue:#2563eb}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#edf0f2;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
a{text-decoration:none;color:inherit}button{font:inherit}.shell{padding:24px 12px 50px}.page{max-width:1180px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.12)}
.top{background:#101214;color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{width:138px}.week{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}.week small{display:block;color:#aeb4ba;font-weight:400;letter-spacing:0;margin-top:3px}
.nav{padding:12px 22px;background:#181b1e;display:flex;gap:8px;overflow:auto}.nav button{border:1px solid #33383d;background:#23272b;color:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:12px;font-weight:800;cursor:pointer}.nav button:hover,.nav button.active{background:var(--yellow);border-color:var(--yellow);color:#111}
.hero{background:linear-gradient(130deg,#111 0%,#202326 65%,#2e3134 100%);color:#fff;display:grid;grid-template-columns:1.05fr .95fr;min-height:430px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:450px;height:450px;border-radius:50%;right:-80px;top:-100px;background:radial-gradient(circle,rgba(255,212,0,.26),transparent 68%)}
.heroCopy{padding:48px 42px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}.eyebrow{color:var(--yellow);font-size:12px;font-weight:950;letter-spacing:1.6px;text-transform:uppercase}.hero h1{font-size:54px;line-height:.98;letter-spacing:-2px;margin:12px 0 16px}.hero p{color:#cbd0d4;font-size:17px;line-height:1.6;max-width:560px;margin:0 0 22px}.heroPrice{font-size:46px;font-weight:950}.heroMeta{font-size:12px;color:#aeb4ba;margin:5px 0 22px}.cta{display:inline-flex;width:max-content;background:var(--yellow);color:#111;padding:14px 20px;border-radius:11px;font-weight:900}.heroVisual{display:flex;align-items:center;justify-content:center;padding:36px;position:relative;z-index:1}.stage{width:100%;height:100%;min-height:340px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:130px}
.content{padding:34px 28px 46px}.section{margin-top:34px}.section:first-child{margin-top:0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:16px}.sectionHead h2{margin:5px 0 0;font-size:31px}.sectionHead p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;transition:.2s;box-shadow:0 7px 18px rgba(0,0,0,.025)}.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.08)}
.visual{height:150px;background:linear-gradient(145deg,#f0f2f4,#e3e6e8);display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}.badge{position:absolute;left:10px;top:10px;background:#fff;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950;letter-spacing:.6px}.cardBody{padding:13px}.name{font-weight:900;font-size:15px;line-height:1.2;min-height:36px}.desc{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px;min-height:31px}.price{font-size:21px;font-weight:950;margin-top:10px}.openHint{font-size:10px;color:#8b9095;margin-top:6px}
.footer{padding:28px;background:#111;color:#aaa;text-align:center;font-size:11px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal.open{display:flex}.dialog{width:min(720px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.35);position:relative}.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:22px;cursor:pointer;z-index:2}.dialogGrid{display:grid;grid-template-columns:.9fr 1.1fr}.modalVisual{min-height:360px;background:linear-gradient(145deg,#f1f3f4,#dfe3e6);display:flex;align-items:center;justify-content:center;font-size:120px}.modalBody{padding:38px 32px}.modalDept{font-size:11px;font-weight:950;letter-spacing:1px;color:var(--blue);text-transform:uppercase}.modalTitle{font-size:32px;line-height:1.05;font-weight:950;margin:10px 0}.modalText{color:var(--muted);line-height:1.6;font-size:14px}.modalPrice{font-size:38px;font-weight:950;margin:20px 0}.modalActions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:var(--yellow);color:#111}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.shell{padding:0}.page{border-radius:0}.top{padding:18px}.hero{grid-template-columns:1fr}.heroCopy{padding:34px 20px 18px}.hero h1{font-size:40px}.heroVisual{padding:0 20px 24px}.stage{min-height:220px;font-size:92px}.content{padding:28px 16px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.visual{height:130px}.dialogGrid{grid-template-columns:1fr}.modalVisual{min-height:210px}.modalBody{padding:26px 22px}.modalTitle{font-size:27px}}
</style>
</head>
<body>
<div class="shell">
<div class="page">
<header class="top">
  <img class="logo" src="https://mfatihdumluu-eng.github.io/emigro-catalog/logo.svg" alt="Emigro">
  <div class="week">WEEKLY DEALS<small>Hero + 10 producten per categorie</small></div>
</header>
<div class="nav" id="nav"></div>

<section class="hero">
  <div class="heroCopy">
    <div class="eyebrow">Hero van de week</div>
    <h1 id="heroName"></h1>
    <p id="heroDesc"></p>
    <div class="heroPrice" id="heroPrice"></div>
    <div class="heroMeta">excl. btw • zolang de voorraad strekt</div>
    <a class="cta" id="heroLink" href="#" target="_blank" rel="noopener">Bekijk product →</a>
  </div>
  <div class="heroVisual"><div class="stage" id="heroIcon"></div></div>
</section>

<main class="content" id="content"></main>
<footer class="footer">Emigro Weekly Deals • prijzen en beschikbaarheid kunnen wijzigen • OP = OP</footer>
</div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="dialog">
    <button class="close" id="closeBtn" aria-label="Sluiten">×</button>
    <div class="dialogGrid">
      <div class="modalVisual" id="modalIcon"></div>
      <div class="modalBody">
        <div class="modalDept" id="modalDept"></div>
        <div class="modalTitle" id="modalTitle"></div>
        <div class="modalText" id="modalText"></div>
        <div class="modalPrice" id="modalPrice"></div>
        <div class="modalActions">
          <button class="btn primary" id="modalClose2">Verder kijken</button>
          <a class="btn secondary" id="modalLink" href="#" target="_blank" rel="noopener">Naar productpagina →</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const baseLink="https://mfatihdumluu-eng.github.io/emigro-catalog/";
const hero={name:"Coca-Cola Original Taste 24 x 330 ml",desc:"De wekelijkse blikvanger: sterke rotatie, herkenbaar merk en direct inzetbaar voor retail, horeca en convenience.",price:"€ 18,95",icon:"🥤",link:baseLink};

const groups=[
{key:"dranken",label:"Dranken",icon:"🥤",products:[
["Coca-Cola Zero 24-pack","Sterke hardloper voor elk koelschap.","€ 18,49","🥤"],
["Fanta Orange 24-pack","Fris en herkenbaar, ideaal voor retail.","€ 16,95","🍊"],
["Sprite 24-pack","Licht en verfrissend.","€ 16,49","🥤"],
["Red Bull 24 x 250 ml","Populaire energydrank voor snelle omloop.","€ 28,95","⚡"],
["Monster Energy 12-pack","Groot formaat en hoge zichtbaarheid.","€ 19,95","⚡"],
["Lipton Ice Tea Peach","Verfrissende smaak, breed publiek.","€ 15,49","🧊"],
["Spa Reine 24-pack","Mineraalwater voor dagelijks gebruik.","€ 10,95","💧"],
["Chaudfontaine Sparkling","Bruisend mineraalwater.","€ 11,49","💦"],
["Fernandes Green Punch","Sterke kleur en herkenbare smaak.","€ 17,95","🥤"],
["Capri-Sun Orange 40-pack","Handig voor horeca en gezinnen.","€ 13,95","🧃"]
]},
{key:"slagerij",label:"Slagerij",icon:"🥩",products:[
["Ribeye Premium","Mals rundvlees voor grill en horeca.","€ 14,90 / kg","🥩"],
["Kipdijfilet","Sappig en veelzijdig.","€ 7,95 / kg","🍗"],
["Kipfilet","Mager en breed inzetbaar.","€ 8,49 / kg","🍗"],
["Rundergehakt","Dagverse basis voor vele gerechten.","€ 6,99 / kg","🥩"],
["Lamskoteletten","Premium keuze voor grill en pan.","€ 12,95 / kg","🍖"],
["Kalfsschnitzel","Mals en snel te bereiden.","€ 13,90 / kg","🥩"],
["Sucadelappen","Ideaal voor slow cooking.","€ 10,95 / kg","🥩"],
["Kippenvleugels","Sterke horeca- en grillfavoriet.","€ 5,95 / kg","🍗"],
["Entrecote","Krachtige smaak en mooie presentatie.","€ 15,90 / kg","🥩"],
["Lamsbout","Geschikt voor oven en catering.","€ 11,95 / kg","🍖"]
]},
{key:"agf",label:"AGF",icon:"🥦",products:[
["Avocado Hass","Romig en direct verkoopklaar.","€ 8,95 / doos","🥑"],
["Mango Ready to Eat","Rijp en aantrekkelijk gepresenteerd.","€ 1,79","🥭"],
["Blauwe bessen","Premium fruit met snelle rotatie.","€ 2,49","🫐"],
["Snackpaprika Mix","Kleurrijk en praktisch verpakt.","€ 3,95","🫑"],
["Bananen Premium","Dagelijkse hardloper.","€ 1,49 / kg","🍌"],
["Aardbeien","Vers en seizoensgericht.","€ 2,95","🍓"],
["Tomaten Roma","Veelzijdig voor keuken en retail.","€ 2,25 / kg","🍅"],
["Komkommer","Fris en breed inzetbaar.","€ 0,89","🥒"],
["Citroenen","Voor keuken, drank en presentatie.","€ 2,49 / net","🍋"],
["Druiven wit","Zoet, fris en verkoopklaar.","€ 2,79","🍇"]
]},
{key:"zuivel",label:"Zuivel",icon:"🥛",products:[
["Volle Melk 12 x 1L","Betrouwbare basis voor grootverbruik.","€ 13,95","🥛"],
["Halfvolle Melk 12 x 1L","Veelgevraagde dagelijkse keuze.","€ 12,95","🥛"],
["Griekse Yoghurt","Romig en veelzijdig.","€ 3,29","🥣"],
["Mozzarella Horeca Pack","Handig voor pizza en salades.","€ 8,49","🧀"],
["Gouda Jong","Klassieke Nederlandse kaas.","€ 7,95","🧀"],
["Roomboter 250 g","Voor bakken, koken en brood.","€ 1,99","🧈"],
["Kookroom 1L","Praktisch formaat voor horeca.","€ 3,95","🥛"],
["Crème Fraîche","Voor saus, topping en keuken.","€ 2,29","🥣"],
["Feta Blok","Sterke smaak en veelzijdig gebruik.","€ 6,95","🧀"],
["Ayran 1L","Populaire gekoelde drank.","€ 1,49","🥛"]
]},
{key:"diepvries",label:"Diepvries",icon:"❄️",products:[
["Premium Friet 10 mm","Krokant resultaat en constante kwaliteit.","€ 17,50 / doos","🍟"],
["Chicken Strips","Snel te bereiden en breed inzetbaar.","€ 22,95","🍗"],
["Mini Pide Mix","Handig voor snack en horeca.","€ 19,95","🥙"],
["Pizza Margherita Box","Klassieker voor snelle service.","€ 18,95","🍕"],
["Kroketten Horeca","Bekende snack voor frituur en kantine.","€ 21,50","🥟"],
["Kaassoufflés","Populaire vegetarische snack.","€ 18,49","🧀"],
["Falafel","Veelzijdige vegetarische keuze.","€ 14,95","🧆"],
["Spinazie Blokjes","Praktisch en voordelig.","€ 8,95","🥬"],
["Frambozen diepvries","Voor smoothies en patisserie.","€ 9,49","🫐"],
["Baklava Assorti","Dessertassortiment uit de vriezer.","€ 24,95","🍰"]
]},
{key:"nonfood",label:"Non-food",icon:"🧻",products:[
["Keukenrol Professional","Sterk absorberend voor dagelijks gebruik.","€ 11,95","🧻"],
["Aluminiumfolie 150 m","Grootverpakking voor professionele keukens.","€ 8,95","📦"],
["Nitril Handschoenen","Comfortabel en praktisch verpakt.","€ 5,95","🧤"],
["Vuilniszakken 120L","Extra stevig voor grootverbruik.","€ 10,95","🗑️"],
["Vershoudfolie 300 m","Handig voor keuken en productie.","€ 9,49","📦"],
["Papieren Bekers 250 ml","Praktisch voor koffie en events.","€ 4,95","🥤"],
["Servetten 2-laags","Netjes voor horeca en catering.","€ 6,49","🧻"],
["Afwasmiddel 5L","Groot formaat voor professioneel gebruik.","€ 7,95","🧴"],
["Handzeep 5L","Voordelige navulverpakking.","€ 8,49","🧼"],
["Take-away Bakjes 50 st.","Handig voor afhaal en bezorging.","€ 12,95","🥡"]
]}];

heroName.textContent=hero.name;heroDesc.textContent=hero.desc;heroPrice.textContent=hero.price;heroIcon.textContent=hero.icon;heroLink.href=hero.link;

const nav=document.getElementById("nav"),content=document.getElementById("content");
groups.forEach((g,i)=>{
 const b=document.createElement("button");b.textContent=g.icon+" "+g.label;b.onclick=()=>document.getElementById("sec-"+g.key).scrollIntoView({behavior:"smooth"});nav.appendChild(b);
 const sec=document.createElement("section");sec.className="section";sec.id="sec-"+g.key;
 sec.innerHTML='<div class="sectionHead"><div><div class="eyebrow" style="color:#2563eb">'+g.label+'</div><h2>'+g.label+' • 10 producten</h2></div><p>Klik op een product voor details</p></div><div class="grid"></div>';
 const grid=sec.querySelector(".grid");
 g.products.forEach((p,idx)=>{
   const c=document.createElement("article");c.className="card";
   c.innerHTML='<div class="visual"><span class="badge">'+(idx===0?"TOP DEAL":"PRODUCT")+'</span><span>'+p[3]+'</span></div><div class="cardBody"><div class="name">'+p[0]+'</div><div class="desc">'+p[1]+'</div><div class="price">'+p[2]+'</div><div class="openHint">Klik voor details ↗</div></div>';
   c.onclick=()=>openModal(g,p,idx);
   grid.appendChild(c);
 });
 content.appendChild(sec);
});

const modal=document.getElementById("modal");
function openModal(g,p,idx){
 modalDept.textContent=g.label+(idx===0?" • Top deal":"");
 modalTitle.textContent=p[0];modalText.textContent=p[1]+" Beschikbaarheid en actuele voorwaarden kunnen per moment verschillen.";
 modalPrice.textContent=p[2];modalIcon.textContent=p[3];modalLink.href=baseLink;
 modal.classList.add("open");modal.setAttribute("aria-hidden","false");
}
function closeModal(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true")}
closeBtn.onclick=closeModal;modalClose2.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
</script>
</body>
</html>
