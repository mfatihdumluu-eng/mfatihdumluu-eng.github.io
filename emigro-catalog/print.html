<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emigro PDF Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./print.css">
</head>
<body>
<div class="toolbar"><a href="./index.html">← Kataloğa dön</a><div><strong>EMIGRO PDF CATALOGUE</strong><span>A4 · 9 ürün/sayfa · yalnızca ana ürün görseli</span></div><button onclick="window.print()">PDF olarak kaydet</button></div>
<main id="pages"></main>
<script>
const palette=["#173F35","#25634F","#2F7A5E","#D77A2F","#E39A4A","#7B8B5B","#A86A3B","#4E665D","#B8894D"];
const cats=[["Soft Drinks",palette[0],"Australia","🥤"],["Juices",palette[1],"Turkey","🍎"],["Sauces",palette[3],"Belgium","🥣"],["Snacks",palette[4],"Netherlands","🍿"],["Frozen",palette[2],"Netherlands","❄️"],["Grocery",palette[5],"Turkey","🧺"],["Dairy",palette[7],"Germany","🥛"],["Sweets",palette[8],"Turkey","🍬"],["Non-Food",palette[6],"Netherlands","✨"]];
const names=["Original","Classic","Premium","Gold","Family","Select","Fresh","Royal","Extra","Natural","Special","Max","Traditional","Deluxe","Daily","Pro","Mini","XL","Pure","Signature","Choice","Plus","Top"];
const products=cats.flatMap((c,ci)=>Array.from({length:23},(_,i)=>{const id=ci*23+i+1,palletOnly=i%7===0,caseOnly=!palletOnly&&i%6===0;const casePrice=palletOnly?null:+(14.5+ci*1.35+(i%9)*.85).toFixed(2),palletCases=48+((i+ci)%5)*6,caseQty=[6,12,18,24][(i+ci)%4],palletPrice=caseOnly?null:+(((casePrice??20.5)*palletCases*.965).toFixed(2));return{id,brand:["Emigro","Manna","Golden","Anatolia","EuroTaste"][(i+ci)%5],name:`${names[i%names.length]} ${c[0].replace("Soft Drinks","Drink").replace("Non-Food","Care")}`,category:c[0],origin:c[2],ean:`87${String(10000000000+id*731).slice(-11)}`,net:["250 ml","330 ml","375 ml","500 ml","750 g","1 kg"][(i+ci)%6],caseQty,palletCases,casePrice,palletPrice,tone:c[1],hero:i===0,heroLayout:ci%2===0?"editorial":"grid4"};}));
const euro=n=>n==null?"—":new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(n);
const bottle=(p,cls="")=>`<div class="product-image ${cls}" style="--tone:${p.tone}"><div class="cap"></div><div class="body"><div class="label">PREMIUM<br>SELECTION</div></div></div>`;
const chunks=(arr,n)=>Array.from({length:Math.ceil(arr.length/n)},(_,i)=>arr.slice(i*n,i*n+n));
let pageNo=1;
let html=`<section class="page cover"><div class="smallcap">EMIGRO · B2B PRODUCT CATALOGUE</div><div class="cover-copy"><span>2026 / 2027</span><h1>Wholesale<br>Product Catalogue</h1><p>9 categories · 200+ products · case & pallet pricing</p></div><div class="footline">ONLINE · MOBILE · PRINT</div></section>`;pageNo++;
html+=`<section class="page toc"><div class="smallcap">CONTENTS</div><h2>9 categories</h2><div class="toc-list">${cats.map((c,i)=>`<div><span>${String(i+1).padStart(2,"0")}</span><strong>${c[3]} ${c[0]}</strong><em>23 products</em></div>`).join("")}</div><div class="page-no">${String(pageNo++).padStart(2,"0")}</div></section>`;
cats.forEach((c,ci)=>{const list=products.filter(p=>p.category===c[0]),hero=list[0];
html+=`<section class="page category-page" style="--cat:${c[1]}"><div class="cat-band">CATEGORY ${String(ci+1).padStart(2,"0")}</div><div class="category-copy"><div class="smallcap">NEW SECTION</div><h2>${c[3]} ${c[0]}</h2><p>23 products · ${c[2]}</p><div class="rule"></div><b>CASE · PALLET · B2B</b></div><div class="category-bottles">${bottle(hero)}${bottle(list[1])}${bottle(list[2])}</div><div class="page-no">${String(pageNo++).padStart(2,"0")}</div></section>`;
if(hero.heroLayout==="grid4"){html+=`<section class="page hero-grid-page"><div class="smallcap">HERO SELECTION · ${c[0]}</div><h2>Featured four</h2><div class="hero4">${list.slice(0,4).map(p=>`<article>${bottle(p,"hero4-img")}<div><small>${p.brand}</small><h3>${p.name}</h3><p>${p.net} · ${p.origin}</p><strong>${p.casePrice!=null?euro(p.casePrice):euro(p.palletPrice)}</strong></div></article>`).join("")}</div><div class="page-no">${String(pageNo++).padStart(2,"0")}</div></section>`;}
else{html+=`<section class="page hero-page"><div class="hero-copy"><div class="smallcap">HERO PRODUCT · ${c[0]}</div><h2>${hero.brand}<br>${hero.name}</h2><p>${hero.origin} · ${hero.net}</p><div class="hero-prices"><div><span>CASE</span><strong>${euro(hero.casePrice)}</strong></div><div><span>PALLET</span><strong>${euro(hero.palletPrice)}</strong></div></div></div><div class="hero-image">${bottle(hero,"hero-img")}</div><div class="page-no">${String(pageNo++).padStart(2,"0")}</div></section>`;}
chunks(list,9).forEach((group,gi)=>{html+=`<section class="page grid-page"><div class="grid-head"><div><div class="smallcap">${c[3]} ${c[0]}</div><h3>${c[0]} selection</h3></div><span class="num" style="background:${c[1]}">${String(ci+1).padStart(2,"0")}</span></div><div class="grid">${group.map(p=>`<article class="card"><div class="pic">${bottle(p,"card-img")}</div><small>${p.brand}</small><h4>${p.name}</h4><p>${p.net} · ${p.caseQty}/case · ${p.palletCases} cases/pallet</p><p class="ean">EAN ${p.ean}</p><div class="prices">${p.casePrice!=null?`<div><span>CASE</span><strong>${euro(p.casePrice)}</strong></div>`:""}${p.palletPrice!=null?`<div><span>PALLET</span><strong>${euro(p.palletPrice)}</strong></div>`:""}</div></article>`).join("")}</div><div class="page-no">${String(pageNo++).padStart(2,"0")}</div></section>`;});});
document.getElementById("pages").innerHTML=html;
</script>
</body>
</html>
