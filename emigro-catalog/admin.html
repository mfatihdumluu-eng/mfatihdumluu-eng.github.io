<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emigro B2B Üye Onayları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="./index.html"><img src="./logo.svg" alt="Emigro"></a><nav><a href="./index.html">Kataloğa dön</a></nav><div class="top-actions"><button class="ghost" id="refreshBtn">Yenile</button><button class="ghost" id="logoutAdmin">Çıkış</button></div></header>
<main class="admin-shell">
  <section class="admin-hero"><div class="eyebrow">EMIGRO B2B ADMIN</div><h1>Üyelik onayları</h1><p>Yeni B2B başvurularını kontrol edin; onaylayın, reddedin veya askıya alın.</p></section>
  <div class="admin-stats" id="adminStats"></div>
  <div class="admin-filter"><button data-filter="all" class="active">Tümü</button><button data-filter="pending">Bekleyen</button><button data-filter="approved">Onaylı</button><button data-filter="rejected">Reddedilen</button><button data-filter="suspended">Askıda</button></div>
  <section class="admin-list" id="adminList"><div class="admin-loading">Üyelikler yükleniyor…</div></section>
</main>
<script src="./admin.js"></script>
