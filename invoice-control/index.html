id;gap:14px}.supplier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.supplier-card{cursor:pointer;text-align:left;width:100%;min-height:166px}.supplier-card:hover{border-color:#b5bdf2;box-shadow:0 10px 24px #2636ae10}.supplier-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#eff1ff;color:#3b4cc7;font-weight:850}.cardtitle{font-size:15px;font-weight:800}.bars{display:grid;gap:14px}.bartrack{height:7px;border-radius:20px;background:#eff1f6;overflow:hidden;margin-top:7px}.barfill{height:100%;background:#6674e1;border-radius:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}.link{color:#4052cb;font-weight:800;cursor:pointer}.back{background:none;color:#5869b6;border:none;font-size:12px;padding:0;margin-bottom:16px;font-weight:750}.tabs{display:flex;gap:5px;border-bottom:1px solid #e7eaf2;margin-bottom:17px;overflow:auto}.tab{border:none;background:none;color:#798597;padding:13px 18px;white-space:nowrap;font-size:12px}.tab.active{font-weight:800;color:#384bc7;border-bottom:2px solid #4154d4}.note{border:1px solid #e1e7fb;background:#f5f7ff;color:#58698b;font-size:12px;border-radius:10px;padding:14px;line-height:1.6}.empty{text-align:center;padding:45px;color:#8995a8;font-size:13px}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:white;z-index:1}.matrix th:first-child{background:#fafbfe}.high{background:#fff1f2;color:#b7444f;font-weight:800}.low{background:#eaf9f2;color:#16875c;font-weight:800}.usergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.user-card{display:flex;align-items:center;gap:12px}.progress{height:7px;border-radius:20px;background:#f0f2f7;margin-top:10px;overflow:hidden}.progress>div{height:100%;background:#5d6bd8;border-radius:20px}.footer{font-size:11px;color:#9aa5b2;padding:25px 0}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#8a96a5}.hide{display:none!important}@media(max-width:1200px){.supplier-grid{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}.usergrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.side{position:fixed;z-index:5;transform:translateX(-100%);box-shadow:0 0 0 0 transparent;transition:transform .2s}.side.open{transform:translateX(0);box-shadow:0 0 0 100vw #18243d65}.mobile-menu{display:inline-block}.top{padding:0 17px;height:62px}.work{padding:20px 15px}.grid2{grid-template-columns:1fr}}@media(max-width:550px){.supplier-grid,.usergrid{grid-template-columns:1fr}.grid4{gap:9px}.card{padding:15px}.stat .number{font-size:23px}h1{font-size:24px}.input{min-width:170px;width:100%}.topright{gap:4px}.topright .chip{display:none}}
</style></head><body>
<div class="layout"><aside class="side" id="sidebar"><div class="logo"><div class="mark">✓</div>Invoice Control</div><div class="navhead">WERKRUIMTE</div><nav id="nav"></nav><div class="navhead">BEHEER</div><nav id="adminnav"></nav><div class="sidefoot"><div class="row"><div class="avatar">SA</div><div><strong class="tiny" style="color:#344256">Demo beheerder</strong><div class="tiny">Lokale voorbeeldomgeving</div></div></div></div></aside><div class="main"><header class="top"><div class="row"><button class="btn white mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><span class="topname" id="breadcrumb">Dashboard</span></div><div class="topright"><select class="select" id="role"><option value="system">Systeemadmin</option><option value="admin">Admin</option><option value="branch">Vestiging 1</option></select><select class="select" id="month"><option value="2026-11">Nov 2026</option><option value="2026-10">Okt 2026</option></select><span class="chip">● DEMO</span></div></header><main class="work" id="root"></main></div></div>
<script>
const branches=['Rotterdam Centrum','Rotterdam Noord','Rotterdam Zuid','Schiedam','Delft','Den Haag','Utrecht','Breda','Amsterdam'];
const suppliers=[{id:1,name:'Holland Dairy BV',initials:'HD',category:'Zuivel & kaas',email:'demo@holland-dairy.example'},{id:2,name:'Van Dijk Foodservice',initials:'VD',category:'Horeca & foodservice',email:'demo@van-dijk.example'},{id:3,name:'Freshline Groothandel',initials:'FG',category:'Groente & fruit',email:'demo@freshline.example'},{id:4,name:'Euro Foods BV',initials:'EF',category:'Food & non-food',email:'demo@eurofoods.example'},{id:5,name:'Delta Distributie',initials:'DD',category:'Diepvries & verpakt',email:'demo@delta.example'},{id:6,name:'Noord Trade',initials:'NT',category:'Import & levensmiddelen',email:'demo@noordtrade.example'}];
const products=[{ean:'8711234000001',name:'Witte kaas 800 g',unit:'stuk',base:4.20},{ean:'8711234000002',name:'Yoghurt 1 kg',unit:'stuk',base:1.39},{ean:'8711234000003',name:'Basmati rijst 5 kg',unit:'zak',base:7.90},{ean:'8711234000004',name:'Zonnebloemolie 1 L',unit:'fles',base:1.85},{ean:'8711234000005',name:'Kikkererwten 1 kg',unit:'zak',base:1.60},{ean:'8711234000006',name:'Tomatenpuree 800 g',unit:'blik',base:2.20},{ean:'8711234000007',name:'Feta 400 g',unit:'pak',base:2.85},{ean:'8711234000008',name:'Rode linzen 1 kg',unit:'zak',base:1.75}];
let invoices=[];for(const month of ['2026-10','2026-11'])for(let s=1;s<=6;s++)for(let b=0;b<9;b++)for(let k=0;k<2;k++){let items=[];for(let p=0;p<8;p++){const count=8+(s+b+p+k)%13,qty=count*5;let price=+(products[p].base*(month==='2026-11'?1.015:1)).toFixed(2);if(month==='2026-11'&&s===1&&p===0&&b===1)price=4.65;if(month==='2026-11'&&s===1&&p===0&&b===6)price=4.45;if(month==='2026-11'&&s===2&&p===3&&b===3)price=2.23;if(month==='2026-11'&&s===4&&p===2&&b===5)price=8.65;items.push({product:p,ean:products[p].ean,qty,price});}invoices.push({id:'INV-'+month.slice(2).replace('-','')+'-'+s+String(b+1).padStart(2,'0')+'-'+(k+1),month,supplier:s,branch:b,date:month+'-'+String(3+k*12+b%6).padStart(2,'0'),items,source:'demo',status:'Verwerkt'});}
let page='dashboard',supplierId=1,supplierTab='invoices',search='',role='system',month='2026-11',branch=0,addedSuppliers=[],addedInvoices=[],savedAudit=[];
const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s,t='')=>'<span class="badge '+t+'">'+esc(s)+'</span>';
const allInvoices=()=>invoices.concat(addedInvoices);
const invoiceList=()=>allInvoices().filter(i=>i.month===month&&(role!=='branch'||i.branch===branch));
const supplierName=id=>suppliers.find(s=>s.id===id)?.name||'Onbekend';
const visible=invs=>invs.filter(i=>role!=='branch'||i.branch===branch);
function invoiceTotal(i){return i.items.reduce((v,x)=>v+x.qty*x.price,0)}
function allLines(data){return data.flatMap(i=>i.items.map(line=>({...line,supplier:i.supplier,branch:i.branch,month:i.month,invoice:i.id,date:i.date})))}
function compare(){const source=allLines(allInvoices().filter(x=>x.month===month)),grp=new Map();for(let line of source){const key=line.supplier+':'+line.ean;const arr=grp.get(key)||[];arr.push(line);grp.set(key,arr)}let out=[];for(const [key,items] of grp){const unique=new Map();for(let x of items){let prior=unique.get(x.branch);if(!prior||x.price<prior.price)unique.set(x.branch,x)}const values=[...unique.values()];if(values.length<2)continue;let min=Math.min(...values.map(x=>x.price)),max=Math.max(...values.map(x=>x.price));if(max-min<=.02)continue;out.push({supplier:values[0].supplier,product:products.findIndex(x=>x.ean===values[0].ean),ean:values[0].ean,items:values,min,max,spread:((max/min-1)*100),impact:values.reduce((sum,x)=>sum+Math.max(0,x.price-min)*x.qty,0)});}return out.sort((a,b)=>b.impact-a.impact)}
function nav(){const items=[['dashboard','◫','Dashboard'],['suppliers','▦','Leveranciers'],['invoices','▤','Facturen'],['products','⌕','Product zoeken'],['compare','⇄','Vestigingen vergelijken'],['alerts','⚠','Prijsverschillen'],['reports','▥','Rapportages'],['upload','⇧','Factuur uploaden']];const admins=[['users','♙','Demo gebruikers'],['settings','⚙','Instellingen']];document.getElementById('nav').innerHTML=items.map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-route="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join('');document.getElementById('adminnav').innerHTML=admins.filter(x=>role!=='branch').map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-route="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join('');document.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>go(el.dataset.route))}
function go(p){page=p;search='';document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function head(name,sub,right=''){return '<div class="head"><div><div class="eyebrow">INVOICE CONTROL / '+esc(name.toUpperCase())+'</div><h1>'+esc(name)+'</h1><p>'+sub+'</p></div>'+right+'</div>'}
function supplierCard(s){let ii=invoiceList().filter(i=>i.supplier===s.id),total=ii.reduce((sum,i)=>sum+invoiceTotal(i),0),issues=compare().filter(x=>x.supplier===s.id).length;return '<button class="card supplier-card" onclick="showSupplier('+s.id+')"><div class="row between"><div class="supplier-icon">'+esc(s.initials)+'</div>'+badge(issues+' afwijkingen',issues?'red':'green')+'</div><div class="cardtitle" style="margin-top:18px">'+esc(s.name)+'</div><p>'+esc(s.category)+'</p><div class="row between" style="margin-top:15px"><span class="tiny">'+ii.length+' facturen · 9 vestigingen</span><strong style="font-size:12px">'+euro(total)+'</strong></div></button>'}
function dashboards(){let ii=invoiceList(),all=compare(),issues=all.filter(x=>role!=='branch'||x.items.some(t=>t.branch===branch)),value=ii.reduce((v,i)=>v+invoiceTotal(i),0),total=issues.reduce((v,x)=>v+(role==='branch'?x.items.filter(t=>t.branch===branch).reduce((z,t)=>z+Math.max(0,t.price-x.min)*t.qty,0):x.impact),0);
return head('Dashboard','Een duidelijk overzicht van facturen, leveranciers en prijsverschillen','<button class="btn" onclick="go(\'upload\')">＋ Factuur uploaden</button>')+'<div class="grid4">'+[['Ontvangen facturen',ii.length,'purple'],['Actieve leveranciers',suppliers.length,'purple'],['Te onderzoeken producten',issues.length,'red'],['Potentieel prijsverschil',euro(total),'orange']].map(x=>'<div class="card stat"><div class="key">'+x[0]+'</div><div class="number '+x[2]+'">'+x[1]+'</div><div class="tiny">Geselecteerde maand</div></div>').join('')+'</div><div class="grid2"><div class="card"><div class="panel-head"><h2>Leveranciers</h2><button class="btn light" onclick="go(\'suppliers\')">Alle leveranciers →</button></div><div class="stack">'+suppliers.slice(0,5).map(s=>{let n=ii.filter(i=>i.supplier===s.id).length;return '<div class="row between" style="padding:5px 0"><div class="row"><div class="supplier-icon" style="width:34px;height:34px;font-size:12px">'+s.initials+'</div><div><strong style="font-size:12px">'+esc(s.name)+'</strong><div class="tiny">'+n+' facturen</div></div></div><a href="#" onclick="showSupplier('+s.id+');return false" class="link">Bekijk →</a></div>'}).join('')+'</div></div><div class="card"><div class="panel-head"><h2>Opvallende prijsverschillen</h2><button class="btn light" onclick="go(\'alerts\')">Bekijk alle →</button></div><div class="stack">'+issues.slice(0,5).map(x=>'<div style="border-bottom:1px solid #eff1f6;padding:7px 0"><div class="row between"><b style="font-size:12px">'+esc(products[x.product]?.name||x.ean)+'</b>'+badge('+'+x.spread.toFixed(1)+'%','red')+'</div><p>'+esc(supplierName(x.supplier))+' · '+euro(x.min)+' – '+euro(x.max)+'</p></div>').join('')+'</div><div class="note" style="margin-top:14px">Verschillen zijn signalen. Controleer contracten, staffels, kortingen en verpakkingseenheden.</div></div></div><div class="card" style="margin-top:16px"><div class="panel-head"><h2>Laatste facturen</h2><button class="btn light" onclick="go(\'invoices\')">Bekijk alle →</button></div>'+invoiceTable(ii.slice(-6).reverse())+'</div>'}
function supplierPage(){let ss=suppliers.filter(x=>(x.name+' '+x.category).toLowerCase().includes(search.toLowerCase()));return head('Leveranciers','Klik op een leverancier om zijn facturen, producten en vestigingsprijzen te bekijken',role==='branch'?'':'<button class="btn" onclick="addSupplier()">＋ Leverancier toevoegen</button>')+'<div class="filters"><input class="input" placeholder="⌕ Zoek leverancier..." value="'+esc(search)+'" oninput="search=this.value;render()">'+badge(suppliers.length+' leveranciers','purple')+'</div><div class="supplier-grid">'+ss.map(supplierCard).join('')+'</div>'}
function showSupplier(id){supplierId=id;supplierTab='invoices';go('supplierDetail')}
function supplierDetail(){let s=suppliers.find(x=>x.id===supplierId);if(!s)return supplierPage();let ii=invoiceList().filter(i=>i.supplier===supplierId),rows=compare().filter(x=>x.supplier===supplierId);let panel=supplierTab==='invoices'?invoiceTable(ii.slice().reverse()):supplierTab==='products'?productTable(supplierId):matrixTable(rows);return '<button class="back" onclick="go(\'suppliers\')">← Terug naar leveranciers</button>'+head(s.name,s.category+' · '+(role==='branch'?'Eigen vestiging':'9 vestigingen'))+'<div class="grid4">'+[['Facturen',ii.length,'purple'],['Producten',products.length,'purple'],['Prijsverschillen',rows.length,'red'],['Totaal excl. btw',euro(ii.reduce((v,i)=>v+invoiceTotal(i),0)),'green']].map(x=>'<div class="card stat"><div class="key">'+x[0]+'</div><div class="number '+x[2]+'">'+x[1]+'</div></div>').join('')+'</div><div class="card"><div class="tabs">'+[['invoices','Facturen per vestiging'],['products','Producten & prijzen'],['differences','Prijsverschillen tussen vestigingen']].map(x=>'<button class="tab '+(supplierTab===x[0]?'active':'')+'" onclick="supplierTab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div><div class="filters"><input id="supplierSearch" class="input" placeholder="⌕ Factuur, product of EAN..." value="'+esc(search)+'" oninput="search=this.value;render()"><select class="select" id="branchFilter" onchange="window.branchFilter=this.value;render()"><option value="all">Alle vestigingen</option>'+branches.map((b,i)=>'<option value="'+i+'" '+(window.branchFilter==i?'selected':'')+'>'+esc(b)+'</option>').join('')+'</select></div>'+panel+'</div>'}
function invoiceTable(ii){let list=ii.filter(i=>(!window.branchFilter||window.branchFilter==='all'||i.branch===+window.branchFilter)&&(i.id+' '+supplierName(i.supplier)+' '+branches[i.branch]+' '+i.items.map(x=>products[x.product]?.name+' '+x.ean).join(' ')).toLowerCase().includes(search.toLowerCase()));if(!list.length)return '<div class="empty">Geen facturen gevonden.</div>';return '<div class="tablewrap"><table><thead><tr><th>Factuurnummer</th><th>Leverancier</th><th>Vestiging</th><th>Datum</th><th>Productregels</th><th>Totaal excl. BTW</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(i=>'<tr class="clickable" onclick="viewInvoice(\''+i.id+'\')"><td><b>'+esc(i.id)+'</b></td><td>'+esc(supplierName(i.supplier))+'</td><td>'+esc(branches[i.branch])+'</td><td>'+esc(i.date)+'</td><td>'+i.items.length+'</td><td><b>'+euro(invoiceTotal(i))+'</b></td><td>'+badge(i.source==='demo'?'Demo factuur':'Test factuur','purple')+'</td><td class="link">Bekijken →</td></tr>').join('')+'</tbody></table></div>'}
function invoicePage(){let ii=invoiceList().slice().reverse();return head('Facturen','Alle binnengekomen facturen per leverancier en vestiging','<a class="btn" href="./test.html">＋ Testfactuur uploaden ↗</a>')+'<div class="card"><div class="panel-head"><h2>Factuuroverzicht</h2>'+badge(ii.length+' facturen','purple')+'</div><div class="filters"><input class="input" placeholder="⌕ Zoek factuur, EAN, product..." value="'+esc(search)+'" oninput="search=this.value;render()"><select class="select" onchange="window.branchFilter=this.value;render()"><option value="all">Alle vestigingen</option>'+branches.map((b,i)=>'<option value="'+i+'" '+(window.branchFilter==i?'selected':'')+'>'+esc(b)+'</option>').join('')+'</select></div>'+invoiceTable(ii)+'</div>'}
let currentInvoice=null;function viewInvoice(id){currentInvoice=id;page='invoiceDetail';render();window.scrollTo(0,0)}
function invoiceDetail(){let i=allInvoices().find(x=>x.id===currentInvoice);if(!i||role==='branch'&&i.branch!==branch)return '<div class="note">Geen toegang tot deze factuur.</div>';let detail=i.items.map(x=>{let rows=compare().filter(z=>z.supplier===i.supplier&&z.ean===x.ean),comparison=rows[0];return '<tr><td>'+esc(x.ean)+'</td><td><b>'+esc(products[x.product]?.name||'Onbekend')+'</b></td><td>'+x.qty+'</td><td>'+euro(x.price)+'</td><td>'+euro(x.qty*x.price)+'</td><td>'+(comparison?badge('Vergelijk: '+euro(comparison.min)+' – '+euro(comparison.max),'red'):badge('Geen verschil','green'))+'</td></tr>'}).join('');return '<button class="back" onclick="go(\'invoices\')">← Alle facturen</button>'+head('Factuur '+i.id,'Leverancier: '+supplierName(i.supplier)+' · '+branches[i.branch]+' · '+i.date,'<button class="btn light" onclick="showSupplier('+i.supplier+')">Leverancier bekijken →</button>')+'<div class="grid4">'+[['Leverancier',supplierName(i.supplier),'purple'],['Vestiging',branches[i.branch],'purple'],['Regels',i.items.length,'purple'],['Totaal excl. btw',euro(invoiceTotal(i)),'green']].map(x=>'<div class="card"><div class="tiny">'+x[0]+'</div><h2 style="margin-top:10px">'+esc(x[1])+'</h2></div>').join('')+'</div><div class="card"><h2 style="margin-bottom:14px">Factuurregels en maandvergelijking</h2><div class="tablewrap"><table><thead><tr><th>EAN</th><th>Product</th><th>Aantal</th><th>Prijs/stuk</th><th>Regeltotaal</th><th>Referentie</th></tr></thead><tbody>'+detail+'</tbody></table></div><div class="note" style="margin-top:18px">Demo-inhoud. Geen originele PDF gekoppeld. Prijsverschillen worden niet automatisch als factuurfout beschouwd.</div></div>'}
function productTable(supplier){let filtered=products.filter(x=>(x.name+' '+x.ean).toLowerCase().includes(search.toLowerCase()));return '<div class="tablewrap"><table><thead><tr><th>EAN</th><th>Product</th><th>Eenheid</th><th>Laagste prijs</th><th>Hoogste prijs</th><th>Verschil</th></tr></thead><tbody>'+filtered.map(p=>{let lines=allLines(allInvoices().filter(x=>x.month===month&&x.supplier===supplier&&(!window.branchFilter||window.branchFilter==='all'||x.branch===+window.branchFilter))).filter(x=>x.ean===p.ean);let lo=Math.min(...lines.map(x=>x.price)),hi=Math.max(...lines.map(x=>x.price));return '<tr><td>'+p.ean+'</td><td><b>'+esc(p.name)+'</b></td><td>'+p.unit+'</td><td>'+(!lines.length?'–':euro(lo))+'</td><td>'+(!lines.length?'–':euro(hi))+'</td><td>'+(lines.length&&hi-lo>.02?badge('+'+((hi/lo-1)*100).toFixed(1)+'%','red'):badge('Gelijk','green'))+'</td></tr>'}).join('')+'</tbody></table></div>'}
function productsPage(){let filtered=products.filter(x=>(x.name+' '+x.ean).toLowerCase().includes(search.toLowerCase()));return head('Product zoeken','Zoek een product of EAN en vergelijk de prijzen van dezelfde leverancier bij alle vestigingen')+'<div class="filters"><input class="input" style="min-width:min(100%,400px)" placeholder="⌕ Productnaam of EAN..." value="'+esc(search)+'" oninput="search=this.value;render()">'+badge(filtered.length+' producten','purple')+'</div><div class="stack">'+filtered.map(p=>{let compar=compare().filter(x=>x.ean===p.ean);let lines=allLines(allInvoices().filter(i=>i.month===month&&(!['branch'].includes(role)||i.branch===branch))).filter(x=>x.ean===p.ean);return '<div class="card"><div class="row between"><div><div class="tiny">EAN '+p.ean+' · '+p.unit+'</div><h2 style="margin-top:5px">'+esc(p.name)+'</h2></div>'+badge(compar.length+' leverancier(s) met verschil',compar.length?'red':'green')+'</div><div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Leverancier</th><th>Laagste prijs</th><th>Hoogste prijs</th><th>Vestigingen</th><th></th></tr></thead><tbody>'+suppliers.map(s=>{let v=allLines(allInvoices().filter(i=>i.month===month&&i.supplier===s.id&&(!['branch'].includes(role)||i.branch===branch))).filter(x=>x.ean===p.ean);if(!v.length)return '';let lo=Math.min(...v.map(x=>x.price)),hi=Math.max(...v.map(x=>x.price));return '<tr><td>'+esc(s.name)+'</td><td>'+euro(lo)+'</td><td>'+euro(hi)+'</td><td>'+new Set(v.map(x=>x.branch)).size+'</td><td><button class="btn light" onclick="showSupplier('+s.id+');supplierTab=\'products\';render()">Bekijk →</button></td></tr>'}).join('')+'</tbody></table></div></div>'}).join('')+'</div>'}
function matrixTable(rows){let matched=rows.filter(x=>(supplierName(x.supplier)+' '+products[x.product]?.name+' '+x.ean).toLowerCase().includes(search.toLowerCase()));if(!matched.length)return '<div class="empty">Geen prijsverschillen in deze selectie.</div>';return '<div class="tablewrap"><table class="matrix"><thead><tr><th>Product / Leverancier</th>'+(role==='branch'?'<th>Eigen prijs</th><th>Laagste</th>':branches.map(x=>'<th>'+esc(x)+'</th>').join(''))+'<th>Afwijking</th></tr></thead><tbody>'+matched.map(x=>{let map=new Map(x.items.map(y=>[y.branch,y.price]));return '<tr><td><b>'+esc(products[x.product]?.name||x.ean)+'</b><div class="tiny">'+esc(supplierName(x.supplier))+' · '+x.ean+'</div></td>'+(role==='branch'?'<td>'+euro(map.get(branch)||0)+'</td><td>'+euro(x.min)+'</td>':branches.map((b,i)=>{let v=map.get(i);return '<td class="'+(v>x.min+.02?'high':'low')+'">'+(v===undefined?'–':euro(v))+'</td>'}).join(''))+'<td>'+badge('+'+x.spread.toFixed(1)+'%','red')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function comparePage(){let rows=compare().filter(x=>role!=='branch'||x.items.some(z=>z.branch===branch));return head('Vestigingen vergelijken','Dezelfde leverancier, hetzelfde product, dezelfde maand · verschillen per vestiging')+'<div class="card"><div class="panel-head"><h2>Maandelijkse prijsverschillen</h2>'+badge(rows.length+' producten','red')+'</div><div class="filters"><input class="input" placeholder="⌕ Zoek product of EAN..." value="'+esc(search)+'" oninput="search=this.value;render()"></div>'+matrixTable(rows)+'<div class="note" style="margin-top:15px">In deze demo is elke prijs op stuksniveau exclusief BTW. Productverschillen worden alleen als onderzoekssignaal weergegeven.</div></div>'}
function alertsPage(){const rows=compare().filter(x=>role!=='branch'||x.items.some(z=>z.branch===branch));return head('Prijsverschillen','Verschillen binnen dezelfde maand, gegroepeerd per leverancier','<button class="btn light" onclick="exportRows()">↓ CSV exporteren</button>')+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Leverancier</th><th>EAN / Product</th><th>Laagste</th><th>Hoogste</th><th>Verschil</th><th>Potentiële impact</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(supplierName(x.supplier))+'</td><td>'+esc(products[x.product]?.name||x.ean)+'</td><td>'+euro(x.min)+'</td><td>'+euro(x.max)+'</td><td>'+badge('+'+x.spread.toFixed(1)+'%','red')+'</td><td>'+euro(x.impact)+'</td><td><button class="btn light" onclick="showSupplier('+x.supplier+');supplierTab=\'differences\';render()">Details →</button></td></tr>').join('')+'</tbody></table></div></div>'}
function reports(){let rows=compare();return head('Rapportages','Samenvatting prijsverschillen per leverancier','<button class="btn light" onclick="exportRows()">↓ Download CSV</button>')+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Leverancier</th><th>Facturen</th><th>Producten met verschil</th><th>Theoretisch verschil</th></tr></thead><tbody>'+suppliers.map(s=>{let rr=rows.filter(x=>x.supplier===s.id);return '<tr><td>'+esc(s.name)+'</td><td>'+invoiceList().filter(i=>i.supplier===s.id).length+'</td><td>'+rr.length+'</td><td>'+euro(rr.reduce((v,x)=>v+x.impact,0))+'</td></tr>'}).join('')+'</tbody></table></div><div class="note" style="margin-top:15px">Theoretische prijsverschillen zijn geen bewezen fouten of gerealiseerde besparingen.</div></div>'}
function users(){let all=branches.map((x,i)=>({name:'Medewerker '+String(i+1).padStart(2,'0'),initial:'M'+(i+1),role:'Vestigingsgebruiker',branch:x})).concat([{name:'Bedrijfsadmin',initial:'BA',role:'Admin',branch:'Alle 9 vestigingen'},{name:'Systeemadmin',initial:'SA',role:'Systeemadmin',branch:'Systeembeheer'}]);return head('Demo gebruikers','9 vestigingsgebruikers + 1 admin + 1 systeemadmin · totaal 11 accounts')+'<div class="usergrid">'+all.map((x,i)=>'<div class="card user-card"><div class="avatar">'+esc(x.initial)+'</div><div><div class="cardtitle" style="font-size:13px">'+esc(x.name)+'</div><p>'+esc(x.branch)+'</p>'+badge(x.role,i>=9?'purple':'')+'</div></div>').join('')+'</div><div class="note" style="margin-top:18px">Dit zijn uitsluitend demo-profielen. Een werkende authenticatie en toegangsrechten zijn nog niet aangesloten. Gebruik de rolselector bovenaan alleen om de schermen te bekijken.</div>'}
function addSupplier(){let n=prompt('Naam nieuwe leverancier');if(!n||!n.trim())return;if(suppliers.some(s=>s.name.toLowerCase()===n.trim().toLowerCase())){alert('Leverancier bestaat al');return}let id=Math.max(...suppliers.map(x=>x.id))+1;suppliers.push({id,name:n.trim(),initials:n.trim().slice(0,2).toUpperCase(),category:'Nieuw toegevoegd (demo)',email:''});savedAudit.push('Leverancier '+n.trim()+' toegevoegd');render()}
function uploadPage(){return head('Factuur uploaden','Test met CSV, UBL/XML of PDF en bekijk het controleverslag','<a class="btn" href="./test.html">Upload- en testcentrum openen ↗</a>')+'<div class="card"><h2>Factuur uploaden en controleren</h2><p>Het testcentrum kan lokale testbestanden inlezen en per product een prijsvergelijking tonen. Echte gebruikersopslag, OCR en automatische koppeling van geüploade bestanden aan de 9 vestigingen vereisen een beveiligde backend.</p><div class="note" style="margin-top:18px">Gebruik nog geen vertrouwelijke of echte leveranciersfacturen. De GitHub Pages-demo bevat alleen fictieve gegevens.</div><p style="margin-top:18px"><a class="btn" href="./test.html">Naar de testomgeving →</a></p></div>'}
function settings(){return head('Instellingen','Toegang en controlebeleid · demo')+'<div class="card"><h2>Controlebeleid</h2><p>Maand + leverancier + EAN + genormaliseerde verpakkingseenheid. Herken prijsverschillen boven €0,02. Admin beoordeelt verschillen voordat leveranciers een bericht krijgen.</p><div class="note">Productie vereist database, rolgebaseerde API-beveiliging, volledige auditlogs, privé opslag, verwerking van echte facturen en een verzendservice voor e-mail.</div></div>'}
function exportRows(){let rows=compare().filter(x=>role!=='branch'||x.items.some(z=>z.branch===branch));let lines=[['Leverancier','EAN','Product','Laagste prijs','Hoogste prijs','Verschil procent','Theoretische impact'],...rows.map(x=>[supplierName(x.supplier),x.ean,products[x.product]?.name,x.min,x.max,x.spread.toFixed(1),x.impact])];let str=lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');let b=new Blob(['\ufeff'+str],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='invoice-control-rapport-'+month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function render(){if(role==='branch'&&['users','settings'].includes(page))page='dashboard';nav();document.getElementById('breadcrumb').textContent=({supplierDetail:'Leverancier details',invoiceDetail:'Factuurdetails',dashboard:'Dashboard',suppliers:'Leveranciers',invoices:'Facturen',products:'Product zoeken',compare:'Vestigingen vergelijken',alerts:'Prijsverschillen',reports:'Rapportages',users:'Demo gebruikers',upload:'Factuur uploaden',settings:'Instellingen'})[page]||'Dashboard';const map={dashboard:dashboards,suppliers:supplierPage,supplierDetail,invoices:invoicePage,invoiceDetail,products:productsPage,compare:comparePage,alerts:alertsPage,reports,users,upload:uploadPage,settings};document.getElementById('root').innerHTML=(map[page]||dashboards)()+'<div class="footer">Invoice Control · Versie 2 demo · 9 vestigingen · Alleen voorbeeldgegevens · Geen Lovable</div>'}
document.getElementById('role').onchange=e=>{role=e.target.value;page='dashboard';render()};document.getElementById('month').onchange=e=>{month=e.target.value;render()};render();
</script></body></html>
