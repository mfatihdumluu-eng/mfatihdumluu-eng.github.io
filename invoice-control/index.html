<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>Invoice Control — Vestigingscontrole</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;color:#18243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.layout{display:flex;min-height:100vh}.side{width:245px;background:#111b31;color:#d4dced;padding:24px 14px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:8px 13px 26px;color:white;font-size:19px;font-weight:800;letter-spacing:-.5px}.brandmark{height:35px;width:35px;border-radius:11px;background:#4f79ff;display:grid;place-items:center;font-size:19px}.group-label{font-size:10px;letter-spacing:1.5px;color:#76849e;margin:18px 12px 8px;font-weight:800}.nav{display:block;width:100%;text-align:left;background:none;border:0;color:#bfcbdf;border-radius:10px;padding:12px 14px;margin:2px 0;font-size:13px}.nav:hover,.nav.active{background:#243653;color:white}.nav.active{box-shadow:inset 3px 0 #7095ff}.main{min-width:0;flex:1}.header{background:white;border-bottom:1px solid #e9edf4;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:15px}.muted{color:#8490a4}.small{font-size:12px}.header-right{display:flex;gap:9px;align-items:center}.pill{border-radius:100px;padding:6px 10px;background:#eef3ff;color:#3154af;font-size:11px;font-weight:700}.select,input{border:1px solid #e2e7f1;padding:10px 12px;border-radius:9px;background:white;color:#21304b;max-width:100%}.content{padding:32px;max-width:1540px;margin:auto}.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:23px;flex-wrap:wrap}h1{font-size:26px;letter-spacing:-.8px;margin:0 0 5px}h2{font-size:17px;margin:0 0 15px;letter-spacing:-.3px}p{margin:5px 0}.btn{border:0;border-radius:9px;padding:11px 16px;background:#4066e7;color:white;font-weight:700;font-size:13px}.btn.secondary{background:#eef2ff;color:#3454bf}.btn.ghost{background:white;color:#354563;border:1px solid #e0e7f0}.btn:disabled{opacity:.5;cursor:default}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card{background:white;border:1px solid #e9edf3;border-radius:15px;padding:21px;box-shadow:0 4px 19px #14244705}.kpi{font-size:28px;font-weight:800;margin:9px 0;letter-spacing:-1px}.green{color:#15966c}.red{color:#d4484e}.blue{color:#3a66de}.amber{color:#a56d0b}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left;font-size:13px}th{color:#8794a8;background:#f8fafd;font-size:11px;font-weight:800;letter-spacing:.2px}td,th{padding:12px;border-bottom:1px solid #edf1f6}tr:last-child td{border:0}.tag{display:inline-block;border-radius:100px;padding:5px 9px;font-size:11px;font-weight:750;background:#f0f3f8;color:#53647b}.tag.red{background:#fff0f1;color:#be4047}.tag.green{background:#eaf9f2;color:#158357}.tag.amber{background:#fff7e6;color:#98670c}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.note{background:#f0f5ff;border:1px solid #dce7ff;border-radius:12px;padding:13px;color:#43577e;font-size:12px;line-height:1.6}.notice{background:#fff8e9;border:1px solid #f8e4b0;color:#805a13}.bar{height:9px;background:#eef1f7;border-radius:30px;overflow:hidden}.fill{height:100%;background:#567cf0;border-radius:30px}.bars{display:grid;gap:16px}.bar-label{display:flex;justify-content:space-between;font-size:12px;margin:0 0 6px}.stack{display:grid;gap:16px}.hide{display:none!important}.empty{text-align:center;padding:35px;color:#8792a4}.upload{border:2px dashed #bfcee8;border-radius:14px;padding:37px;text-align:center;background:#f9fbff}.upload input{width:100%;max-width:350px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px;font-size:12px;font-weight:700;color:#617188}.field input,.field select{width:100%}#toast{position:fixed;right:20px;bottom:20px;background:#182b48;color:white;padding:14px 18px;border-radius:10px;box-shadow:0 12px 40px #0003;display:none;z-index:10;max-width:330px}.mobilebar{display:none}.mono{font-variant-numeric:tabular-nums}code{font-size:12px;background:#edf1f9;padding:3px 5px;border-radius:4px}.foot{font-size:11px;color:#8994a4;padding:28px 0}.link{color:#3c66df;font-weight:700;cursor:pointer}.scroll-x{overflow-x:auto}.matrix td:first-child{font-weight:700;background:white;position:sticky;left:0}.matrix th:first-child{position:sticky;left:0;z-index:2}.pricebad{background:#fff0f1;color:#b73542;font-weight:800}.pricelow{background:#ecfaf3;color:#167b51;font-weight:800}@media(max-width:1080px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.side{width:210px}.content{padding:22px}}@media(max-width:700px){.side{display:none;position:fixed;z-index:5;top:0;bottom:0;overflow:auto;box-shadow:0 0 0 100vw #07122670}.side.open{display:block}.mobilebar{display:inline-block}.header{padding:14px 16px}.header-right{gap:4px}.header-right select{max-width:130px}.content{padding:17px}.stats{gap:9px}.card{padding:15px}.kpi{font-size:23px}.formgrid{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body>
<div class="layout"><aside class="side" id="sidebar"><div class="brand"><div class="brandmark">✓</div> Invoice Control</div><div class="group-label">WERKRUIMTE</div><div id="nav"></div><div class="group-label">BEHEER</div><div id="navadmin"></div><div class="note" style="background:#1b2b49;border-color:#344565;color:#c7d5ef;margin:22px 4px">🔒 Demo-omgeving<br>Geen echte documenten uploaden. Gegevens blijven in deze browsersessie.</div></aside>
<div class="main"><div class="header"><div><button class="btn ghost mobilebar" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><strong id="crumb">Dashboard</strong><div class="small muted">9 vestigingen · leverancierscontrole</div></div><div class="header-right"><select id="role" class="select" aria-label="Demorol"><option value="system">Systeembeheerder</option><option value="admin">Admin</option><option value="branch">Vestigingsgebruiker</option></select><select id="month" class="select" aria-label="Maand"><option value="2026-11">November 2026</option><option value="2026-10">Oktober 2026</option></select><span class="pill">DEMO</span></div></div><main class="content" id="content"></main></div></div><div id="toast"></div>
<script>
const branches=['Rotterdam Centrum','Rotterdam Noord','Rotterdam Zuid','Schiedam','Delft','Den Haag','Utrecht','Breda','Amsterdam'];
const suppliers=['Van Dijk Foodservice','Holland Dairy BV','Freshline Groothandel','Euro Foods BV','Delta Distributie','Noord Trade'];
const products=[{ean:'8711234000001',name:'Witte kaas 800 g',unit:'stuk',base:4.2},{ean:'8711234000002',name:'Yoghurt 1 kg',unit:'stuk',base:1.39},{ean:'8711234000003',name:'Rijst 5 kg',unit:'zak',base:7.9},{ean:'8711234000004',name:'Zonnebloemolie 1 L',unit:'fles',base:1.85},{ean:'8711234000005',name:'Kikkererwten 1 kg',unit:'zak',base:1.6},{ean:'8711234000006',name:'Tomatenpuree 800 g',unit:'blik',base:2.2}];
let invoices=[],alerts=[],newSupplier=[],section='dashboard',role='system',month='2026-11',branch=0,supplierFilter='all',search='',audit=[];
const eur=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const pct=n=>new Intl.NumberFormat('nl-NL',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(let m of ['2026-10','2026-11'])for(let b=0;b<9;b++)for(let s=0;s<6;s++)for(let p=0;p<6;p++){
const base=products[p].base;let modifier=1+(m==='2026-11'?.015:0);if(s===1&&p===0&&b===1&&m==='2026-11')modifier=4.65/base;if(s===1&&p===0&&b===6&&m==='2026-11')modifier=4.45/base;if(s===2&&p===3&&b===3&&m==='2026-11')modifier=2.23/base;
const price=Math.round(base*modifier*100)/100,qty=10+((b*7+s*3+p*5)%20)*5;
invoices.push({id:'INV-'+m.replace('-','')+'-'+String(b+1).padStart(2,'0')+'-'+s+'-'+p,branch:b,supplier:s,month:m,day:2+(b+s+p)%24,ean:products[p].ean,product:p,price,qty,status:price>base*1.07?'controleren':'goedgekeurd',source:'demo'});
}
function dataset(){return invoices.filter(x=>x.month===month&&(role!=='branch'||x.branch===branch)&&(supplierFilter==='all'||x.supplier===+supplierFilter)&&(!search||(x.id+' '+products[x.product]?.name+' '+suppliers[x.supplier]).toLowerCase().includes(search.toLowerCase())))}
function compare(monthValue=month){const d=invoices.filter(x=>x.month===monthValue);let out=[];for(let s=0;s<suppliers.length;s++)for(let p=0;p<products.length;p++){let g=d.filter(x=>x.supplier===s&&x.product===p);if(!g.length)continue;let low=Math.min(...g.map(x=>x.price)),high=Math.max(...g.map(x=>x.price));if(high-low>=.03){for(let x of g.filter(x=>x.price>low+.025)){out.push({...x,low,high,diff:x.price-low,amount:Math.round((x.price-low)*x.qty*100)/100,variance:(x.price/low-1)})}}}return out.sort((a,b)=>b.amount-a.amount)}
function allowed(s){return role!=='branch'||!['users','settings','audit','suppliers'].includes(s)}
const navItems=[['dashboard','◫','Dashboard'],['invoices','▤','Facturen'],['upload','⇧','Factuur uploaden'],['compare','≋','Vestigingen vergelijken'],['alerts','⚠','Prijsafwijkingen'],['reports','▥','Rapportages'],['credit','↩','Creditnota’s'],['emails','✉','E-mailconcepten']];
const adminItems=[['suppliers','▦','Leveranciers'],['users','♙','Gebruikers'],['audit','◷','Auditlog'],['settings','⚙','Instellingen']];
function nav(){document.getElementById('nav').innerHTML=navItems.filter(x=>allowed(x[0])).map(x=>'<button class="nav '+(section===x[0]?'active':'')+'" data-s="'+x[0]+'">'+x[1]+' &nbsp; '+x[2]+'</button>').join('');document.getElementById('navadmin').innerHTML=adminItems.filter(x=>allowed(x[0])&&(role==='system'||!['users','settings','audit'].includes(x[0]))).map(x=>'<button class="nav '+(section===x[0]?'active':'')+'" data-s="'+x[0]+'">'+x[1]+' &nbsp; '+x[2]+'</button>').join('');document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{section=n.dataset.s;document.getElementById('sidebar').classList.remove('open');render()})}
const tag=(text,tone='')=>'<span class="tag '+tone+'">'+esc(text)+'</span>';
const title=(text,sub,actions='')=>'<div class="titlebar"><div><h1>'+text+'</h1><p class="muted small">'+sub+'</p></div><div>'+actions+'</div></div>';
function dashboard(){let d=dataset(),a=compare().filter(x=>role!=='branch'||x.branch===branch),sum=d.reduce((v,x)=>v+x.price*x.qty,0),total=a.reduce((v,x)=>v+x.amount,0);const chart=suppliers.map((s,i)=>({s,value:a.filter(x=>x.supplier===i).reduce((v,x)=>v+x.amount,0)})).sort((a,b)=>b.value-a.value);return title('Overzicht','Realtime berekening uit voorbeeldfacturen · '+(role==='branch'?branches[branch]:'Alle 9 vestigingen'),'<button class="btn" onclick="go(\'upload\')">+ Factuur toevoegen</button>')+'<div class="stats">'+[['Factuurregels',d.length,'blue'],['Te onderzoeken verschillen',a.length,'red'],['Mogelijk prijsverschil',eur(total),'amber'],['Inkoopwaarde excl. btw',eur(sum),'green']].map(x=>'<div class="card"><div class="small muted">'+x[0]+'</div><div class="kpi '+x[2]+'">'+x[1]+'</div><span class="small muted">Geselecteerde maand</span></div>').join('')+'</div><div class="grid"><div class="card"><h2>Recente prijsafwijkingen</h2>'+alertTable(a.slice(0,7))+'<p style="margin-top:17px"><button class="btn secondary" onclick="go(\'alerts\')">Alle afwijkingen bekijken →</button></p></div><div class="card"><h2>Verschil per leverancier</h2><div class="bars">'+chart.map(x=>'<div><div class="bar-label"><span>'+esc(x.s)+'</span><b>'+eur(x.value)+'</b></div><div class="bar"><div class="fill" style="width:'+(total?Math.round(x.value/Math.max(1,chart[0].value)*100):0)+'%"></div></div></div>').join('')+'</div><div class="note" style="margin-top:22px">Prijsverschillen zijn signalen, geen bewezen factuurfouten. Controleer kortingsafspraken, staffelprijzen, leverdata en verpakkingseenheden.</div></div></div>'}
function alertTable(a){if(!a.length)return '<div class="empty">Geen afwijkingen in de selectie.</div>';return '<div class="tablewrap"><table><thead><tr><th>Product</th><th>Vestiging</th><th>Leverancier</th><th>Laagste</th><th>Gefactureerd</th><th>Verschil</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(products[x.product]?.name||'Nieuw product')+'</b></td><td>'+esc(branches[x.branch])+'</td><td>'+esc(suppliers[x.supplier])+'</td><td>'+eur(x.low)+'</td><td>'+eur(x.price)+'</td><td>'+tag('+'+pct(x.variance),'red')+'</td></tr>').join('')+'</tbody></table></div>'}
function invoicePage(){const d=dataset().slice(0,120);return title('Facturen','Alle factuurregels; selecteer leverancier en maand','<button class="btn" onclick="go(\'upload\')">+ Nieuwe factuur</button>')+filters()+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Factuurnummer</th><th>Vestiging</th><th>Leverancier</th><th>Product</th><th>Datum</th><th>Hoeveelheid</th><th>Eenheidsprijs</th><th>Bedrag</th><th>Status</th></tr></thead><tbody>'+d.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(branches[x.branch])+'</td><td>'+esc(suppliers[x.supplier])+'</td><td>'+esc(products[x.product]?.name||'Onbekend')+'</td><td>'+x.day+'-'+x.month.slice(5)+'-'+x.month.slice(0,4)+'</td><td>'+x.qty+'</td><td>'+eur(x.price)+'</td><td>'+eur(x.qty*x.price)+'</td><td>'+tag(x.status,x.status==='controleren'?'red':'green')+'</td></tr>').join('')+'</tbody></table></div><p class="small muted">Maximaal 120 regels getoond van '+dataset().length+'. Werkelijke facturen bevatten meerdere regels; dit is illustratieve demo-invoer.</p></div>'}
function filters(){return '<div class="filters"><select class="select" id="supplierfilter" onchange="supplierFilter=this.value;render()"><option value="all">Alle leveranciers</option>'+suppliers.map((x,i)=>'<option value="'+i+'" '+(supplierFilter==i?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><input placeholder="Zoek factuur, product..." value="'+esc(search)+'" oninput="search=this.value;render()" aria-label="Zoeken"></div>'}
function comparison(){let a=compare().filter(x=>role!=='branch'||x.branch===branch).filter(x=>supplierFilter==='all'||x.supplier===+supplierFilter),groups=[];for(let s=0;s<suppliers.length;s++)for(let p=0;p<products.length;p++){const items=invoices.filter(x=>x.month===month&&x.supplier===s&&x.product===p),low=Math.min(...items.map(x=>x.price)),high=Math.max(...items.map(x=>x.price));if(high-low>=.03&&(supplierFilter==='all'||s===+supplierFilter))groups.push({s,p,items,low,high})}return title('Vestigingen vergelijken','Hetzelfde EAN bij dezelfde leverancier in dezelfde maand · bedragen excl. btw')+filters()+'<div class="stats">'+[['Vestigingen',9,'blue'],['Prijsafwijkingen',a.length,'red'],['Mogelijke impact',eur(a.reduce((v,x)=>v+x.amount,0)),'amber'],['Unieke producten',products.length,'green']].map(x=>'<div class="card"><div class="small muted">'+x[0]+'</div><div class="kpi '+x[2]+'">'+x[1]+'</div></div>').join('')+'</div><div class="card"><h2>Prijsvergelijking per vestiging</h2><div class="note" style="margin-bottom:16px">'+(role==='branch'?'Je ziet je eigen prijs en een geanonimiseerde laagste prijs. Andere vestigingsfacturen blijven privé.':'Rood is hoger dan het laagste gemeten bedrag. Dit bewijst nog niet dat er onjuist is gefactureerd.')+'</div><div class="scroll-x"><table class="matrix"><thead><tr><th>Leverancier / Product</th>'+(role==='branch'?'<th>Mijn vestiging</th><th>Laagste prijs</th>':branches.map(x=>'<th>'+esc(x)+'</th>').join(''))+'<th>Verschil</th></tr></thead><tbody>'+groups.map(g=>'<tr><td><b>'+esc(products[g.p].name)+'</b><br><span class="small muted">'+esc(suppliers[g.s])+'</span></td>'+(role==='branch'?(()=>{const x=g.items.find(x=>x.branch===branch);return '<td class="'+(x.price>g.low+.025?'pricebad':'pricelow')+'">'+eur(x.price)+'</td><td>'+eur(g.low)+'</td>'})():g.items.map(x=>'<td class="'+(x.price>g.low+.025?'pricebad':'pricelow')+'">'+eur(x.price)+'</td>').join(''))+'<td>'+tag('+'+pct(g.high/g.low-1),'red')+'</td></tr>').join('')+'</tbody></table></div></div>'}
function alertsPage(){let a=compare().filter(x=>role!=='branch'||x.branch===branch).filter(x=>supplierFilter==='all'||x.supplier===+supplierFilter);return title('Prijsafwijkingen','Maandelijkse verschillen tussen vestigingen; handmatige verificatie vereist','<button class="btn secondary" onclick="downloadCSV()">↓ CSV export</button>')+filters()+'<div class="card">'+alertTable(a)+'<div class="note" style="margin-top:15px">Onderzoek per afwijking: identieke EAN, prijs excl. btw, netto korting, hoeveelheid, verpakking, leveranciersafspraak en factuurdatum. Na goedkeuring kan de admin een e-mailconcept opstellen.</div></div>'}
function reports(){let a=compare(),vals=suppliers.map((s,i)=>({s,n:a.filter(x=>x.supplier===i).length,v:a.filter(x=>x.supplier===i).reduce((t,x)=>t+x.amount,0)}));return title('Rapportages','Leveranciersoverzicht en geconstateerde verschillen','<button class="btn" onclick="downloadCSV()">↓ Download CSV</button>')+'<div class="card"><h2>Verschillen per leverancier</h2><div class="tablewrap"><table><thead><tr><th>Leverancier</th><th>Aantal afwijkingen</th><th>Theoretisch verschil</th><th>Status</th></tr></thead><tbody>'+vals.map(x=>'<tr><td>'+esc(x.s)+'</td><td>'+x.n+'</td><td>'+eur(x.v)+'</td><td>'+tag(x.n?'Onderzoek vereist':'Geen afwijking',x.n?'amber':'green')+'</td></tr>').join('')+'</tbody></table></div><div class="note" style="margin-top:15px">Dit zijn theoretische verschillen versus de laagste factuurprijs, niet bevestigde terugvorderingen of gerealiseerde besparingen.</div></div>'}
function suppliersPage(){return title('Leveranciers','Leveranciersregister; alleen beheerder kan wijzigen','<button class="btn" onclick="addSupplier()">+ Leverancier toevoegen</button>')+'<div class="card"><table><thead><tr><th>Leverancier</th><th>Factuurregels</th><th>Afwijkingen deze maand</th><th>Contact</th></tr></thead><tbody>'+suppliers.map((s,i)=>'<tr><td><b>'+esc(s)+'</b></td><td>'+invoices.filter(x=>x.supplier===i).length+'</td><td>'+compare().filter(x=>x.supplier===i).length+'</td><td>'+tag('Niet ingesteld')+'</td></tr>').join('')+'</tbody></table></div>'}
function addSupplier(){if(role==='branch'){toast('Geen toegang');return}let s=prompt('Naam nieuwe leverancier');if(!s||!s.trim())return;if(suppliers.includes(s.trim())){toast('Leverancier bestaat al');return}suppliers.push(s.trim());audit.push('Leverancier aangemaakt: '+s.trim());render();toast('Leverancier toegevoegd voor deze demosessie')}
function users(){const rows=branches.map((b,i)=>({name:'Vestigingsgebruiker '+(i+1),role:'Vestigingsgebruiker',branch:b})).concat([{name:'Bedrijfsadmin',role:'Admin',branch:'Alle vestigingen'},{name:'Systeemadmin',role:'Systeembeheerder',branch:'Alle vestigingen'}]);return title('Gebruikers','11 posities: 9 vestigingsgebruikers, 1 admin en 1 systeembeheerder')+'<div class="card"><table><thead><tr><th>Gebruiker</th><th>Rol</th><th>Toegang</th><th>Accountstatus</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.name+'</td><td>'+x.role+'</td><td>'+x.branch+'</td><td>'+tag('Demo, niet aangemaakt','amber')+'</td></tr>').join('')+'</tbody></table></div><div class="note" style="margin-top:17px">Een echte implementatie heeft identiteitsbeheer, unieke accounts, server-side rechten en beveiligde sessies nodig. De rolkeuze hierboven simuleert alleen de schermen.</div>'}
function upload(){return title('Factuur uploaden','Test lokaal met een eenvoudige CSV of UBL/XML; geen serverupload')+'<div class="grid"><div class="card"><h2>Document selecteren</h2><div class="upload"><div style="font-size:40px">⇧</div><p><b>Sleep of kies een factuurbestand</b></p><p class="small muted">CSV of UBL/XML lokaal proberen. PDF/foto OCR is nog niet aangesloten.</p><p><input type="file" id="file" accept=".csv,.xml,.ubl,.pdf,image/*"></p></div><div class="formgrid" style="margin:18px 0"><label class="field">Vestiging<select id="upbranch" '+(role==='branch'?'disabled':'')+'>'+branches.map((x,i)=>'<option value="'+i+'" '+(i===branch?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><label class="field">Leverancier<select id="upsupplier">'+suppliers.map((x,i)=>'<option value="'+i+'">'+esc(x)+'</option>').join('')+'</select></label></div><a class="btn" style="display:inline-block;text-decoration:none;margin-right:8px" href="./test.html">Open uitgebreid upload- en testcentrum →</a><button class="btn secondary" onclick="processFile()">Snelle CSV/XML test</button><p id="uploadresult" class="small muted" style="margin-top:15px">Kies een bestand om de controle te starten.</p></div><div class="card"><h2>Hoe de controle werkt</h2><p class="small muted" style="line-height:2">1. Controleer de factuurgegevens en EAN.<br>2. Normaliseer de prijs per producteenheid excl. btw.<br>3. Vergelijk dezelfde leverancier en hetzelfde product met eigen eerdere facturen.<br>4. Vergelijk met alle vestigingen in de geselecteerde maand.<br>5. Toon verschillen voor menselijke controle.</p><div class="note notice">Gebruik alleen testgegevens. Deze statische GitHub Pages-demo heeft geen authenticatie of beveiligde opslag. PDF/OCR, echte boekhouding en e-mailverzending zijn nog niet geïmplementeerd.</div></div></div>'}
async function processFile(){const f=document.getElementById('file')?.files?.[0],result=document.getElementById('uploadresult');if(!f){toast('Kies eerst een bestand');return}if(!/\.(csv|xml|ubl)$/i.test(f.name)){result.textContent='PDF en afbeeldingen vereisen een server-side parser. Dit is nog niet geactiveerd.';return}if(f.size>2e6){result.textContent='Bestand is te groot voor de demo (max 2 MB).';return}try{let txt=await f.text(),lines=[];if(/\.csv$/i.test(f.name)){const rows=txt.trim().split(/\r?\n/).slice(0,100);let delim=rows[0]?.includes(';')?';':',';for(let line of rows.slice(1)){let c=line.split(delim);if(c.length>=3){let ean=c[0].trim(),qty=Number(c[1].trim().replace(',','.')),price=Number(c[2].trim().replace(',','.'));if(products.some(p=>p.ean===ean)&&Number.isFinite(qty)&&qty>0&&Number.isFinite(price)&&price>=0)lines.push({ean,qty,price})}}}else{let xml=new DOMParser().parseFromString(txt,'application/xml');if(xml.querySelector('parsererror'))throw Error('Ongeldige XML');let items=Array.from(xml.getElementsByTagName('*')).filter(x=>x.localName==='InvoiceLine');for(let item of items.slice(0,100)){let entries=Array.from(item.getElementsByTagName('*'));let get=k=>entries.find(x=>x.localName===k)?.textContent?.trim();let ean=get('ID')||'',qty=Number(get('InvoicedQuantity')),price=Number(get('PriceAmount'));if(products.some(p=>p.ean===ean)&&qty>0&&price>=0)lines.push({ean,qty,price})}}if(!lines.length){result.textContent='Geen bekende EAN-regels gevonden. CSV verwacht: ean;quantity;unit_price. XML-parser ondersteunt een beperkte UBL-testsubset.';return}let b=role==='branch'?branch:+document.getElementById('upbranch').value,s=+document.getElementById('upsupplier').value;let matched=0,amount=0;for(let line of lines){let prod=products.findIndex(x=>x.ean===line.ean),ref=invoices.filter(x=>x.month===month&&x.supplier===s&&x.product===prod);let low=Math.min(...ref.map(x=>x.price));let diff=Math.max(0,line.price-low);if(diff>.025){matched++;amount+=diff*line.qty}invoices.push({id:'TEST-'+Date.now()+'-'+prod,branch:b,supplier:s,month,day:13,ean:line.ean,product:prod,price:line.price,qty:line.qty,status:diff>.025?'controleren':'goedgekeurd',source:'demo-upload'})}audit.push('Lokale testimport: '+f.name+' ('+lines.length+' regels)');result.innerHTML='<b>'+lines.length+' regels lokaal verwerkt.</b> '+matched+' prijsverschillen; theoretische impact '+eur(amount)+'. <a href="#" class="link" onclick="go(\'alerts\');return false">Bekijk afwijkingen →</a>';toast('Lokale test afgerond; niets naar server verstuurd')}catch(e){result.textContent='Bestand kon niet worden verwerkt: '+e.message}}
function emails(){return title('E-mailconcepten','Klaarzetten voor goedkeuring; verzending niet verbonden')+'<div class="card"><h2>Voorbeeld bezwaarbrief (Nederlands)</h2><label class="field">Onderwerp<input value="Controle prijsverschil op facturen november 2026" readonly></label><div class="note" style="margin-top:13px;background:white">Geachte leverancier,<br><br>Bij onze interne factuurcontrole hebben wij een verschil geconstateerd in de gefactureerde eenheidsprijzen tussen onze vestigingen in dezelfde maand. Wilt u de prijsafspraken en de betrokken facturen controleren en ons informeren of een creditnota nodig is?<br><br>Met vriendelijke groet,<br>Afdeling Inkoop</div><p style="margin-top:15px"><button class="btn secondary" onclick="copyEmail()">Kopieer concept</button> <button class="btn" disabled>Verzenden (integratie vereist)</button></p></div>'}
function copyEmail(){navigator.clipboard?.writeText('Geachte leverancier,\n\nBij onze interne factuurcontrole hebben wij prijsverschillen tussen vestigingen geconstateerd. Wilt u de betrokken facturen en prijsafspraken controleren?\n\nMet vriendelijke groet,\nAfdeling Inkoop');toast('E-mailconcept gekopieerd')}
function auditPage(){return title('Auditlog','Demo-gebeurtenissen tijdens deze browsersessie')+'<div class="card">'+(audit.length?audit.map(x=>'<p>• '+esc(x)+'</p>').join(''):'<div class="empty">Nog geen demo-acties geregistreerd.</div>')+'</div>'}
function simple(name,descr){return title(name,descr)+'<div class="card"><div class="empty">Deze module is voorbereid. Voor echte transacties is een beveiligde database en backend-integratie nodig.</div></div>'}
function settings(){return title('Instellingen','Aanbevolen controlebeleid voor productie')+'<div class="card"><h2>Controlebeleid</h2><div class="note">✓ Vergelijkingsbasis: netto eenheidsprijs, exclusief btw<br>✓ Periode: kalendermaand en historische facturen<br>✓ Sleutel: leverancier + EAN + verkoop-/verpakkingseenheid<br>✓ Drempel: prijsverschil vanaf €0,03 in deze demo<br>✓ Afwijking betekent: te onderzoeken, niet bewezen fout<br>✓ Goedkeuring door admin vóór leveranciersmail<br>✓ RLS: productie vereist databasebeleid per vestiging</div></div>'}
function credit(){return simple('Creditnota’s','Koppel creditnota aan betwiste factuur en volg openstaande bedragen')}
function go(s){section=s;render();window.scrollTo({top:0,behavior:'instant'})}
function downloadCSV(){let arr=compare().filter(x=>role!=='branch'||x.branch===branch).map(x=>[month,suppliers[x.supplier],role==='branch'?'Mijn vestiging':branches[x.branch],products[x.product].ean,products[x.product].name,x.low,x.price,x.qty,x.amount,x.id]);let rows=[['maand','leverancier','vestiging','ean','product','laagste_prijs','factuur_prijs','aantal','theoretisch_verschil','factuur'],...arr];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='invoice-control-'+month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3500)}
function render(){if(!allowed(section))section='dashboard';nav();document.getElementById('crumb').textContent=[...navItems,...adminItems].find(x=>x[0]===section)?.[2]||'Dashboard';const pages={dashboard, invoices:invoicePage,upload,compare:comparison,alerts:alertsPage,reports,suppliers:suppliersPage,users,emails,credit,audit:auditPage,settings};document.getElementById('content').innerHTML=(pages[section]||dashboard)()+'<div class="foot">Invoice Control · Open codebase · Statische demonstratie · Geen echte persoonsgegevens of facturen opslaan</div>'}
document.getElementById('role').onchange=e=>{role=e.target.value;branch=0;section='dashboard';render()};document.getElementById('month').onchange=e=>{month=e.target.value;render()};render();
</script></body></html>
