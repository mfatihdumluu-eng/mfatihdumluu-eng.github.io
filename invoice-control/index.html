<style>
:root{font:15px Inter,system-ui,-apple-system,Arial,sans-serif;color:#233047;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}header{background:white;border-bottom:1px solid #e6eaf1;padding:17px max(16px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{font-weight:850;letter-spacing:-.65px;font-size:20px;color:#2533af}.logo span{display:inline-grid;place-items:center;background:#3b4cca;color:white;width:32px;height:32px;border-radius:10px;margin-right:9px}.userbar{display:flex;gap:10px;align-items:center}select,input,textarea{background:white;border:1px solid #dbe2ee;border-radius:9px;padding:11px 13px;color:#2e3c54;max-width:100%}main{max-width:1160px;margin:auto;padding:26px 16px 40px}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:28px;letter-spacing:-.9px;margin:0 0 6px}h2{font-size:19px;letter-spacing:-.35px;margin:0 0 14px}h3{font-size:15px;margin:0 0 9px}p{color:#7b8798;line-height:1.55;font-size:13px;margin:6px 0}.muted{color:#8793a7;font-size:12px}.btn{padding:12px 17px;border:0;border-radius:9px;color:white;background:#4054cd;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}.btn.light{color:#3d50bc;background:#edf0ff}.btn.white{color:#485b71;background:white;border:1px solid #dbe3ee}.btn.red{background:#c6364b}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.action{background:white;border:1px solid #e4e9f2;border-radius:13px;padding:20px 15px;text-align:left;display:grid;gap:9px;min-height:136px;box-shadow:0 3px 14px #22304d07}.action strong{font-size:15px}.action small{font-size:12px;color:#788699}.action .symbol{font-size:27px;color:#4355d2}.action.active{border:2px solid #4456d1;background:#f4f6ff;padding:19px 14px}.action.warning{border-color:#f2cbd4}.action.warning .symbol{color:#c53e53}.action .count{font-size:11px;font-weight:800;border-radius:14px;padding:4px 7px;background:#ffeeef;color:#b73245;margin-left:6px}.card{background:white;border:1px solid #e5eaf2;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 19px #24305005}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:215px}.toolbar select{min-width:160px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{padding:13px 11px;text-align:left;border-bottom:1px solid #edf0f5}th{font-size:11px;color:#8490a2;background:#fafbfe}td{color:#34435a}tr:last-child td{border-bottom:0}.tap{border:0;background:none;color:#4052c7;text-decoration:underline;text-underline-offset:3px;font-weight:800;padding:0}.tap:hover{color:#273698}.tag{background:#eaf0ff;color:#4053ba;border-radius:18px;font-size:11px;font-weight:800;padding:5px 9px;display:inline-block}.tag.red{background:#ffecf0;color:#ba3449}.tag.green{background:#e8f7ef;color:#148359}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between;flex-wrap:wrap}.alert{border:1px solid #f3cad1;background:#fff4f5;border-left:5px solid #c83d4f;border-radius:10px;padding:14px 17px;margin-bottom:15px;color:#8d4150;font-size:13px}.notice{border:1px solid #dce6fc;background:#f4f7ff;border-radius:10px;padding:13px 15px;font-size:12px;color:#5d6d8b;line-height:1.6;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#f6f8fd;border-radius:11px;padding:15px}.stat b{font-size:21px;display:block;margin-top:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;margin-bottom:12px;font-size:12px;color:#607087;font-weight:750}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:125px}.empty{text-align:center;padding:37px;color:#8795a9}.back{border:0;background:none;color:#4457bf;padding:0;font-weight:750;margin-bottom:15px}.foot{font-size:11px;color:#93a0b0;padding:12px 0}.supplierCard{border:1px solid #e6eaf2;background:white;border-radius:11px;padding:17px;display:grid;gap:7px;text-align:left;width:100%}.supplierCard b{font-size:15px}.supplierList{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.profile{display:grid;grid-template-columns:95px 1fr;gap:13px;align-items:center}.logoBox{width:74px;height:74px;border-radius:16px;background:#e9ecff;display:grid;place-items:center;font-size:24px;font-weight:850;color:#4053c6}.lightLine{border-bottom:1px solid #edf1f5;padding:9px 0}.mini{font-size:12px;color:#718097}.hide{display:none!important}@media(max-width:850px){.actions{grid-template-columns:repeat(2,1fr)}.supplierList{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:560px){header{padding:12px}.logo{font-size:16px}.userbar select{max-width:140px}.actions{gap:8px}.action{min-height:117px;padding:14px 11px}.action.active{padding:13px 10px}.action strong{font-size:13px}.action small{font-size:11px}main{padding:17px 12px}h1{font-size:23px}.card{padding:14px}.supplierList{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
.price-ref{background:#e8f8f0;color:#0a7650;font-weight:850;border-radius:9px;padding:8px 10px;display:inline-block}.price-diff{background:#ffeaed;color:#b72b41;font-weight:900;border-radius:9px;padding:8px 10px;display:inline-block}.price-no{background:#f0f2f7;color:#8994a8;border-radius:9px;padding:8px 10px;display:inline-block}.matrix-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.branch-price{border:1px solid #e5e9f2;border-radius:11px;padding:13px;display:grid;gap:9px}.branch-price .mini{font-size:12px}.branch-price.different{border-color:#efb5bf;background:#fff7f8}.branch-price.base{border-color:#bce1ce;background:#f6fcf9}.diff-pill{font-weight:800;color:#b72b41}.compare-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}@media(max-width:750px){.matrix-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.matrix-grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="logo"><span>✓</span>Invoice Control</div><div class="userbar"><span class="muted">Görünüm:</span><select id="who" aria-label="Kullanıcı görünümü"><option value="admin">Admin</option><option value="system">Sistem Admini</option><option value="0">Şube 1</option><option value="1">Şube 2</option><option value="2">Şube 3</option><option value="3">Şube 4</option><option value="4">Şube 5</option><option value="5">Şube 6</option><option value="6">Şube 7</option><option value="7">Şube 8</option><option value="8">Şube 9</option></select></div></header>
<main><div class="hero"><div><h1 id="heading">Ne yapmak istiyorsunuz?</h1><p id="subheading">Tek işlem seçin. Sistem ilgili kayıtları gösterecek.</p></div><span class="tag">DEMO · Gerçek giriş sistemi değil</span></div>
<div id="actions" class="actions"></div><div id="view"></div>
<div class="foot">Bu uygulama örnek verilerle çalışan yerel demodur. Gerçek faturaları güvenli sunucu kurulmadan kullanmayın. <a href="./gelismis.html">Önceki ayrıntılı arayüz</a></div></main>
<script>
const BRANCHES=['Dordrecht – Wielwijk','Dordrecht – Merwedepolder Oost','Schiedam','Utrecht','Breda','Bergen op Zoom','Gorinchem','Tilburg','Eindhoven'];
const PRODUCTS=[{ean:'5449000000996',name:'Coca Cola 1L'},{ean:'8711234000001',name:'Beyaz Peynir 800 g'},{ean:'8711234000002',name:'Yoğurt 1 kg'},{ean:'8711234000003',name:'Basmati Pirinç 5 kg'}];

// Fictional product names and EANs for interface tests (not real catalog/barcodes).
PRODUCTS.push(
 {ean:'DEMO-0005',name:'Ayçiçek Yağı 1 L'},
 {ean:'DEMO-0006',name:'Nohut 1 kg'},
 {ean:'DEMO-0007',name:'Kırmızı Mercimek 1 kg'},
 {ean:'DEMO-0008',name:'Domates Salçası 800 g'},
 {ean:'DEMO-0009',name:'Kaşar Peyniri 700 g'},
 {ean:'DEMO-0010',name:'Tavuk But 1 kg'},
 {ean:'DEMO-0011',name:'Bulgur 1 kg'},
 {ean:'DEMO-0012',name:'Makarna 500 g'},
 {ean:'DEMO-0013',name:'Şeker 1 kg'},
 {ean:'DEMO-0014',name:'Un 1 kg'},
 {ean:'DEMO-0015',name:'Süt 1 L'},
 {ean:'DEMO-0016',name:'Yumurta 10 Adet'},
 {ean:'DEMO-0017',name:'Çay 500 g'},
 {ean:'DEMO-0018',name:'Mango Adet'},
 {ean:'DEMO-0019',name:'Avokado Adet'},
 {ean:'DEMO-0020',name:'Havuç 1 kg'},
 {ean:'DEMO-0021',name:'Mantar 250 g'},
 {ean:'DEMO-0022',name:'Patates 5 kg'},
 {ean:'DEMO-0023',name:'Soğan 2 kg'},
 {ean:'DEMO-0024',name:'Ton Balığı 160 g'},
 {ean:'DEMO-0025',name:'Kakaolu Gofret 40 g'},
 {ean:'DEMO-0026',name:'Maden Suyu 6x200 ml'},
 {ean:'DEMO-0027',name:'Beyaz Fasulye 1 kg'},
 {ean:'DEMO-0028',name:'Tereyağı 250 g'},
 {ean:'DEMO-0029',name:'Dondurulmuş Bezelye 1 kg'},
 {ean:'DEMO-0030',name:'Portakal Suyu 1 L'},
 {ean:'DEMO-0031',name:'Domates 1 kg'},
 {ean:'DEMO-0032',name:'Salatalık 1 kg'},
 {ean:'DEMO-0033',name:'Pirinç 1 kg'},
 {ean:'DEMO-0034',name:'Zeytin 500 g'}
);
const SUPPLIERS=['Holland Dairy BV','Van Dijk Foodservice','Freshline Groothandel','Euro Foods BV','Delta Distributie','Noord Trade','Doyum Food B.V.'];
const KEY='invoice-control-demo-invoices-v1',META='invoice-control-supplier-metadata-v2';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),euro=x=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(x)||0);
const fixture=[
{id:'HD-2026-111',date:'2026-11-03',branch:0,supplier:1,items:[{ean:PRODUCTS[0].ean,name:PRODUCTS[0].name,qty:100,price:1.16},{ean:PRODUCTS[1].ean,name:PRODUCTS[1].name,qty:80,price:4.26}]},
{id:'HD-2026-112',date:'2026-11-05',branch:1,supplier:1,items:[{ean:PRODUCTS[0].ean,name:PRODUCTS[0].name,qty:120,price:1.37},{ean:PRODUCTS[1].ean,name:PRODUCTS[1].name,qty:100,price:4.65}]},
{id:'VD-2026-51',date:'2026-11-07',branch:2,supplier:2,items:[{ean:PRODUCTS[0].ean,name:PRODUCTS[0].name,qty:90,price:1.29},{ean:PRODUCTS[2].ean,name:PRODUCTS[2].name,qty:55,price:1.41}]},
{id:'VD-2026-54',date:'2026-11-10',branch:3,supplier:2,items:[{ean:PRODUCTS[0].ean,name:PRODUCTS[0].name,qty:75,price:1.17}]},
{id:'EF-2026-1',date:'2026-11-12',branch:6,supplier:4,items:[{ean:PRODUCTS[0].ean,name:PRODUCTS[0].name,qty:50,price:1.41}]},
{id:'HD-2026-101',date:'2026-10-04',branch:0,supplier:1,items:[{ean:PRODUCTS[0].ean,name:PRODUCTS[0].name,qty:100,price:1.05}]}];

// Stable fictitious assortment per supplier, repeated across all nine branches.
const demoBase=[1.16,4.26,1.41,7.90,1.85,1.65,1.74,2.20,4.45,3.20,1.25,.88,1.10,.69,2.90,3.25,2.15,1.89,1.10,.95,1.70,4.95,2.19,2.30,1.65,2.70,2.45,1.78,1.49,1.38,2.85,3.15,2.90,2.65];
for(const yearMonth of ['2026-11','2026-10']){
 for(let s=1;s<=6;s++){
  // Each supplier keeps its own set of ten products, identical for every branch.
  const assortment=Array.from({length:10},(_,k)=>(s*4+k*3)%PRODUCTS.length);
  for(let b=0;b<BRANCHES.length;b++){
   const items=assortment.map((productIndex,k)=>{
    const p=PRODUCTS[productIndex],qty=12+((s+b+k*5)%17)*3;
    const base=demoBase[productIndex]||2.10;
    // Most branch prices agree; two deliberate mismatches are clear test signals.
    const difference=(b===1&&k===1?.085:0)+(b===5&&k===4?.06:0);
    const price=+(base*(yearMonth==='2026-11'?1.015:1)*(1+difference)).toFixed(2);
    return {ean:p.ean,name:p.name,qty,price};
   });
   fixture.push({id:'ORNEK-'+yearMonth.replace('-','')+'-'+s+'-'+(b+1),date:yearMonth+'-'+String(2+(s*2+b)%25).padStart(2,'0'),branch:b,supplier:s,source:'demo',items});
  }
 }
}
let invoiceNumberQuery='';let mode='home',role='admin',branch=0,month='2026-11',allTime=false,term='',selectedInvoice='',selectedEan='',selectedSupplier=1,productSupplier='all',origin='invoices',invoiceReturn='invoices',draft='';
function getStored(){try{const r=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(r)?r:[]}catch{return[]}}
function invoices(){return getStored().map(i=>({...i,items:i.items.map(x=>({...x,name:x.name||PRODUCTS.find(p=>p.ean===x.ean)?.name||'Ürün'}))})).concat(fixture)}
function isAdmin(){return role==='admin'||role==='system'}
function canInvoice(i){return isAdmin()||Number(i.branch)===branch}
function scope(i){return canInvoice(i)&&(isAdmin()&&allTime||i.date.slice(0,7)===month)}
function normalized(s){return String(s||'').toLocaleLowerCase('tr').replace(/coca[\s-]*cola/gi,'cocacola').replace(/(\d)\s+(l|kg|ml)/gi,'$1$2').replace(/[^a-z0-9ğüşöçı]+/gi,' ').trim()}
function productName(i){return i.name||PRODUCTS.find(p=>p.ean===i.ean)?.name||'Ürün'}
function match(p,q){return normalized(p.ean+' '+productName(p)).includes(normalized(q))}
function comparisonEligible(i){
 if(fixture.includes(i))return true;
 if(i.status==='Taslak')return false;
 const file=String(i.documentName||i.source||'');
 if(!/\.(pdf|png|jpe?g|webp)$/i.test(file))return true;
 const summary=i.invoiceSummary?.document;
 if(!summary||summary.net==null||summary.vat==null||summary.gross==null)return false;
 const rows=Array.isArray(i.items)?i.items:[];
 if(!rows.length||rows.some(x=>!(Number(x.qty)>0)||!(Number(x.price)>=0)))return false;
 const net=rows.reduce((n,x)=>n+Number(x.qty)*Number(x.price),0),discount=Number(summary.discount)||0;
 return Math.abs(net-discount-Number(summary.net))<.04 &&
  Math.abs(Number(summary.net)+Number(summary.vat)-Number(summary.gross))<.04;
}
function removeUploadedInvoice(id){
 const list=getStored(),found=list.find(x=>x.id===id&&canInvoice(x));
 if(!found)return;
 if(!confirm('Hatalı fatura '+id+' kaydını listeden kaldırmak istiyor musun? Orijinal dosyanın tarayıcı arşivi bu işlemle silinmez.'))return;
 localStorage.setItem(KEY,JSON.stringify(list.filter(x=>x!==found)));
 setMode('invoices');
}
function lineData(){return invoices().filter(i=>comparisonEligible(i)&&(isAdmin()||i.branch===branch)).flatMap(i=>i.items.map(x=>({...x,invoice:i.id,date:i.date,branch:i.branch,supplier:i.supplier})))}
function allLines(){return invoices().filter(comparisonEligible).flatMap(i=>i.items.map(x=>({...x,invoice:i.id,date:i.date,branch:i.branch,supplier:i.supplier})))}
function monthInvoices(){return invoices().filter(scope)}
function supplierName(id){try{const data=JSON.parse(localStorage.getItem(META)||'{}');return data[id]?.name||SUPPLIERS[id-1]||'Tedarikçi'}catch{return SUPPLIERS[id-1]||'Tedarikçi'}}
function meta(id){let saved={};try{saved=JSON.parse(localStorage.getItem(META)||'{}')[id]||{}}catch{}return{name:supplierName(id),address:'',contact:'',companyEmail:'',email:'',phone:'',...saved}}
function total(i){return i.items.reduce((s,x)=>s+x.qty*x.price,0)}
function issues(){
 const groups=new Map();
 for(const x of allLines().filter(x=>x.date.startsWith(month))){const key=x.supplier+'|'+(x.ean||normalized(productName(x)));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}
 let out=[];for(const [k,rows] of groups){if(new Set(rows.map(r=>r.branch)).size<2)continue;const low=Math.min(...rows.map(r=>r.price)),high=Math.max(...rows.map(r=>r.price));if(high-low<.025)continue;const mine=rows.filter(r=>isAdmin()||r.branch===branch);if(!mine.length)continue;out.push({supplier:rows[0].supplier,ean:rows[0].ean,name:productName(rows[0]),low,high,rows:mine,amount:mine.reduce((v,r)=>v+Math.max(0,r.price-low)*r.qty,0)})}return out.sort((a,b)=>b.amount-a.amount)
}
function setMode(m){mode=m;term='';render();window.scrollTo(0,0)}
function chooseInvoice(id){let i=invoices().find(x=>x.id===id);if(!i||!canInvoice(i))return;invoiceReturn=mode;selectedInvoice=id;mode='invoiceDetail';render();window.scrollTo(0,0)}
function backInvoice(){setMode(invoiceReturn==='productDetail'?'productDetail':'invoices')}
function chooseProduct(ean,source=''){selectedEan=ean;origin=source?'invoiceDetail':mode;productSupplier='all';if(source){selectedInvoice=source;const i=invoices().find(v=>v.id===source);if(i)productSupplier=String(i.supplier)}mode='productDetail';render();window.scrollTo(0,0)}
function backProduct(){mode=origin==='invoiceDetail'?'invoiceDetail':'invoices';render()}
function rowProduct(x,invoice){return '<button class="tap" data-product="'+esc(x.ean)+'" data-source="'+esc(invoice||'')+'">'+esc(productName(x))+' ↗</button>'}
function actionButtons(){const actions=[['upload','⇧','Fatura Yükle','PDF, fotoğraf veya CSV'],['invoices','▤','Faturalarım',isAdmin()?'Faturaları ara':'Kendi şubemin faturaları'],['search','⌕','Ürün Ara','Tedarikçiler ve fiyatlar'],['errors','⚠','Hatalar','Kontrol gereken '+issues().length+' kayıt']];return actions.map(([key,icon,title,sub])=>'<button class="action '+(mode===key?'active ':'')+(key==='errors'&&issues().length?'warning':'')+'" data-nav="'+key+'"><span class="symbol">'+icon+'</span><strong>'+title+(key==='errors'&&issues().length?'<span class="count">'+issues().length+'</span>':'')+'</strong><small>'+sub+'</small></button>').join('')}
function picker(){return '<select id="month" aria-label="Ay"><option value="2026-11" '+(month==='2026-11'?'selected':'')+'>Kasım 2026</option><option value="2026-10" '+(month==='2026-10'?'selected':'')+'>Ekim 2026</option></select>'}
function tableInvoices(list){if(!list.length)return '<div class="empty">Bu aramaya uygun fatura bulunamadı.</div>';return '<div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Fatura No</th><th>Tür</th><th>Tedarikçi</th><th>Şube</th><th>Tutar</th><th></th></tr></thead><tbody>'+list.map(i=>'<tr><td>'+esc(i.date)+'</td><td><b>'+esc(i.id)+'</b></td><td>'+(i.status==='Taslak'?'<span class="tag red">TASLAK</span>':!comparisonEligible(i)?'<span class="tag red">DOĞRULANMAMIŞ</span>':fixture.includes(i)?'<span class="tag">ÖRNEK</span>':'<span class="tag green">YÜKLENDİ</span>')+'</td><td>'+esc(supplierName(i.supplier))+'</td><td>'+esc(BRANCHES[i.branch])+'</td><td>'+euro(total(i))+'</td><td><button class="btn light" data-invoice="'+esc(i.id)+'">Aç →</button></td></tr>').join('')+'</tbody></table></div>'}
function invoiceNumberMatches(i,number){const wanted=String(number||'').toLocaleLowerCase('tr').replace(/[^a-z0-9]/g,'');const actual=String(i.invoiceNo||i.id||'').toLocaleLowerCase('tr').replace(/[^a-z0-9]/g,'');return !wanted||actual.includes(wanted)}
function invoiceList(){const invoiceNumber=invoiceNumberQuery;const list=monthInvoices().filter(i=>invoiceNumberMatches(i,invoiceNumber)).filter(i=>!term||normalized([i.id,supplierName(i.supplier),BRANCHES[i.branch],...i.items.flatMap(x=>[productName(x),x.ean])].join(' ')).includes(normalized(term))).sort((a,b)=>b.date.localeCompare(a.date));return '<div class="card"><div class="row between"><h2>Fatura Sorgula</h2><span class="tag">'+list.length+' fatura</span></div><div class="toolbar"><input id="invoiceNumberSearch" aria-label="Fatura numarası ara" placeholder="Fatura No ile ara (tam veya kısmi)..." value="'+esc(invoiceNumberQuery)+'"><input id="query" placeholder="Ürün, EAN veya tedarikçi ara..." value="'+esc(term)+'">'+picker()+(isAdmin()?'<button class="btn '+(allTime?'':'light')+'" id="period">Tüm Zamanlar: '+(allTime?'Açık':'Kapalı')+'</button>':'')+'</div><div class="notice">Fatura No alanında numaranın tamamını veya bir bölümünü yazabilirsin. Şube yalnızca kendi faturalarını, admin seçilen ayı veya tüm zamanları arar.</div><div class="notice">ÖRNEK etiketi olan kayıtlar yalnızca tasarım ve test için oluşturulmuştur. YÜKLENDİ etiketi bu tarayıcıya kaydettiğiniz faturayı gösterir.</div>'+tableInvoices(list)+'</div>'}
function invoiceDetail(){const i=invoices().find(i=>i.id===selectedInvoice);if(!i||!canInvoice(i))return '<div class="card">Fatura yetkisi yok.</div>';return '<button class="back" data-back="invoice">← '+(invoiceReturn==='productDetail'?'Ürün kartına dön':'Fatura listesi')+'</button><div class="card"><h2>Fatura '+esc(i.id)+'</h2><p>'+esc(supplierName(i.supplier))+' · '+esc(BRANCHES[i.branch])+' · '+esc(i.date)+'</p>'+(comparisonEligible(i)?'':'<div class="alert"><b>⚠ DOĞRULANMAMIŞ FATURA.</b> Bu kaydın OCR ürünleri veya toplamları güvenilir değil. Fiyat karşılaştırmasına dahil edilmez. Yeniden yükleyip rakamları kontrol et.</div>')+(fixture.includes(i)?'':'<div class="row" style="margin:12px 0"><button class="btn red" data-remove-invoice="'+esc(i.id)+'">Hatalı Kaydı Kaldır</button></div>')+'<div class="stats"><div class="stat">Ürün sayısı<b>'+i.items.length+'</b></div><div class="stat">Toplam (KDV hariç)<b>'+euro(total(i))+'</b></div></div><div class="notice">Ürüne tıklayınca <b>Ürün Kartı</b> açılır. Son faturalardaki fiyatlar orada görünür.</div><div class="tablewrap"><table><thead><tr><th>Ürün ↗</th><th>EAN</th><th>Adet</th><th>Fiyat</th><th>Toplam</th></tr></thead><tbody>'+i.items.map(x=>'<tr><td>'+rowProduct(x,i.id)+'</td><td>'+esc(x.ean||'—')+'</td><td>'+x.qty+'</td><td>'+euro(x.price)+'</td><td>'+euro(x.qty*x.price)+'</td></tr>').join('')+'</tbody></table></div>'+(i.docId?'<div style="margin-top:15px"><a class="btn light" href="./belge.html?doc='+encodeURIComponent(i.docId)+'">Orijinal Belgeyi Aç ↗</a></div>':'<p class="muted">Bu örnek faturanın orijinal PDF belgesi bulunmuyor.</p>')+'</div>'}
function productResults(){
 const q=term.trim();
 if(!q)return '<div class="empty">Örneğin <b>Coca Cola 1L</b>, <b>peynir</b> veya EAN girin.</div>';
 const rows=allLines().filter(x=>(isAdmin()||x.branch===branch)&&(isAdmin()&&allTime||x.date.startsWith(month))&&match(x,q));
 const groups=new Map();
 for(const x of rows){const key=x.ean||normalized(productName(x));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}
 if(!groups.size)return '<div class="empty">Bu dönemde ürün bulunamadı.</div>';
 return [...groups.entries()].map(([key,lines])=>{
  const latestBySupplier=new Map();
  for(const x of lines){const old=latestBySupplier.get(x.supplier);if(!old||x.date>old.date)latestBySupplier.set(x.supplier,x)}
  const summaries=[...latestBySupplier.values()].sort((x,y)=>x.supplier-y.supplier);
  return '<div class="card"><div class="row between"><div><h2>'+esc(productName(lines[0]))+'</h2><p>EAN '+esc(lines[0].ean||'tanımsız')+' · '+summaries.length+' tedarikçi</p></div><button class="btn" data-product="'+esc(lines[0].ean)+'">Ürün Kartı / 9 Şube →</button></div>'+
  '<div class="tablewrap"><table><thead><tr><th>Tedarikçi</th><th>Son fatura şubesi</th><th>Son birim fiyat</th></tr></thead><tbody>'+
  summaries.map(x=>'<tr><td><b>'+esc(supplierName(x.supplier))+'</b></td><td>'+esc(BRANCHES[x.branch])+'</td><td>'+euro(x.price)+'</td></tr>').join('')+'</tbody></table></div></div>';
 }).join('');
}
function searchPage(){return '<div class="card"><h2>Ürün Ara</h2><p>Yazdığınız ürünü mevcut faturaların içinde arar.</p><div class="toolbar"><input id="query" placeholder="Örn. Coca Cola 1L..." value="'+esc(term)+'">'+picker()+(isAdmin()?'<button class="btn '+(allTime?'':'light')+'" id="period">Tüm Zamanlar: '+(allTime?'Açık':'Kapalı')+'</button>':'')+'</div></div><div id="searchResults">'+productResults()+'</div>'}
function productSupplierChange(value){productSupplier=value;render()}
function productDetail(){
 const allForProduct=allLines().filter(x=>x.ean===selectedEan);
 const currentMonth=allForProduct.filter(x=>isAdmin()&&allTime||x.date.startsWith(month));
 const availableSuppliers=[...new Set(currentMonth.map(x=>x.supplier))].sort((a,b)=>a-b);
 const p=PRODUCTS.find(p=>p.ean===selectedEan)||currentMonth[0]||{name:'Ürün',ean:selectedEan};
 const selectedSupplierId=productSupplier==='all'?'all':Number(productSupplier);
 const target=currentMonth.filter(x=>selectedSupplierId==='all'||x.supplier===selectedSupplierId);
 const lowBySupplier=new Map();
 for(const s of availableSuppliers){
  const entries=currentMonth.filter(x=>x.supplier===s);
  lowBySupplier.set(s,Math.min(...entries.map(x=>Number(x.price))));
 }
 const relevant=target.filter(x=>isAdmin()||x.branch===branch).sort((a,b)=>b.date.localeCompare(a.date));
 const min=target.length?Math.min(...target.map(x=>Number(x.price))):null;
 const max=target.length?Math.max(...target.map(x=>Number(x.price))):null;
 const supplierCards=selectedSupplierId==='all'?availableSuppliers:[selectedSupplierId];
 const branchCards=supplierCards.map(s=>{
  const supplierLines=currentMonth.filter(x=>x.supplier===s);
  const ref=lowBySupplier.get(s);
  const cards=BRANCHES.map((name,b)=>{
   const lines=supplierLines.filter(x=>x.branch===b);
   if(!lines.length)return '<div class="branch-price"><span class="mini">'+esc(name)+'</span><span class="price-no">Fatura yok</span></div>';
   const latest=lines.slice().sort((x,y)=>y.date.localeCompare(x.date))[0];
   const delta=Math.round((latest.price-ref)*100)/100,flag=delta>.025;
   return '<div class="branch-price '+(flag?'different':'base')+'"><span class="mini"><b>'+esc(name)+'</b></span>'+
    '<span class="'+(flag?'price-diff':'price-ref')+'">'+euro(latest.price)+'</span>'+
    (flag?'<span class="diff-pill">FARK +'+euro(delta)+' / adet</span>':'<span class="mini" style="color:#167b5a">Referansla aynı</span>')+
    (isAdmin()||latest.branch===branch?'<button class="btn light" data-invoice="'+esc(latest.invoice)+'">Faturaya Git →</button>':'')+'</div>';
  }).join('');
  return '<div style="margin:18px 0"><div class="row between"><h3>'+esc(supplierName(s))+'</h3><span class="tag">En düşük '+euro(ref)+'</span></div><div class="matrix-grid">'+cards+'</div></div>';
 }).join('');
 const options='<option value="all" '+(productSupplier==='all'?'selected':'')+'>Tüm Tedarikçiler</option>'+
  availableSuppliers.map(s=>'<option value="'+s+'" '+(String(productSupplier)===String(s)?'selected':'')+'>'+esc(supplierName(s))+'</option>').join('');
 const supplierRows=availableSuppliers.map(s=>{
  const lines=currentMonth.filter(x=>x.supplier===s);
  const lo=Math.min(...lines.map(x=>x.price)),hi=Math.max(...lines.map(x=>x.price));
  return '<tr><td><b>'+esc(supplierName(s))+'</b></td><td>'+new Set(lines.map(x=>x.branch)).size+' şube</td><td><span class="price-ref">'+euro(lo)+'</span></td><td>'+
  (hi-lo>.025?'<span class="price-diff">'+euro(hi)+'</span>':'<span class="price-ref">'+euro(hi)+'</span>')+
  '</td><td>'+(hi-lo>.025?'<span class="diff-pill">FARK +'+euro(hi-lo)+'</span>':'Aynı fiyat')+'</td></tr>';
 }).join('');
 return '<button class="back" data-back="product">← Geri Dön</button>'+
 '<div class="card"><h2>Ürün Kartı: '+esc(productName(p))+'</h2><p>EAN: '+esc(selectedEan)+' · '+(allTime&&isAdmin()?'Tüm zamanlar':month)+'</p>'+
 '<div class="notice">🟩 Yeşil: aynı tedarikçinin en düşük fiyatıyla eşit. 🟥 Kırmızı: aynı tedarikçide farklı birim fiyat. Fark, onaylanmış fatura hatası değildir.</div>'+
 '<div class="compare-tools"><label class="field" style="margin:0;min-width:220px">Tedarikçi<select id="productSupplier">'+options+'</select></label>'+
 (isAdmin()?'<span class="tag">Admin: 9 şubeyi karşılaştırır</span>':'<span class="tag">Diğer şubelerde fiyat görünür; faturalar gizli</span>')+'</div>'+
 '<h3>9 Şubede Fiyatlar</h3>'+branchCards+'</div>'+
 '<div class="card"><h3>Tedarikçilere Göre Fiyat Özeti</h3><div class="tablewrap"><table><thead><tr><th>Tedarikçi</th><th>Şube</th><th>En düşük</th><th>En yüksek</th><th>Fark</th></tr></thead><tbody>'+supplierRows+'</tbody></table></div></div>'+
 '<div class="card"><h3>'+(isAdmin()?'Son Faturalardaki Bu Ürün':'Kendi Şubemin Son Faturaları')+'</h3>'+
 (relevant.length?'<div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Tedarikçi</th><th>Şube</th><th>Fiyat</th><th>Adet</th><th>Fatura</th></tr></thead><tbody>'+
 relevant.slice(0,50).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(supplierName(x.supplier))+'</td><td>'+esc(BRANCHES[x.branch])+'</td><td><b>'+euro(x.price)+'</b></td><td>'+x.qty+'</td><td><button class="btn light" data-invoice="'+esc(x.invoice)+'">Aç →</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Bu dönem için fatura bulunamadı.</div>')+
 '</div>';
}
function errorPage(){
 const list=issues();
 return '<div class="card"><h2>Hatalar / Birim Fiyat Farkları</h2>'+
 '<div class="alert">Burada fatura toplamı değil, <b>aynı tedarikçinin aynı ürün için farklı şubelere kestiği BİRİM FİYAT FARKI</b> gösterilir. Örneğin €4,26 → €4,65 ise FARK +€0,39.</div>'+
 (!list.length?'<div class="empty">Bu ay karşılaştırılacak fiyat farkı bulunmadı.</div>':
 list.map(x=>{
  const delta=Math.round((x.high-x.low)*100)/100,percent=x.low?Math.round(delta/x.low*1000)/10:0;
  return '<div class="card"><div class="row between"><div><h3>'+esc(x.name)+'</h3><p>'+esc(supplierName(x.supplier))+' · '+esc(x.ean)+'</p></div>'+
  '<span class="price-diff">FARK +'+euro(delta)+' / adet</span></div>'+
  '<p><span class="price-ref">'+euro(x.low)+'</span> → <span class="price-diff">'+euro(x.high)+'</span> · %'+percent.toFixed(1)+' farklı</p>'+
  '<button class="btn red" data-error="'+esc(x.supplier+'|'+x.ean)+'">Hangi Şubelerde? →</button></div>';
 }).join(''))+'</div>';
}
function errorDetail(key){
 const [sid,ean]=key.split('|'),x=issues().find(x=>x.supplier===+sid&&x.ean===ean);
 if(!x)return '<div class="empty">Fiyat farkı bulunamadı.</div>';
 const delta=x.high-x.low,percent=x.low?Math.round(delta/x.low*1000)/10:0;
 return '<button class="back" data-back="errors">← Hatalara Dön</button><div class="card"><h2>'+esc(x.name)+'</h2>'+
 '<p>'+esc(supplierName(x.supplier))+' · '+esc(ean)+'</p><div class="alert">Birim fiyat farkı: <b>+'+euro(delta)+'</b> (%'+percent.toFixed(1)+') · Referans '+euro(x.low)+' → Yüksek fiyat '+euro(x.high)+'</div>'+
 '<div class="tablewrap"><table><thead><tr><th>Fatura</th><th>Şube</th><th>Fiyat</th><th>Birim fark</th><th>İşlem</th></tr></thead><tbody>'+
 x.rows.map(r=>'<tr><td>'+esc(r.invoice)+'</td><td>'+esc(BRANCHES[r.branch])+'</td><td><span class="'+(r.price-x.low>.025?'price-diff':'price-ref')+'">'+euro(r.price)+'</span></td><td>'+(r.price-x.low>.025?'<b class="diff-pill">+'+euro(r.price-x.low)+'</b>':'—')+'</td><td><button class="btn light" data-invoice="'+esc(r.invoice)+'">Aç →</button></td></tr>').join('')+'</tbody></table></div>'+
 '<p class="muted">'+(isAdmin()?'Admin tüm şubelerin ilgili faturalarını görüntüleyebilir.':'Yalnızca kendi şubenizin faturaları açılabilir; diğer fiyatlar referans içindir.')+'</p>'+
 '<button class="btn light" data-product="'+esc(ean)+'">Ürün Kartı →</button></div>';
}
function supplierList(){return '<div class="card"><h2>Tedarikçiler</h2><p>Firma kartı, sorumlu kişi, adres ve şirket e-posta bilgilerini düzenleyin.</p><div class="supplierList">'+SUPPLIERS.map((name,i)=>'<button class="supplierCard" data-supplier="'+(i+1)+'"><b>'+esc(supplierName(i+1))+'</b><span class="mini">'+invoices().filter(x=>x.supplier===i+1).length+' fatura</span><span class="tag">Firma kartını aç →</span></button>').join('')+'</div></div>'}
function supplierDetail(){const m=meta(selectedSupplier);return '<button class="back" data-back="suppliers">← Tedarikçiler</button><div class="card"><h2>Firma Kartı</h2><p>'+esc(m.name)+'</p>'+[['name','Tedarikçi adı'],['address','Fiziksel adres'],['contact','Sorumlu kişi'],['companyEmail','Şirket e-postası'],['phone','Telefon']].map(([k,t])=>'<label class="field">'+t+'<input id="sup-'+k+'" value="'+esc(m[k]||'')+'" placeholder="'+esc(t)+'"></label>').join('')+'<button class="btn" id="saveSupplier">Firma Bilgilerini Kaydet</button></div>'}
function usersPage(){return '<div class="card"><h2>Demo Kullanıcılar</h2><p>9 şube sorumlusu, 1 admin, 1 sistem admini. Bunlar henüz gerçek hesap değildir.</p>'+BRANCHES.map((x,i)=>'<div class="lightLine"><b>Şube '+(i+1)+'</b> · '+esc(x)+'</div>').join('')+'<div class="lightLine"><b>Firma Admini</b> · Tüm şubeler</div><div class="lightLine"><b>Sistem Admini</b> · Sistem yönetimi</div></div>'}

function mindeeDemoSettings(){
 if(role!=='system')return '<div class="card">Bu bölüm yalnızca Sistem Admini içindir.</div>';
 const url='https://invoice-control-api.onrender.com';
 return '<div class="card"><h2>Mindee API · Sistem Admini</h2>'+
 '<p><b>API sunucusu:</b> '+esc(url)+' · Render / NT2app.</p>'+
 '<div class="notice" style="border-color:#f1c6cb;background:#fff2f4;color:#a23447"><b>🔴 Mindee henüz doğrulanmadı.</b> Önce Sistem Admini hesabıyla giriş yapıp yeni Mindee API anahtarını kaydetmelisin. Anahtarın kendisini bu sayfaya yazma.</div>'+
 '<p>Mindee anahtarı yalnızca güvenli sunucudaki yönetim ekranına girilir; veritabanında şifreli saklanır ve gerçek Mindee V2 API ile doğrulanır.</p>'+
 '<a class="btn" style="display:inline-block;text-decoration:none;margin:14px 0" href="'+url+'/admin/mindee" target="_blank" rel="noopener noreferrer">Mindee API Ayarlarını Aç ↗</a>'+
 '<p class="muted">İlk girişte Render → invoice-control-api → Environment bölümündeki INVOICE_SYSTEM_PASSWORD değeri gerekir. Kullanıcı adresi: mfatihdumluu@gmail.com. Şifreni veya Mindee anahtarını sohbete yazma.</p>'+
 '<p class="muted">Mindee anahtar doğrulaması başarılı olursa güvenli yönetim ekranında yeşil, başarısızsa kırmızı gösterilir. Bu aşamada otomatik belge çıkarma henüz bağlanmadı.</p></div>';
}
function render(){const titles={home:'Ne yapmak istiyorsunuz?',invoices:'Faturalarım',invoiceDetail:'Fatura Detayı',search:'Ürün Ara',productDetail:'Ürün Kartı',errors:'Hatalar',errorDetail:'Fiyat Farkı Detayı',suppliers:'Tedarikçiler',supplierDetail:'Tedarikçi Kartı',users:'Kullanıcılar',mindee:'Mindee API Bağlantısı'}; $('heading').textContent=titles[mode]||titles.home;$('subheading').textContent=mode==='home'?'Bir işlem seçmeniz yeterli.':'Her ekranda yalnızca o işlem için gereken bilgiler gösterilir.'; $('actions').innerHTML=actionButtons()+(isAdmin()?'<button class="action" data-nav="suppliers"><span class="symbol">▦</span><strong>Tedarikçiler</strong><small>Firma bilgileri</small></button><button class="action" data-nav="users"><span class="symbol">♙</span><strong>Kullanıcılar</strong><small>11 kullanıcı</small></button>':'')+(role==='system'?'<button class="action" data-nav="mindee"><span class="symbol">🔌</span><strong>Mindee API</strong><small>Sistem bağlantısı</small></button>':'');const screens={home:()=>'<div class="card"><h2>Başlamak için yukarıdan bir işlem seçin.</h2><p>Önce faturanızı yükleyebilir, daha sonra ürün veya fatura araması yapabilirsiniz.</p><div class="notice">İlk kullanım: <b>Fatura Yükle → Tedarikçi Seç → Fatura Numarası → Dosya Seç</b>. Karmaşık ayar yok.</div></div>',invoices:invoiceList,invoiceDetail,search:searchPage,productDetail,errors:errorPage,errorDetail:()=>errorDetail(draft),suppliers:supplierList,supplierDetail,users:usersPage,mindee:mindeeDemoSettings};$('view').innerHTML=(screens[mode]||screens.home)();bind()}
function bind(){const op=$('mindeeOpen');if(op)op.onclick=openMindeeSettings;document.querySelectorAll('[data-remove-invoice]').forEach(e=>e.onclick=()=>removeUploadedInvoice(e.dataset.removeInvoice));document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{if(e.dataset.nav==='upload')window.location.href='./kolay-yukle.html';else setMode(e.dataset.nav)});document.querySelectorAll('[data-invoice]').forEach(e=>e.onclick=()=>chooseInvoice(e.dataset.invoice));document.querySelectorAll('[data-product]').forEach(e=>e.onclick=()=>chooseProduct(e.dataset.product,e.dataset.source||''));document.querySelectorAll('[data-error]').forEach(e=>e.onclick=()=>{draft=e.dataset.error;setMode('errorDetail')});document.querySelectorAll('[data-supplier]').forEach(e=>e.onclick=()=>{selectedSupplier=+e.dataset.supplier;setMode('supplierDetail')});document.querySelectorAll('[data-back]').forEach(e=>e.onclick=()=>{const x=e.dataset.back;if(x==='product')backProduct();else if(x==='invoice')backInvoice();else setMode(x)});const q=$('query');if(q)q.oninput=()=>{term=q.value;const index=q.selectionStart;render();let n=$('query');n?.focus();if(n)try{n.setSelectionRange(index,index)}catch{}};const ino=$('invoiceNumberSearch');if(ino)ino.oninput=()=>{invoiceNumberQuery=ino.value;const position=ino.selectionStart;render();const next=$('invoiceNumberSearch');next?.focus();if(next)try{next.setSelectionRange(position,position)}catch{}};const m=$('month');if(m)m.onchange=()=>{month=m.value;render()};const t=$('period');if(t)t.onclick=()=>{allTime=!allTime;render()};const ps=$('productSupplier');if(ps)ps.onchange=()=>productSupplierChange(ps.value);const save=$('saveSupplier');if(save)save.onclick=()=>{let data={};try{data=JSON.parse(localStorage.getItem(META)||'{}')}catch{}let d={};for(const k of ['name','address','contact','companyEmail','phone'])d[k]=$('sup-'+k).value.trim();if(!d.name){alert('Tedarikçi adı gerekli.');return}data[selectedSupplier]=d;localStorage.setItem(META,JSON.stringify(data));render()}}
$('who').onchange=e=>{role=['admin','system'].includes(e.target.value)?e.target.value:'branch';branch=role==='branch'?+e.target.value:0;allTime=false;setMode('home')};render();
</script></body></html>
