<script>

const products=[{ean:'8711234000001',name:'Beyaz Peynir 800 g',unit:'stuk',base:4.20},{ean:'8711234000002',name:'Yoğurt 1 kg',unit:'stuk',base:1.39},{ean:'8711234000003',name:'Basmati Pirinç 5 kg',unit:'zak',base:7.90},{ean:'8711234000004',name:'Ayçiçek Yağı 1 L',unit:'fles',base:1.85},{ean:'8711234000005',name:'Nohut 1 kg',unit:'zak',base:1.60},{ean:'8711234000006',name:'Domates Salçası 800 g',unit:'blik',base:2.20},{ean:'8711234000007',name:'Feta 400 g',unit:'pak',base:2.85},{ean:'8711234000008',name:'Kırmızı Mercimek 1 kg',unit:'zak',base:1.75}];
let invoices=[];for(const month of ['2026-10','2026-11'])for(let s=1;s<=6;s++)for(let b=0;b<9;b++)for(let k=0;k<2;k++){let items=[];for(let p=0;p<8;p++){const count=8+(s+b+p+k)%13,qty=count*5;let price=+(products[p].base*(month==='2026-11'?1.015:1)).toFixed(2);if(month==='2026-11'&&s===1&&p===0&&b===1)price=4.65;if(month==='2026-11'&&s===1&&p===0&&b===6)price=4.45;if(month==='2026-11'&&s===2&&p===3&&b===3)price=2.23;if(month==='2026-11'&&s===4&&p===2&&b===5)price=8.65;items.push({product:p,ean:products[p].ean,qty,price});}invoices.push({id:'INV-'+month.slice(2).replace('-','')+'-'+s+String(b+1).padStart(2,'0')+'-'+(k+1),month,supplier:s,branch:b,date:month+'-'+String(3+k*12+b%6).padStart(2,'0'),items,source:'demo',status:'Verwerkt'});}

/* Explicit fictional fixture for cross-supplier product search. */
products.push({ean:'5449000000996',name:'Coca Cola 1L',unit:'şişe',base:1.16});
const colaIndex=products.length-1;
const cocaSampleA=invoices.find(i=>i.month==='2026-11'&&i.supplier===1&&i.branch===0&&i.id.endsWith('-1'));
const cocaSampleB=invoices.find(i=>i.month==='2026-11'&&i.supplier===2&&i.branch===2&&i.id.endsWith('-1'));
if(cocaSampleA)cocaSampleA.items.push({product:colaIndex,ean:products[colaIndex].ean,qty:100,price:1.16});
if(cocaSampleB)cocaSampleB.items.push({product:colaIndex,ean:products[colaIndex].ean,qty:120,price:1.37});

let selectedProductEan='',productReturnPage='invoices',productReturnInvoice='',invoiceReturnPage='invoices',productTimeScope='month',invoiceSearchAllTime=false;
let page='finder',supplierId=1,supplierTab='invoices',search='',role='system',month='2026-11',branch=0,addedSuppliers=[],addedInvoices=[],savedAudit=[];
const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s,t='')=>'<span class="badge '+t+'">'+esc(s)+'</span>';
const LOCAL_TEST_KEY='invoice-control-demo-invoices-v1';
function getLocalTestInvoices(){try{const data=JSON.parse(localStorage.getItem(LOCAL_TEST_KEY)||'[]');if(!Array.isArray(data))return[];return data.filter(i=>i&&typeof i.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(i.date)&&Number.isInteger(i.supplier)&&Number.isInteger(i.branch)&&Array.isArray(i.items)&&i.items.every(x=>Number.isInteger(x.product)&&x.product>=0&&x.product<products.length&&Number.isFinite(x.price)&&Number.isFinite(x.qty)))}catch{return[]}}
const allInvoices=()=>invoices.concat(getLocalTestInvoices());
const invoiceList=()=>allInvoices().filter(i=>i.month===month&&(role!=='branch'||i.branch===branch));
const supplierName=id=>getJsonData('invoice-control-supplier-metadata-v2',{})[id]?.name||suppliers.find(s=>s.id===id)?.name||'Bilinmeyen';
const visible=invs=>invs.filter(i=>role!=='branch'||i.branch===branch);
function invoiceTotal(i){return i.items.reduce((v,x)=>v+x.qty*x.price,0)}
function allLines(data){return data.flatMap(i=>i.items.map(line=>({...line,supplier:i.supplier,branch:i.branch,month:i.month,invoice:i.id,date:i.date})))}
function compare(){
const source=allLines(allInvoices().filter(x=>x.month===month)),grp=new Map();
for(let line of source){const key=line.supplier+':'+line.ean;const arr=grp.get(key)||[];arr.push(line);grp.set(key,arr)}
const result=[];for(const lines of grp.values()){
 const byBranch=new Map();for(const x of lines){let min=byBranch.get(x.branch);if(!min||x.price<min.price)byBranch.set(x.branch,x)}
 const items=[...byBranch.values()];if(items.length<2)continue;
 const min=Math.min(...items.map(x=>x.price)),max=Math.max(...items.map(x=>x.price));
 if(max-min<=0.02)continue;
 result.push({supplier:items[0].supplier,ean:items[0].ean,product:products.findIndex(x=>x.ean===items[0].ean),items,min,max,spread:min>0?100*(max/min-1):null,impact:lines.reduce((v,x)=>v+Math.max(0,x.price-min)*x.qty,0),lines});
}
return result.sort((a,b)=>b.impact-a.impact)
}

let discrepancySelection=null;

function branchCanRead(b){return role!=='branch'||Number(b)===branch}
function discrepancyAction(supplier,ean){return '<button class="btn light" onclick="showDiscrepancy('+Number(supplier)+',\''+esc(ean)+'\')">Farkı İncele →</button>'}
function showDiscrepancy(supplier,ean){discrepancySelection={supplier:Number(supplier),ean:String(ean)};page='discrepancy';render();window.scrollTo(0,0)}
function discrepancyPage(){
 const select=discrepancySelection;if(!select)return '<div class="card">Önce fiyat farkı olan bir ürün seçin.</div>';
 const lines=allLines(allInvoices().filter(i=>i.month===month&&i.supplier===select.supplier)).filter(x=>x.ean===select.ean);
 const product=products.find(x=>x.ean===select.ean),base=lines.length?Math.min(...lines.map(x=>x.price)):null;
 if(base===null)return head('Fiyat Farkı Detayı','Seçilen dönem için ürün bulunamadı');
 const branchLines=lines.filter(x=>branchCanRead(x.branch));

function normalizeProductName(text){
 return String(text||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/coca[\s-]*cola/g,'cocacola').replace(/\b(liter|litre|lt)\b/g,'l')
 .replace(/(\d)\s+(l|ml|kg|g)\b/g,'$1$2')
 .replace(/[^a-z0-9]+/g,' ').trim()
}
function productIndexForLine(line){

}

 return{ean,p,prices,low,high,own:prices[own],spread:low>0?(high/low-1)*100:0,impact:baseLines.filter(x=>x.ean===ean).reduce((v,x)=>v+Math.max(0,x.price-low)*x.qty,0)}
