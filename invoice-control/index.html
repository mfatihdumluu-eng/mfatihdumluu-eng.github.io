</style></head><body>
<div class="layout"><aside class="side" id="sidebar"><div class="logo"><div class="mark">✓</div>Invoice Control</div><div class="navhead">ÇALIŞMA ALANI</div><nav id="nav"></nav><div class="navhead">YÖNETİM</div><nav id="adminnav"></nav><div class="sidefoot"><div class="row"><div class="avatar">SA</div><div><strong class="tiny" style="color:#344256">Demo yönetici</strong><div class="tiny">Örnek test ortamı</div></div></div></div></aside><div class="main"><header class="top"><div class="row"><button class="btn white mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><span class="topname" id="breadcrumb">Dashboard</span></div><div class="topright"><select class="select" id="role"><option value="system">Sistem Yöneticisi</option><option value="admin">Admin</option><option value="branch">Şube 1</option></select><select class="select" id="month"><option value="2026-11">Kas 2026</option><option value="2026-10">Eki 2026</option></select><span class="chip">● DEMO</span></div></header><main class="work" id="root"></main></div></div>
<script>
const branches=['Rotterdam Centrum','Rotterdam Noord','Rotterdam Zuid','Schiedam','Delft','Den Haag','Utrecht','Breda','Amsterdam'];
const suppliers=[{id:1,name:'Holland Dairy BV',initials:'HD',category:'Süt Ürünleri ve Peynir',email:'demo@holland-dairy.example'},{id:2,name:'Van Dijk Foodservice',initials:'VD',category:'Horeca & foodservice',email:'demo@van-dijk.example'},{id:3,name:'Freshline Groothandel',initials:'FG',category:'Sebze ve Meyve',email:'demo@freshline.example'},{id:4,name:'Euro Foods BV',initials:'EF',category:'Food & non-food',email:'demo@eurofoods.example'},{id:5,name:'Delta Distributie',initials:'DD',category:'Dondurulmuş ve Paketli',email:'demo@delta.example'},{id:6,name:'Noord Trade',initials:'NT',category:'İthalat ve Gıda',email:'demo@noordtrade.example'}];
const products=[{ean:'8711234000001',name:'Beyaz Peynir 800 g',unit:'stuk',base:4.20},{ean:'8711234000002',name:'Yoğurt 1 kg',unit:'stuk',base:1.39},{ean:'8711234000003',name:'Basmati Pirinç 5 kg',unit:'zak',base:7.90},{ean:'8711234000004',name:'Ayçiçek Yağı 1 L',unit:'fles',base:1.85},{ean:'8711234000005',name:'Nohut 1 kg',unit:'zak',base:1.60},{ean:'8711234000006',name:'Domates Salçası 800 g',unit:'blik',base:2.20},{ean:'8711234000007',name:'Feta 400 g',unit:'pak',base:2.85},{ean:'8711234000008',name:'Kırmızı Mercimek 1 kg',unit:'zak',base:1.75}];
let invoices=[];for(const month of ['2026-10','2026-11'])for(let s=1;s<=6;s++)for(let b=0;b<9;b++)for(let k=0;k<2;k++){let items=[];for(let p=0;p<8;p++){const count=8+(s+b+p+k)%13,qty=count*5;let price=+(products[p].base*(month==='2026-11'?1.015:1)).toFixed(2);if(month==='2026-11'&&s===1&&p===0&&b===1)price=4.65;if(month==='2026-11'&&s===1&&p===0&&b===6)price=4.45;if(month==='2026-11'&&s===2&&p===3&&b===3)price=2.23;if(month==='2026-11'&&s===4&&p===2&&b===5)price=8.65;items.push({product:p,ean:products[p].ean,qty,price});}invoices.push({id:'INV-'+month.slice(2).replace('-','')+'-'+s+String(b+1).padStart(2,'0')+'-'+(k+1),month,supplier:s,branch:b,date:month+'-'+String(3+k*12+b%6).padStart(2,'0'),items,source:'demo',status:'Verwerkt'});}
let page='finder',supplierId=1,supplierTab='invoices',search='',role='system',month='2026-11',branch=0,addedSuppliers=[],addedInvoices=[],savedAudit=[];
const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s,t='')=>'<span class="badge '+t+'">'+esc(s)+'</span>';
const LOCAL_TEST_KEY='invoice-control-demo-invoices-v1';
function getLocalTestInvoices(){try{const data=JSON.parse(localStorage.getItem(LOCAL_TEST_KEY)||'[]');if(!Array.isArray(data))return[];return data.filter(i=>i&&typeof i.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(i.date)&&Number.isInteger(i.supplier)&&Number.isInteger(i.branch)&&Array.isArray(i.items)&&i.items.every(x=>Number.isInteger(x.product)&&x.product>=0&&x.product<products.length&&Number.isFinite(x.price)&&Number.isFinite(x.qty)))}catch{return[]}}
const allInvoices=()=>invoices.concat(getLocalTestInvoices());
const invoiceList=()=>allInvoices().filter(i=>i.month===month&&(role!=='branch'||i.branch===branch));
const supplierName=id=>suppliers.find(s=>s.id===id)?.name||'Onbekend';
const visible=invs=>invs.filter(i=>role!=='branch'||i.branch===branch);
function invoiceTotal(i){return i.items.reduce((v,x)=>v+x.qty*x.price,0)}
function allLines(data){return data.flatMap(i=>i.items.map(line=>({...line,supplier:i.supplier,branch:i.branch,month:i.month,invoice:i.id,date:i.date})))}
function compare(){const source=allLines(allInvoices().filter(x=>x.month===month)),grp=new Map();for(let line of source){const key=line.supplier+':'+line.ean;const arr=grp.get(key)||[];arr.push(line);grp.set(key,arr)}let out=[];for(const [key,items] of grp){const unique=new Map();for(let x of items){let prior=unique.get(x.branch);if(!prior||x.price<prior.price)unique.set(x.branch,x)}const values=[...unique.values()];if(values.length<2)continue;let min=Math.min(...values.map(x=>x.price)),max=Math.max(...values.map(x=>x.price));if(max-min<=.02)continue;out.push({supplier:values[0].supplier,product:products.findIndex(x=>x.ean===values[0].ean),ean:values[0].ean,items:values,min,max,spread:((max/min-1)*100),impact:values.reduce((sum,x)=>sum+Math.max(0,x.price-min)*x.qty,0)});}return out.sort((a,b)=>b.impact-a.impact)}
function nav(){const items=[['dashboard','◫','Genel Bakış'],['finder','⌕','Akıllı Fatura Arama'],['suppliers','▦','Tedarikçiler'],['invoices','▤','Faturalar'],['products','⌕','Ürün Ara'],['compare','⇄','Şubeleri Karşılaştır'],['alerts','⚠','Fiyat Farkları'],['reports','▥','Raporlar'],['upload','⇧','Fatura Yükle']];const admins=[['users','♙','Demo Kullanıcılar'],['settings','⚙','Ayarlar']];document.getElementById('nav').innerHTML=items.map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-route="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join('');document.getElementById('adminnav').innerHTML=admins.filter(x=>role!=='branch').map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-route="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join('');document.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>go(el.dataset.route))}
function go(p){page=p;search='';document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function head(name,sub,right=''){return '<div class="head"><div><div class="eyebrow">INVOICE CONTROL / '+esc(name.toUpperCase())+'</div><h1>'+esc(name)+'</h1><p>'+sub+'</p></div>'+right+'</div>'}
function supplierCard(s){let ii=invoiceList().filter(i=>i.supplier===s.id),total=ii.reduce((sum,i)=>sum+invoiceTotal(i),0),issues=compare().filter(x=>x.supplier===s.id).length;return '<button class="card supplier-card" onclick="showSupplier('+s.id+')"><div class="row between"><div class="supplier-icon">'+esc(s.initials)+'</div>'+badge(issues+' afwijkingen',issues?'red':'green')+'</div><div class="cardtitle" style="margin-top:18px">'+esc(s.name)+'</div><p>'+esc(s.category)+'</p><div class="row between" style="margin-top:15px"><span class="tiny">'+ii.length+' facturen · 9 vestigingen</span><strong style="font-size:12px">'+euro(total)+'</strong></div></button>'}
function dashboards(){let ii=invoiceList(),all=compare(),issues=all.filter(x=>role!=='branch'||x.items.some(t=>t.branch===branch)),value=ii.reduce((v,i)=>v+invoiceTotal(i),0),total=issues.reduce((v,x)=>v+(role==='branch'?x.items.filter(t=>t.branch===branch).reduce((z,t)=>z+Math.max(0,t.price-x.min)*t.qty,0):x.impact),0);
return head('Dashboard','Faturalar, tedarikçiler ve fiyat farklılıklarının genel özeti','<button class="btn" onclick="go(\'upload\')">＋ Fatura Yükle</button>')+'<div class="grid4">'+[['Toplam Fatura',ii.length,'purple'],['Aktif Tedarikçi',suppliers.length,'purple'],['İncelenecek Ürün',issues.length,'red'],['Olası Fiyat Farkı',euro(total),'orange']].map(x=>'<div class="card stat"><div class="key">'+x[0]+'</div><div class="number '+x[2]+'">'+x[1]+'</div><div class="tiny">Seçili ay</div></div>').join('')+'</div><div class="grid2"><div class="card"><div class="panel-head"><h2>Leveranciers</h2><button class="btn light" onclick="go(\'suppliers\')">Alle leveranciers →</button></div><div class="stack">'+suppliers.slice(0,5).map(s=>{let n=ii.filter(i=>i.supplier===s.id).length;return '<div class="row between" style="padding:5px 0"><div class="row"><div class="supplier-icon" style="width:34px;height:34px;font-size:12px">'+s.initials+'</div><div><strong style="font-size:12px">'+esc(s.name)+'</strong><div class="tiny">'+n+' facturen</div></div></div><a href="#" onclick="showSupplier('+s.id+');return false" class="link">İncele →</a></div>'}).join('')+'</div></div><div class="card"><div class="panel-head"><h2>Dikkat Çeken Fiyat Farkları</h2><button class="btn light" onclick="go(\'alerts\')">Tümünü Gör →</button></div><div class="stack">'+issues.slice(0,5).map(x=>'<div style="border-bottom:1px solid #eff1f6;padding:7px 0"><div class="row between"><b style="font-size:12px">'+esc(products[x.product]?.name||x.ean)+'</b>'+badge('+'+x.spread.toFixed(1)+'%','red')+'</div><p>'+esc(supplierName(x.supplier))+' · '+euro(x.min)+' – '+euro(x.max)+'</p></div>').join('')+'</div><div class="note" style="margin-top:14px">Farklar uyarıdır; sözleşme, miktar indirimi, kampanya ve ambalaj birimlerini inceleyin.</div></div></div><div class="card" style="margin-top:16px"><div class="panel-head"><h2>Son Faturalar</h2><button class="btn light" onclick="go(\'invoices\')">Tümünü Gör →</button></div>'+invoiceTable(ii.slice(-6).reverse())+'</div>'}
function supplierPage(){let ss=suppliers.filter(x=>(x.name+' '+x.category).toLowerCase().includes(search.toLowerCase()));return head('Leveranciers','Tedarikçiyi seçerek farklı şubelere kestiği faturaları, ürünleri ve fiyatları inceleyin',role==='branch'?'':'<button class="btn" onclick="addSupplier()">＋ Tedarikçi Ekle</button>')+'<div class="filters"><input class="input" placeholder="⌕ Tedarikçi ara..." value="'+esc(search)+'" oninput="search=this.value;render()">'+badge(suppliers.length+' leveranciers','purple')+'</div><div class="supplier-grid">'+ss.map(supplierCard).join('')+'</div>'}

 let supplierSelect='<select id="finderSupplier" onchange="finderFieldSet(\'supplier\',this.value)">'+suppliers.map(v=>'<option value="'+v.id+'" '+(v.id===finderSupplier?'selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select>';
 let first=finderMode==='branch'?'<div class="stepfield"><label>1. ŞUBE SEÇ</label>'+branchSelect+'</div>':'<div class="stepfield"><label>1. TEDARİKÇİ SEÇ</label>'+supplierSelect+'</div>';
 let second=finderMode==='branch'?'<div class="stepfield"><label>2. TEDARİKÇİ SEÇ</label>'+supplierSelect+'</div>':'<div class="stepfield"><label>2. ŞUBE SEÇ</label>'+branchSelect+'</div>';
 let pick='<option value="all">Tüm ürünler</option>'+products.map(p=>'<option value="'+p.ean+'" '+(finderProduct===p.ean?'selected':'')+'>'+esc(p.name)+' · '+p.ean+'</option>').join('');
 let detail='';if(finderSelectedInvoice){let inv=allInvoices().find(x=>x.id===finderSelectedInvoice);if(inv){detail='<div class="card" id="finder-details"><div class="panel-head"><h2>Fatura detayları: '+esc(inv.id)+'</h2><button class="btn light" onclick="finderSelectedInvoice=null;render()">Kapat ✕</button></div><div class="tiny">Şube: '+esc(branches[inv.branch])+' · Tedarikçi: '+esc(supplierName(inv.supplier))+' · '+inv.date+'</div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>EAN</th><th>Ürün</th><th>Adet</th><th>Fiyat</th><th>Toplam</th></tr></thead><tbody>'+inv.items.map(x=>'<tr><td>'+x.ean+'</td><td>'+esc(products[x.product]?.name||'Ürün')+'</td><td>'+x.qty+'</td><td>'+euro(x.price)+'</td><td>'+euro(x.qty*x.price)+'</td></tr>').join('')+'</tbody></table></div></div>'}}
 return '<div class="finder-hero"><div class="eyebrow">9 ŞUBE · TEK TEDARİKÇİ · AYLIK KONTROL</div><h1>Akıllı Fatura ve Ürün Arama</h1><p>Şubeye göre veya tedarikçiye göre başlayın. Faturaları bulun, ürün fiyatlarını karşılaştırın.</p><div class="mode-tabs"><button class="mode-btn '+(finderMode==='branch'?'on':'')+'" onclick="finderModeSet(\'branch\')">▦ Şube Bazlı Ara</button><button class="mode-btn '+(finderMode==='supplier'?'on':'')+'" onclick="finderModeSet(\'supplier\')">▤ Tedarikçi Bazlı Ara</button></div></div><div class="card"><h2>Arama ve filtreleme</h2><div class="stepgrid">'+first+'<div class="step-arrow">→</div>'+second+'</div><div class="stepfield" style="margin:8px 0 17px"><label>3. ÜRÜN SEÇ (İSTEĞE BAĞLI)</label><select id="finderProduct" onchange="finderSwitchProduct(this.value)">'+pick+'</select></div><div class="finder-controls"><input class="input" id="finderQuery" placeholder="Ürün adı, EAN veya fatura no..." value="'+esc(finderQuery)+'" oninput="finderQuerySet(this.value)"><button class="btn" onclick="finderCross=false;render()">⌕ Faturaları Listele</button><button class="btn light" onclick="finderToggleCross()">⇄ '+(finderCross?'Karşılaştırmayı Gizle':'Diğer Şubelerde Kontrol Et')+'</button></div><div class="note" style="margin-top:15px">Seçim: <b>'+esc(branches[finderBranch])+'</b> / <b>'+esc(s.name)+'</b> · '+(month==='2026-11'?'Kasım 2026':'Ekim 2026')+'. Tüm fiyatlar örnek verilerdir.</div></div><div id="finder-results" class="finder-results">'+finderResultContent()+'</div>'+(finderCross?finderCompareContent():'')+detail;
}

function render(){if(role==='branch'&&['users','settings'].includes(page))page='dashboard';nav();document.getElementById('breadcrumb').textContent=({finder:'Akıllı Fatura Arama',supplierDetail:'Tedarikçi Detayı',invoiceDetail:'Fatura Detayı',dashboard:'Genel Bakış',suppliers:'Tedarikçiler',invoices:'Faturalar',products:'Ürün Ara',compare:'Şubeleri Karşılaştır',alerts:'Fiyat Farkları',reports:'Raporlar',users:'Demo Kullanıcılar',upload:'Fatura Yükle',settings:'Ayarlar'})[page]||'Genel Bakış';const map={finder:finderPage,dashboard:dashboards,suppliers:supplierPage,supplierDetail,invoices:invoicePage,invoiceDetail,products:productsPage,compare:comparePage,alerts:alertsPage,reports,users,upload:uploadPage,settings};document.getElementById('root').innerHTML=(map[page]||finderPage)()+'<div class="footer">Invoice Control · Türkçe demo · 9 şube · Yalnızca örnek veriler · Lovable kullanılmadı</div>'}
document.getElementById('role').onchange=e=>{role=e.target.value;page='finder';render()};document.getElementById('month').onchange=e=>{month=e.target.value;render()};render();
</script></body></html>
