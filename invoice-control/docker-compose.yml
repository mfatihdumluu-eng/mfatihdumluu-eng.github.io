services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: invoice_control
    volumes:
      - invoice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_control"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server:/app:ro
      - invoice_uploads:/var/private-invoices
    command: sh -c "npm install --omit=dev && npm start"
    environment:
      DATABASE_URL: postgres://invoice:${POSTGRES_PASSWORD}@db:5432/invoice_control
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      COOKIE_SECURE: "true"
      STORAGE_PATH: /var/private-invoices
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  invoice_pg:
  invoice_uploads:
