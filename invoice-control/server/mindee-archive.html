<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kaydedilen Faturalar | Invoice Control</title><style>:root{font:14px system-ui,-apple-system,Arial;background:#f5f7fb;color:#26354c}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5f0;padding:19px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;gap:12px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:14px;border:1px solid #e1e7f1;padding:20px;margin:14px 0}h1{margin:0;font-size:24px}a{color:#4054c9;text-decoration:none;font-weight:750}.muted{color:#75849b;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e9edf5}th{font-size:12px;color:#6e809a}.scroll{overflow:auto}.pill{display:inline-block;border-radius:16px;padding:5px 10px;background:#fff0f0;color:#a2384b;font-size:11px;font-weight:750}.badge{background:#f1f4ff;border-radius:8px;padding:7px 10px;color:#4252a5}button{background:#4355c9;color:white;padding:11px 14px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.error{color:#ad3247}.items{font-size:13px}.items div{padding:7px 0;border-bottom:1px solid #edf0f4}</style></head><body><header><strong>✓ Invoice Control · Fatura Kayıtları</strong><div><a href="/admin/invoice-reader">+ Fatura Oku</a> · <a href="https://mfatihdumluu-eng.github.io/invoice-control/">Ana Panel</a></div></header><main><h1>Mindee ile Kaydedilen Faturalar</h1><p class="muted">Kayıtlar gerçek sunucudaki özel veritabanındadır. Taslak/inceleme durumundaki faturalar fiyat karşılaştırmasına otomatik katılmaz.</p><div class="card"><button id="refresh">Listeyi Yenile</button><p id="state" class="muted"></p><div class="scroll"><table><thead><tr><th>Tedarikçi</th><th>Fatura No.</th><th>Tarih</th><th>Genel Toplam</th><th>Ürün</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="details" class="card" style="display:none"></div></main><script>
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=v=>v===null||v===undefined?'—':new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(v));
async function read(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
async function openInvoice(id){try{const d=await read('/api/admin/mindee/invoices/'+encodeURIComponent(id)),x=d.invoice;const items=x.items||[];$('details').style.display='block';$('details').innerHTML='<h2>'+escape(x.supplier_name)+' · '+escape(x.invoice_number)+'</h2><p>Tarih: '+escape(x.invoice_date||'—')+' · Ara toplam: '+money(x.total_net)+' · BTW: '+money(x.total_tax)+' · Genel toplam: <b>'+money(x.total_gross)+'</b></p><div class="items">'+items.map(i=>'<div>'+escape(i.name)+' · '+escape(i.qty)+' × '+money(i.price)+' · '+money(i.lineTotal)+'</div>').join('')+'</div><p class="muted">İnceleme kaydıdır. Fiyat karşılaştırması için ayrıca doğrulama gerekir.</p>';$('details').scrollIntoView({behavior:'smooth'})}catch(e){$('state').textContent=e.message}}
async function load(){try{const d=await read('/api/admin/mindee/invoices');$('state').textContent=d.items.length+' fatura kaydedilmiş.';$('rows').innerHTML=d.items.map(x=>'<tr><td>'+escape(x.supplier_name)+'</td><td><button data-id="'+escape(x.id)+'" style="background:none;color:#4355c9;padding:0">'+escape(x.invoice_number)+'</button></td><td>'+escape(x.invoice_date||'—')+'</td><td>'+money(x.total_gross)+'</td><td>'+Number(x.item_count||0)+'</td><td><span class="pill">İnceleme</span></td></tr>').join('');document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openInvoice(el.dataset.id))}catch(e){$('state').className='error';$('state').textContent=e.message}}
$('refresh').onclick=load;load();
</script></body></html>
