<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kaydedilen Faturalar | Invoice Control</title><style>:root{font:14px system-ui,-apple-system,Arial;background:#f5f7fb;color:#26354c}*{box-sizing:border-box}body{margin:0}header{flex-wrap:wrap;background:#fff;border-bottom:1px solid #dfe5f0;padding:19px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;gap:12px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:14px;border:1px solid #e1e7f1;padding:20px;margin:14px 0}h1{margin:0;font-size:24px}a{color:#4054c9;text-decoration:none;font-weight:750}.muted{color:#75849b;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e9edf5}th{font-size:12px;color:#6e809a}.scroll{overflow:auto}.pill{display:inline-block;border-radius:16px;padding:5px 10px;background:#fff0f0;color:#a2384b;font-size:11px;font-weight:750}.badge{background:#f1f4ff;border-radius:8px;padding:7px 10px;color:#4252a5}button{background:#4355c9;color:white;padding:11px 14px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.error{color:#ad3247}.items{font-size:13px}.items div{padding:7px 0;border-bottom:1px solid #edf0f4}.invoice-lines{table-layout:fixed;font-variant-numeric:tabular-nums;min-width:620px}.invoice-lines th,.invoice-lines td{text-align:right;vertical-align:top}.invoice-lines th:first-child,.invoice-lines td:first-child{text-align:left;width:48%;white-space:pre-wrap;overflow-wrap:anywhere}.invoice-lines small{display:block;color:#7f8ca0;font-size:11px;margin-top:7px}.document-totals{margin:25px 0 20px auto;max-width:330px}.document-totals div{display:flex;justify-content:space-between;gap:20px;padding:10px;border-bottom:1px solid #e6ebf1}.document-totals .grand{border-top:2px solid #243b67;font-size:18px;font-weight:800}.document-heading{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #243b67;padding-bottom:18px}.document-heading h2{margin:0}.invoice-detail-note{margin-top:24px}</style></head><body><header><strong>✓ Invoice Control · Fatura Kayıtları</strong><div><a href="/admin/invoice-reader">+ Fatura Oku</a> · <a href="https://mfatihdumluu-eng.github.io/invoice-control/">Ana Panel</a></div></header><main><h1>Invoice Control OCR ile Kaydedilen Faturalar</h1><p class="muted">Kayıtlar gerçek sunucudaki özel veritabanındadır. Taslak/inceleme durumundaki faturalar fiyat karşılaştırmasına otomatik katılmaz.</p><div class="card"><button id="refresh">Listeyi Yenile</button><p id="state" class="muted"></p><div class="scroll"><table><thead><tr><th>Tedarikçi</th><th>Fatura No.</th><th>Tarih</th><th>Genel Toplam</th><th>Ürün</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="details" class="card" style="display:none"></div></main><script>
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=v=>v===null||v===undefined?'—':new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(v));
async function read(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
const unitMoney=v=>v==null?'—':new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:4}).format(Number(v));
const quantity=v=>v==null?'—':new Intl.NumberFormat('nl-NL',{maximumFractionDigits:4}).format(Number(v));
async function openInvoice(id){
 try{
  const d=await read('/api/admin/ocr/invoices/'+encodeURIComponent(id)),x=d.invoice,items=x.items||[];
  $('details').style.display='block';
  $('details').innerHTML='<div class="document-heading"><div><h2>FATURA</h2><p>'+escape(x.supplier_name)+'</p></div><div><b>'+escape(x.invoice_number)+'</b><p>Tarih: '+escape(String(x.invoice_date||'—').slice(0,10))+'</p></div></div><div class="scroll"><table class="invoice-lines"><thead><tr><th>Ürün / Açıklama</th><th>Miktar</th><th>Birim fiyat</th><th>BTW %</th><th>Satır tutarı</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+escape(i.name)+(i.sku||i.ean?'<small>Kod: '+escape(i.sku||i.ean)+'</small>':'')+(i.discountPercent?'<small>%'+escape(i.discountPercent)+' iskonto</small>':i.discountAmount?'<small>'+money(i.discountAmount)+' iskonto</small>':'')+'</td><td>'+quantity(i.qty)+' '+escape(i.unit||'')+'</td><td>'+unitMoney(i.price)+'</td><td>'+escape(i.vatRate??'—')+'</td><td>'+money(i.lineTotal)+'</td></tr>').join('')+'</tbody></table></div><div class="document-totals"><div><span>Ara toplam</span><span>'+money(x.total_net)+'</span></div><div><span>Fatura iskontosu</span><span>'+money(x.discount)+'</span></div><div><span>BTW toplamı</span><span>'+money(x.total_tax)+'</span></div><div class="grand"><span>Genel toplam</span><span>'+money(x.total_gross)+'</span></div></div><p class="muted invoice-detail-note">İnceleme kaydıdır. Fiyat karşılaştırması için ayrıca doğrulama gerekir.</p>';
  $('details').scrollIntoView({behavior:'smooth'});
 }catch(e){$('state').textContent=e.message;}
}
async function load(){try{const d=await read('/api/admin/ocr/invoices');$('state').textContent=d.items.length+' fatura kaydedilmiş.';$('rows').innerHTML=d.items.map(x=>'<tr><td>'+escape(x.supplier_name)+'</td><td><button data-id="'+escape(x.id)+'" style="background:none;color:#4355c9;padding:0">'+escape(x.invoice_number)+'</button></td><td>'+escape(x.invoice_date||'—')+'</td><td>'+money(x.total_gross)+'</td><td>'+Number(x.item_count||0)+'</td><td><span class="pill">İnceleme</span></td></tr>').join('');document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openInvoice(el.dataset.id))}catch(e){$('state').className='error';$('state').textContent=e.message}}
$('refresh').onclick=load;load();
</script></body></html>
