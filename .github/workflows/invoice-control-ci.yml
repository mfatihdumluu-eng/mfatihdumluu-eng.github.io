name: Invoice Control checks
on:
  push:
    branches: [main]
    paths:
      - 'invoice-control/server/**'
      - '.github/workflows/invoice-control-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check invoice-control/server/src/server.mjs
          node --check invoice-control/server/src/setup.mjs
          node --check invoice-control/server/src/engine.mjs
      - name: Install dependencies
        working-directory: invoice-control/server
        run: npm install --no-audit --no-fund
      - name: Compare engine and Mindee tests
        working-directory: invoice-control/server
        run: npm test
