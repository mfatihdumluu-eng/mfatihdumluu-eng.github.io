<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>EMİGRO Raf Kontrol</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-brand">EMİGRO</div>
      <div class="auth-subtitle">Raf & Tarih Kontrol</div>
      <div id="loginPanel">
        <h1>Giriş yap</h1>
        <p>Size tanımlanan kullanıcı adı ve şifreyle devam edin.</p>
        <label>Kullanıcı adı<input id="loginUsername" autocomplete="username" autocapitalize="none"></label>
        <label>Şifre<input id="loginPassword" type="password" autocomplete="current-password"></label>
        <button class="btn full" id="loginButton">Giriş yap</button>
        <button class="auth-link" id="forgotPassword">Şifremi unuttum</button>
        <div class="auth-message" id="authMessage"></div>
      </div>
      <div id="resetPanel" style="display:none">
        <h1>Yeni şifre oluştur</h1>
        <p>Yeni şifrenizi belirleyin.</p>
        <label>Yeni şifre<input id="resetPassword" type="password" autocomplete="new-password"></label>
        <label>Yeni şifre tekrar<input id="resetPassword2" type="password" autocomplete="new-password"></label>
        <button class="btn full" id="resetPasswordButton">Şifreyi değiştir</button>
        <div class="auth-message" id="resetMessage"></div>
      </div>
    </div>
  </section>

  <div class="app-shell" id="mainApp" style="display:none">
    <div id="connectionBanner" class="connection-banner" hidden></div>
    <header class="topbar">
      <div>
        <div class="brand">EMİGRO</div>
        <div class="subtitle">Raf & Tarih Kontrol</div>
      </div>
      <div class="topbar-actions">
        <button class="system-user-pill" id="systemUserButton" style="display:none">Sistem</button>
        <button class="icon-btn" id="logoutButton" aria-label="Çıkış">⇥</button>
        <button class="icon-btn" id="resetDemo" style="display:none" aria-label="Demo verilerini sıfırla">↻</button>
      </div>
    </header>

    <section class="role-switch" id="roleSwitch">
      <div class="role-label">Demo rolü</div>
      <div class="role-tabs" id="roleTabs">
        <button data-role="employee" class="active">Raf Sorumlusu</button>
        <button data-role="cashier">Kasa</button>
        <button data-role="warehouse">Depo Sorumlusu</button>
        <button data-role="manager">Mağaza Müdürü</button>
        <button data-role="superadmin">Admin</button>
      </div>
    </section>

    <main id="app"></main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <dialog id="modal">
    <div class="modal-head">
      <strong id="modalTitle">Detay</strong>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
