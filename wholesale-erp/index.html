<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wholesale ERP</title><style>body{margin:0;font:14px Arial;background:#f4f6fa;color:#17233c}aside{width:230px;background:#14233d;color:white;position:fixed;inset:0 auto 0 0;padding:24px 12px}aside h2{padding:10px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#d9e3f4;border:0;padding:13px;border-radius:8px;cursor:pointer}nav button:hover,.active{background:#304568}main{margin-left:254px;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.card,.panel{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:22px}.card strong{display:block;font-size:25px;margin-top:12px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:14px;text-align:left;border-bottom:1px solid #eee}input,select{padding:11px;border:1px solid #ccd4df;border-radius:7px;margin:5px}button.primary{background:#2356d8;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}.form{display:grid;grid-template-columns:repeat(3,1fr)}.panel{margin-top:20px}@media(max-width:850px){aside{position:static;width:auto}main{margin:0}.cards,.form{grid-template-columns:1fr}}</style><aside><h2>◈ Wholesale ERP</h2><nav id="nav"></nav></aside><main><header><div><small>Groothandel / Beheer</small><h1 id="heading">Dashboard</h1></div><button class="primary" onclick="newRecord()">+ Nieuw toevoegen</button></header><section id="content"></section></main><script>
const modules=['Dashboard','Producten','Klanten & debiteuren','Voorraad & magazijnen','Verkoop & facturen','Retouren & afval','Inkoop import','Prijzen & goedkeuring','Rapportages','Instellingen'];
const fields={'Producten':['Artikelnaam','Artikelnummer','EAN stuk','EAN verpakking','EAN doos','Categorie','Subcategorie','BTW %','Inkoopprijs','Kostprijs','Groothandelsprijs','Grote winkelprijs','Verkoopprijs','Minimumprijs','Afbeelding URL'],'Klanten & debiteuren':['Bedrijfsnaam','Contactpersoon','BTW nummer','KvK nummer','IBAN','E-mail','Telefoon','Adres','Postcode','Plaats','Prijsniveau','Kredietlimiet'],'Voorraad & magazijnen':['Artikelnummer','Magazijn','Aantal','Eenheid','Batch','Houdbaarheidsdatum','Type mutatie'],'Verkoop & facturen':['Klant','Factuurnummer','Factuurdatum','Artikelnummer','Aantal','Eenheid','Prijs excl. BTW','BTW %','Status'],'Retouren & afval':['Klant','Artikelnummer','Aantal','Reden','Bestemming','Referentie factuur'],'Prijzen & goedkeuring':['Klant','Artikelnummer','Speciale prijs','Minimumprijs','Goedkeuringsstatus']};
const dbKey='wholesale_erp_demo_v1';let db=JSON.parse(localStorage.getItem(dbKey)||'{}');let current='Dashboard';function save(){localStorage.setItem(dbKey,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function nav(){document.getElementById('nav').innerHTML=modules.map(m=>'<button class="'+(m===current?'active':'')+'" data-module="'+esc(m)+'">'+esc(m)+'</button>').join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{current=b.dataset.module;render()})}function render(){nav();document.getElementById('heading').textContent=current;let el=document.getElementById('content');if(current==='Dashboard'){el.innerHTML='<div class="cards">'+[['Omzet','€ 0,00'],['Brutowinst','€ 0,00'],['Openstaande facturen','0'],['Artikelen',(db.Producten||[]).length]].map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel"><h3>Welkom bij Wholesale ERP</h3><p>Beheer artikelen, klanten, voorraad, retouren en prijsafspraken. Demo-opslag in deze browser; nog niet gekoppeld aan een server of SnelStart.</p></div>';return}let data=db[current]||[];el.innerHTML='<div class="panel"><h3>'+esc(current)+'</h3><p>'+(fields[current]?'Gegevensbeheer en registratie':'Module gereserveerd voor verdere integratie.')+'</p>'+(data.length?'<table><thead><tr>'+Object.keys(data[0]).map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+Object.values(r).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p>Nog geen gegevens.</p>')+'</div>'}function newRecord(){if(!fields[current]){alert('Deze module is nog niet beschikbaar in de demo.');return}let inputs=fields[current].map((f,i)=>'<label>'+esc(f)+'<br><input name="f'+i+'" placeholder="'+esc(f)+'"></label>').join('');document.getElementById('content').insertAdjacentHTML('afterbegin','<div class="panel"><h3>Nieuwe registratie</h3><form id="record" class="form">'+inputs+'<div><button class="primary">Opslaan</button></div></form></div>');document.getElementById('record').onsubmit=e=>{e.preventDefault();let row={};fields[current].forEach((f,i)=>row[f]=e.target.elements['f'+i].value);(db[current]??=[]).push(row);save();render()}}render();</script></html>
