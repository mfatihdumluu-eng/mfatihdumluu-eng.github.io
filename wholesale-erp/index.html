<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wholesale ERP | Groothandelbeheer</title><style>
:root{font:14px Inter,system-ui,Arial,sans-serif;color:#1b2b45;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{width:242px;background:#10233f;color:#e3ecf8;position:fixed;inset:0 auto 0 0;padding:20px 12px;overflow:auto}aside h2{margin:8px 12px 30px;font-size:19px;color:white}aside button{display:flex;align-items:center;width:100%;text-align:left;background:none;color:#c5d5eb;border:0;border-radius:9px;padding:12px 14px;margin:2px 0}aside button:hover,aside button.active{background:#28436b;color:white}aside small{display:block;color:#90a8c9;margin:24px 12px 10px}main{margin-left:242px;padding:30px;max-width:1800px}header,.toolbar,.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;margin:5px 0}h3{margin:0 0 14px}small,.muted{color:#718096}.btn{border:1px solid #d5deeb;background:white;padding:10px 15px;border-radius:8px;color:#23436d}.primary{background:#2457d6;color:white;border-color:#2457d6}.danger{color:#b42e39}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.card,.panel{background:white;border:1px solid #e3e8f0;border-radius:12px;padding:21px;box-shadow:0 2px 10px #14253d06}.card strong{display:block;font-size:25px;margin-top:12px}.panel{margin:20px 0;overflow:auto}.pill{display:inline-block;background:#eaf1ff;color:#2753a1;border-radius:30px;padding:5px 10px;font-size:12px}.warning{background:#fff1df;color:#a65a09}.ok{background:#e8f8ef;color:#177647}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px;border-bottom:1px solid #eef0f4;vertical-align:middle}th{font-size:12px;color:#61718b;background:#f8fafd}tr:hover td{background:#fafbff}.search{width:300px;max-width:100%}input,select,textarea{border:1px solid #cfd8e6;border-radius:8px;padding:10px 11px;background:white;max-width:100%}input:focus,select:focus{outline:2px solid #b5cafa}label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12px;color:#41516a}label input,label select{width:100%;font-weight:400}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-radius:8px;background:#eef5ff;margin:12px 0}.modalback{position:fixed;inset:0;background:#0b1830a6;display:flex;justify-content:center;align-items:flex-start;padding:5vh 15px;z-index:5;overflow:auto}.modal{width:min(980px,100%);background:white;padding:25px;border-radius:14px;box-shadow:0 15px 50px #0003}.modal h2{margin-top:0}.sectiontitle{grid-column:1/-1;margin:10px 0 0;color:#2457d6}.empty{text-align:center;padding:35px;color:#718096}.tag{font-size:11px;border:1px solid #ccd7e5;padding:3px 6px;border-radius:5px}.scroll{overflow:auto}#toast{position:fixed;right:24px;bottom:24px;background:#173d70;color:white;padding:13px 20px;border-radius:10px;display:none;z-index:10}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){aside{position:static;width:auto;max-height:160px}aside h2{margin:0 10px 8px}aside nav{display:flex;overflow:auto}aside button{white-space:nowrap}aside small{display:none}main{margin:0;padding:15px}.cards,.formgrid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><aside><h2>◈ Wholesale ERP</h2><small>WERKOMGEVING</small><nav id="nav"></nav><small>LOKALE DEMO · GEEN LIVE BOEKHOUDING</small></aside><main><header><div><small>Groothandelbeheer / <span id="crumb">Dashboard</span></small><h1 id="title">Dashboard</h1></div><div class="actions"><button class="btn" onclick="exportData()">↓ Back-up JSON</button><button class="btn primary" onclick="newItem()">+ Nieuw</button></div></header><div id="view"></div></main><div id="overlay"></div><div id="toast"></div><script>
'use strict';
const KEY='wholesale_erp_v2', menu=[['dashboard','◫ Dashboard'],['products','▣ Artikelen'],['customers','♧ Klanten & debiteuren'],['stock','▤ Voorraad'],['orders','▦ Verkoop & facturen'],['returns','↩ Retouren & afval'],['purchase','⇩ Inkoop import'],['prices','€ Prijsafspraken'],['approvals','✓ Goedkeuringen'],['reports','▥ Rapportages'],['settings','⚙ Instellingen']];
const defaultDB=()=>({products:[],customers:[],movements:[],orders:[],returns:[],prices:[],approvals:[],imports:[],settings:{company:'Mijn Groothandel',vat:'',iban:'',invoicePrefix:'INV',nextInvoice:1}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaultDB()}catch(e){db=defaultDB()}for(const [k,v] of Object.entries(defaultDB()))if(db[k]===undefined)db[k]=v;
let page='dashboard',filter='',editId=null,lines=[];
const id=()=>crypto.randomUUID?.()||'id'+Date.now()+Math.random().toString(36).slice(2);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const num=n=>Number(String(n??0).replace(',','.'))||0;
const date=()=>new Date().toISOString().slice(0,10);
const by=(type,key)=>db[type].find(x=>x.id===key);
const product=k=>by('products',k)||{};
const customer=k=>by('customers',k)||{};
const stock=(pid,warehouse='Verkoopbaar')=>db.movements.filter(m=>m.productId===pid&&m.warehouse===warehouse).reduce((a,m)=>a+num(m.qty),0);
const sales=()=>db.orders.filter(o=>o.status!=='Concept');
const total=o=>(o.lines||[]).reduce((s,l)=>s+num(l.qty)*num(l.price),0);
const vatTotal=o=>(o.lines||[]).reduce((s,l)=>s+num(l.qty)*num(l.price)*num(l.vat)/100,0);
const toast=s=>{let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
const opt=(arr,value='',placeholder='Selecteer')=>'<option value="">'+placeholder+'</option>'+arr.map(x=>'<option value="'+e(x.id??x)+'" '+(String(x.id??x)===String(value)?'selected':'')+'>'+e(x.name??x)+'</option>').join('');
const btn=(label,fn,kind='')=>'<button type="button" class="btn '+kind+'" onclick="'+fn+'">'+label+'</button>';
const cell=(text)=>'<td>'+text+'</td>';
const tbl=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(h=>'<th>'+e(h)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+heads.length+'" class="empty">Nog geen gegevens. Klik op + Nieuw om te beginnen.</td></tr>')+'</tbody></table></div>';
const panel=(title,body)=>'<div class="panel"><h3>'+title+'</h3>'+body+'</div>';
const badge=(s)=>'<span class="pill '+(s==='Betaald'||s==='Goedgekeurd'?'ok':s==='In afwachting'?'warning':'')+'">'+e(s)+'</span>';
function navigate(p){page=p;filter='';render()}
function render(){document.getElementById('nav').innerHTML=menu.map(([k,n])=>'<button class="'+(k===page?'active':'')+'" onclick="navigate(\''+k+'\')">'+n+'</button>').join('');document.getElementById('title').textContent=menu.find(x=>x[0]===page)[1].slice(2);document.getElementById('crumb').textContent=page;const v=document.getElementById('view');v.innerHTML=({dashboard:dashboard,products:products,customers:customers,stock:stockPage,orders:orders,returns:returnsPage,purchase:purchasePage,prices:pricesPage,approvals:approvalsPage,reports:reports,settings:settingsPage})[page]()}
function searchBar(){return '<input class="search" placeholder="Zoeken..." value="'+e(filter)+'" oninput="filter=this.value.toLowerCase();renderTable()" id="searchBox">'}
function renderTable(){const f=document.activeElement?.id==='searchBox';const pos=f?document.activeElement.selectionStart:0;render();if(f){const input=document.getElementById('searchBox');input?.focus();input?.setSelectionRange(pos,pos)}}
function match(...x){return x.join(' ').toLowerCase().includes(filter)}
function dashboard(){const turnover=sales().reduce((s,o)=>s+total(o),0);const profit=sales().reduce((s,o)=>s+(o.lines||[]).reduce((a,l)=>a+num(l.qty)*(num(l.price)-num(l.cost)),0),0);const outstanding=sales().filter(o=>o.status!=='Betaald').reduce((s,o)=>s+total(o)+vatTotal(o),0);const low=db.products.filter(p=>stock(p.id)<=num(p.minStock));return '<div class="cards">'+[['Omzet excl. btw',money(turnover)],['Brutowinst',money(profit)],['Openstaand incl. btw',money(outstanding)],['Artikelen',db.products.length]].map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div>'+panel('Aandachtspunten',low.length?'<p>'+badge(low.length+' artikelen met lage voorraad')+'</p>'+low.map(p=>'<p>'+e(p.name)+' · '+stock(p.id)+' / minimum '+e(p.minStock)+'</p>').join(''):'<p>Geen voorraadwaarschuwingen.</p>')+panel('Snel aan de slag','<div class="actions">'+btn('Artikel toevoegen',"navigate('products');newItem()",'primary')+btn('Klant toevoegen',"navigate('customers');newItem()")+btn('Factuur maken',"navigate('orders');newItem()")+btn('Voorraad boeken',"navigate('stock');newItem()")+'</div><p class="muted">Deze versie werkt lokaal in uw browser. Gebruik Back-up JSON om gegevens veilig te stellen.</p>')}
function products(){return panel('Artikelbeheer <span class="tag">'+db.products.length+' artikelen</span>',searchBar()+tbl(['Artikel','EAN / doos','Categorie','Inkoop','Verkoop','Voorraad','Acties'],db.products.filter(p=>match(p.name,p.sku,p.barcode,p.category)).map(p=>'<tr>'+cell('<strong>'+e(p.name)+'</strong><br><small>'+e(p.sku)+'</small>')+cell(e(p.barcode)+'<br><small>'+e(p.boxBarcode)+'</small>')+cell(e(p.category)) +cell(money(p.purchase))+cell(money(p.retail))+cell(stock(p.id))+cell(btn('Bewerken',"openForm('products','"+p.id+"')")+btn('Prijs',"navigate('prices');newItem()"))+'</tr>')))}
function customers(){return panel('Klantenbestand',searchBar()+tbl(['Klant','BTW','E-mail','Prijsniveau','Status','Acties'],db.customers.filter(c=>match(c.name,c.vat,c.email)).map(c=>'<tr>'+cell('<strong>'+e(c.name)+'</strong><br><small>'+e(c.city)+'</small>')+cell(e(c.vat))+cell(e(c.email))+cell(e(c.tier))+cell(badge(c.status||'Actief'))+cell(btn('Bewerken',"openForm('customers','"+c.id+"')"))+'</tr>')))}
function stockPage(){return panel('Voorraad per magazijn',searchBar()+tbl(['Artikel','Verkoopbaar','Retour','Afval','Minimum'],db.products.filter(p=>match(p.name,p.sku)).map(p=>'<tr>'+cell(e(p.name))+cell(stock(p.id))+cell(stock(p.id,'Retour'))+cell(stock(p.id,'Afval'))+cell(e(p.minStock))+'</tr>')))+panel('Recente voorraadmutaties',tbl(['Datum','Artikel','Magazijn','Aantal','Reden'],db.movements.slice(-15).reverse().map(m=>'<tr>'+cell(e(m.date))+cell(e(product(m.productId).name))+cell(e(m.warehouse))+cell(e(m.qty))+cell(e(m.reason))+'</tr>')))}
function orders(){return panel('Verkoopfacturen',searchBar()+tbl(['Factuur','Datum','Klant','Excl. BTW','Incl. BTW','Status','Acties'],db.orders.filter(o=>match(o.number,customer(o.customerId).name)).map(o=>'<tr>'+cell(e(o.number))+cell(e(o.date))+cell(e(customer(o.customerId).name))+cell(money(total(o)))+cell(money(total(o)+vatTotal(o)))+cell(badge(o.status))+cell(btn('Afdrukken',"printInvoice('"+o.id+"')")+btn('Status',"setOrderStatus('"+o.id+"')"))+'</tr>')))}
function returnsPage(){return panel('Retouren en afboekingen',tbl(['Datum','Klant','Artikel','Aantal','Bestemming','Reden'],db.returns.map(r=>'<tr>'+cell(e(r.date))+cell(e(customer(r.customerId).name))+cell(e(product(r.productId).name))+cell(e(r.qty))+cell(e(r.destination))+cell(e(r.reason))+'</tr>')))}
function purchasePage(){return panel('Inkoopfactuur importeren','<p>Importeer CSV met kolommen <code>barcode;naam;aantal;prijs</code>. Controleer de matches voordat u voorraad boekt.</p><input type="file" accept=".csv,text/csv" id="csvfile"> '+btn('CSV inlezen',"importCSV()",'primary')+'<div id="importPreview"></div>')+panel('Importhistorie',tbl(['Datum','Aantal regels','Status'],db.imports.map(x=>'<tr>'+cell(e(x.date))+cell(e(x.count))+cell(e(x.status))+'</tr>')))}
function pricesPage(){return panel('Klantgebonden prijzen',tbl(['Klant','Artikel','Speciale prijs','Acties'],db.prices.map(p=>'<tr>'+cell(e(customer(p.customerId).name))+cell(e(product(p.productId).name))+cell(money(p.price))+cell(btn('Bewerken',"openForm('prices','"+p.id+"')"))+'</tr>')))}
function approvalsPage(){return panel('Prijsgoedkeuringen',tbl(['Datum','Klant','Artikel','Gevraagde prijs','Minimum','Status','Acties'],db.approvals.map(a=>'<tr>'+cell(e(a.date))+cell(e(customer(a.customerId).name))+cell(e(product(a.productId).name))+cell(money(a.price))+cell(money(a.minimum))+cell(badge(a.status))+cell(a.status==='In afwachting'?btn('Goedkeuren',"approve('"+a.id+"')",'primary')+btn('Afwijzen',"reject('"+a.id+"')",'danger'):'')+'</tr>')))}
function reports(){const sums={};for(const o of sales())for(const l of o.lines){let k=l.productId;sums[k]??={qty:0,revenue:0,cost:0,customers:new Set()};sums[k].qty+=num(l.qty);sums[k].revenue+=num(l.qty)*num(l.price);sums[k].cost+=num(l.qty)*num(l.cost);sums[k].customers.add(o.customerId)}return panel('Verkoop per artikel',tbl(['Artikel','Aantal','Omzet','Brutowinst','Klanten'],Object.entries(sums).map(([k,x])=>'<tr>'+cell(e(product(k).name))+cell(x.qty)+cell(money(x.revenue))+cell(money(x.revenue-x.cost))+cell([...x.customers].map(k=>e(customer(k).name)).join(', '))+'</tr>')))+panel('Omzet per klant',tbl(['Klant','Omzet excl. btw','Facturen'],db.customers.map(c=>{let a=sales().filter(o=>o.customerId===c.id);return '<tr>'+cell(e(c.name))+cell(money(a.reduce((s,o)=>s+total(o),0)))+cell(a.length)+'</tr>'})))}
function settingsPage(){return panel('Bedrijfsgegevens','<form id="settingsForm" class="formgrid">'+['company|Bedrijfsnaam','vat|BTW-nummer','iban|IBAN','invoicePrefix|Factuurprefix'].map(x=>{let [k,l]=x.split('|');return field(k,l,db.settings[k])}).join('')+'<div><button class="btn primary">Opslaan</button></div></form><p class="muted">SnelStart-koppeling, gebruikersrechten en serverdatabase vereisen een beveiligde backend.</p>')+panel('Gegevensbeheer','<div class="actions">'+btn('Back-up downloaden','exportData()')+'<label>Back-up herstellen<input type="file" accept=".json" onchange="restoreData(this.files[0])"></label></div>')}
function field(key,label,value='',type='text'){return '<label>'+e(label)+'<input type="'+type+'" name="'+e(key)+'" value="'+e(value)+'"></label>'}
function selectField(key,label,options,value=''){return '<label>'+e(label)+'<select name="'+e(key)+'">'+opt(options,value)+'</select></label>'}
function modal(title,content,onSubmit){document.getElementById('overlay').innerHTML='<div class="modalback" onclick="closeModal(event)"><div class="modal"><div class="flex"><h2>'+title+'</h2>'+btn('✕','closeModal()')+'</div><form id="editor">'+content+'<div class="actions" style="margin-top:22px"><button class="btn primary">Opslaan</button>'+btn('Annuleren','closeModal()')+'</div></form></div></div>';document.getElementById('editor').onsubmit=onSubmit}
function closeModal(ev){if(!ev||ev.target.classList.contains('modalback'))document.getElementById('overlay').innerHTML=''}
function newItem(){if(page==='dashboard'){navigate('products');return newItem()}if(page==='reports'||page==='approvals'||page==='settings'){toast('Kies een invoermodule');return}if(page==='orders')return invoiceForm();if(page==='purchase'){document.getElementById('csvfile')?.click();return}openForm(page)}
function openForm(type,recordId){let old=(db[type]||[]).find(x=>x.id===recordId)||{};let content='';
if(type==='products')content='<div class="formgrid">'+field('name','Artikelnaam',old.name)+field('sku','Artikelnummer',old.sku)+field('barcode','EAN stuk',old.barcode)+field('packBarcode','EAN verpakking',old.packBarcode)+field('boxBarcode','EAN doos',old.boxBarcode)+field('packSize','Stuks per verpakking',old.packSize||1,'number')+field('boxSize','Stuks per doos',old.boxSize||1,'number')+field('category','Categorie',old.category)+field('subcategory','Subcategorie',old.subcategory)+field('vat','BTW %',old.vat??9,'number')+field('purchase','Inkoopprijs excl. BTW',old.purchase,'number')+field('cost','Kostprijs excl. BTW',old.cost,'number')+field('wholesale','Groothandelsprijs',old.wholesale,'number')+field('largeStore','Grote winkelprijs',old.largeStore,'number')+field('retail','Verkoopprijs',old.retail,'number')+field('minimum','Minimum verkoopprijs',old.minimum,'number')+field('minStock','Minimumvoorraad',old.minStock||0,'number')+field('image','Afbeelding URL',old.image)+'</div>';
if(type==='customers')content='<div class="formgrid">'+field('name','Bedrijfsnaam',old.name)+field('contact','Contactpersoon',old.contact)+field('vat','BTW-nummer',old.vat)+field('kvk','KvK',old.kvk)+field('iban','IBAN',old.iban)+field('email','E-mail',old.email,'email')+field('phone','Telefoon',old.phone)+field('address','Adres',old.address)+field('postcode','Postcode',old.postcode)+field('city','Plaats',old.city)+selectField('tier','Prijsniveau',['Groothandel','Grote winkel','Normaal'],old.tier||'Normaal')+field('credit','Kredietlimiet',old.credit,'number')+selectField('status','Status',['Actief','In afwachting','Geblokkeerd'],old.status||'Actief')+'</div>';
if(type==='stock')content='<div class="formgrid">'+selectField('productId','Artikel',db.products,old.productId)+selectField('warehouse','Magazijn',['Verkoopbaar','Retour','Afval'],old.warehouse||'Verkoopbaar')+field('qty','Mutatie (+ of -) in stuks',old.qty,'number')+field('date','Datum',old.date||date(),'date')+field('batch','Batch',old.batch)+field('expiry','THT',old.expiry,'date')+field('reason','Reden',old.reason||'Inkoop')+'</div>';
if(type==='returns')content='<div class="formgrid">'+selectField('customerId','Klant',db.customers,old.customerId)+selectField('productId','Artikel',db.products,old.productId)+field('qty','Aantal stuks',old.qty,'number')+selectField('destination','Bestemming',['Verkoopbaar','Retour','Afval'],old.destination||'Retour')+selectField('reason','Reden',['Verkeerd geleverd','Beschadigd','Over datum','Anders'],old.reason)+field('date','Datum',old.date||date(),'date')+'</div>';
if(type==='prices')content='<div class="formgrid">'+selectField('customerId','Klant',db.customers,old.customerId)+selectField('productId','Artikel',db.products,old.productId)+field('price','Vaste prijs excl. BTW',old.price,'number')+'</div>';
if(!content){toast('Gebruik de specifieke invoerfunctie');return}
modal(recordId?'Bewerken':'Nieuw toevoegen',content,ev=>{ev.preventDefault();let data=Object.fromEntries(new FormData(ev.target));if(type==='products'&&!data.name.trim()||type==='customers'&&!data.name.trim()){toast('Naam is verplicht');return}if(type==='stock'&&(!data.productId||!num(data.qty))){toast('Kies een artikel en aantal');return}if(type==='returns'&&(!data.productId||num(data.qty)<=0)){toast('Kies een artikel en geldig aantal');return}if(type==='prices'&&(!data.productId||!data.customerId)){toast('Selecteer klant en artikel');return}if(type==='stock'){db.movements.push({id:id(),...data});}else if(type==='returns'){let q=num(data.qty);db.returns.push({id:id(),...data});db.movements.push({id:id(),productId:data.productId,warehouse:data.destination,qty:q,date:data.date,reason:'Retour: '+data.reason});}else{if(recordId)Object.assign(old,data);else db[type].push({id:id(),...data})}save();closeModal();render();toast('Opgeslagen')})}
function priceFor(p,c){let special=db.prices.find(x=>x.productId===p.id&&x.customerId===c.id);return special?num(special.price):num(c.tier==='Groothandel'?p.wholesale:c.tier==='Grote winkel'?p.largeStore:p.retail)}
function invoiceForm(){if(!db.customers.length||!db.products.length){toast('Maak eerst een klant en artikel aan');return}lines=[];modal('Nieuwe verkoopfactuur','<div class="formgrid">'+selectField('customerId','Klant',db.customers)+field('date','Factuurdatum',date(),'date')+selectField('status','Status',['Definitief','Concept'],'Definitief')+'</div><h3 style="margin-top:25px">Factuurregels</h3><div id="lineRows"></div>'+btn('+ Artikelregel',"addLine()")+'<div id="lineTotal"></div>',ev=>{ev.preventDefault();const f=ev.target,meta=Object.fromEntries(new FormData(f));let rows=[...f.querySelectorAll('.invoiceLine')].map(r=>({productId:r.querySelector('[name=productId]').value,qty:num(r.querySelector('[name=qty]').value),price:num(r.querySelector('[name=price]').value),vat:num(r.querySelector('[name=vat]').value),cost:num(product(r.querySelector('[name=productId]').value).cost)})).filter(l=>l.productId&&l.qty>0);if(!meta.customerId||!rows.length){toast('Selecteer klant en minimaal één artikel');return}let needsApproval=rows.some(l=>l.price<num(product(l.productId).minimum));let number=(db.settings.invoicePrefix||'INV')+'-'+String(db.settings.nextInvoice).padStart(5,'0');let status=needsApproval?'Concept':meta.status;let order={id:id(),number,date:meta.date,customerId:meta.customerId,lines:rows,status};db.orders.push(order);db.settings.nextInvoice++;if(needsApproval)rows.filter(l=>l.price<num(product(l.productId).minimum)).forEach(l=>db.approvals.push({id:id(),date:date(),orderId:order.id,customerId:meta.customerId,productId:l.productId,price:l.price,minimum:product(l.productId).minimum,status:'In afwachting'}));if(status==='Definitief')bookOrder(order);save();closeModal();render();toast(needsApproval?'Concept opgeslagen; prijsgoedkeuring vereist':'Factuur opgeslagen')});document.querySelector('[name=customerId]').onchange=refreshLinePrices;addLine()}
function addLine(){let wrap=document.getElementById('lineRows');wrap.insertAdjacentHTML('beforeend','<div class="invoiceLine flex" style="margin:10px 0;flex-wrap:wrap"><select name="productId" onchange="updateLine(this)">'+opt(db.products)+'</select><input name="qty" type="number" min="1" value="1" style="width:85px" oninput="lineTotal()"><input name="price" type="number" step="0.01" min="0" placeholder="Prijs" style="width:115px" oninput="lineTotal()"><input name="vat" type="number" value="9" style="width:75px" oninput="lineTotal()">'+btn('Verwijder','this.closest(".invoiceLine").remove();lineTotal()','danger')+'</div>');lineTotal()}
function updateLine(el){let row=el.closest('.invoiceLine'),p=product(el.value),c=customer(document.querySelector('[name=customerId]').value);row.querySelector('[name=price]').value=priceFor(p,c);row.querySelector('[name=vat]').value=p.vat||9;lineTotal()}
function refreshLinePrices(){document.querySelectorAll('.invoiceLine [name=productId]').forEach(updateLine)}
function lineTotal(){let sum=0;document.querySelectorAll('.invoiceLine').forEach(r=>sum+=num(r.querySelector('[name=qty]').value)*num(r.querySelector('[name=price]').value));let el=document.getElementById('lineTotal');if(el)el.innerHTML='<h3 style="margin-top:18px">Totaal excl. BTW: '+money(sum)+'</h3>'}
function bookOrder(o){for(const l of o.lines)db.movements.push({id:id(),productId:l.productId,warehouse:'Verkoopbaar',qty:-num(l.qty),date:o.date,reason:'Verkoop '+o.number})}
function setOrderStatus(k){let o=by('orders',k);if(o.status==='Concept'){if(db.approvals.some(a=>a.orderId===k&&a.status!=='Goedgekeurd'))return toast('Wacht op goedkeuring');o.status='Definitief';bookOrder(o)}else if(o.status==='Definitief')o.status='Betaald';else return toast('Factuur is al betaald');save();render()}
function approve(k){by('approvals',k).status='Goedgekeurd';save();render()}function reject(k){by('approvals',k).status='Afgewezen';save();render()}
function printInvoice(k){let o=by('orders',k),c=customer(o.customerId);let w=window.open('','_blank');if(!w)return toast('Sta pop-ups toe');w.document.write('<html><meta charset="utf-8"><title>'+e(o.number)+'</title><style>body{font:14px Arial;margin:45px}table{width:100%;border-collapse:collapse;margin-top:30px}td,th{border-bottom:1px solid #ccc;padding:12px;text-align:left}</style><h1>FACTUUR '+e(o.number)+'</h1><p>'+e(db.settings.company)+'<br>BTW: '+e(db.settings.vat)+'<br>IBAN: '+e(db.settings.iban)+'</p><p><strong>'+e(c.name)+'</strong><br>'+e(c.address)+' '+e(c.city)+'<br>BTW: '+e(c.vat)+'</p><p>Datum: '+e(o.date)+'</p><table><tr><th>EAN</th><th>Artikel</th><th>Aantal</th><th>Prijs</th><th>Bedrag</th></tr>'+o.lines.map(l=>'<tr><td>'+e(product(l.productId).barcode)+'</td><td>'+e(product(l.productId).name)+'</td><td>'+e(l.qty)+'</td><td>'+money(l.price)+'</td><td>'+money(l.qty*l.price)+'</td></tr>').join('')+'</table><h3>Excl. BTW: '+money(total(o))+'</h3><h3>BTW: '+money(vatTotal(o))+'</h3><h2>Te betalen: '+money(total(o)+vatTotal(o))+'</h2></html>');w.document.close();w.print()}
function importCSV(){let file=document.getElementById('csvfile').files[0];if(!file)return toast('Selecteer een CSV-bestand');file.text().then(text=>{let rows=text.trim().split(/\r?\n/).slice(1).map(l=>l.split(';'));let preview=document.getElementById('importPreview');preview.innerHTML=panel('Controleer artikelkoppelingen',tbl(['Barcode','Omschrijving','Aantal','Inkoopprijs','Gekoppeld artikel'],rows.map((r,i)=>{let p=db.products.find(p=>p.barcode===r[0]||p.boxBarcode===r[0]);return '<tr>'+cell(e(r[0]))+cell(e(r[1]))+cell(e(r[2]))+cell(e(r[3]))+cell('<select id="match'+i+'">'+opt(db.products,p?.id)+'</select>')+'</tr>'}))+btn('Goedgekeurde regels boeken',"bookImport()",'primary'));window.pendingImport=rows})}
function bookImport(){let count=0;window.pendingImport?.forEach((r,i)=>{let pid=document.getElementById('match'+i)?.value;if(pid&&num(r[2])>0){db.movements.push({id:id(),productId:pid,warehouse:'Verkoopbaar',qty:num(r[2]),date:date(),reason:'CSV inkoop'});count++}});db.imports.push({id:id(),date:date(),count,status:'Geboekt'});save();render();toast(count+' regels geboekt')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='wholesale-backup-'+date()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(file){if(!file)return;file.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.products)||!Array.isArray(v.customers))throw Error();if(!confirm('Huidige lokale gegevens vervangen door back-up?'))return;db=v;save();render();toast('Back-up hersteld')}catch(e){toast('Ongeldige back-up')}})}
document.addEventListener('submit',ev=>{if(ev.target.id==='settingsForm'){ev.preventDefault();Object.assign(db.settings,Object.fromEntries(new FormData(ev.target)));save();toast('Instellingen opgeslagen')}});
render();
</script></body></html>
